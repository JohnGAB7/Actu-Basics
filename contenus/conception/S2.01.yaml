  fr: "Fréquences et tableaux"
  en: "Counts, frequencies and tables"
question_centrale:
  fr: "Comment résumer 1 000 réponses sans les lire une par une ?"
  en: "How do you sum up 1,000 answers without reading them one by one?"

position: {pilier: statistiques, niveau: 1, module: S2, rang_dans_module: 1}

