    - {notion: "Variable ordonnée ou non", episode: EP-S1A, rappel: "Dit au cumul : on peut cumuler « au plus deux » parce que les nombres sont rangés ; pour un mode de transport, l'ordre est choisi"}
    - {notion: "Fraction et pourcentage", episode: EP-M01, rappel: "10 sur 25, c'est 10 ÷ 25 = 0,4, soit 40 %"}
    - {notion: "Lire un graphique : axes", episode: EP-M01, rappel: "Axes nommés à voix haute au premier diagramme"}

