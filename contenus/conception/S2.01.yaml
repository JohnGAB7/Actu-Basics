  fr:
    - "Construire un tableau d'effectifs et de fréquences, et vérifier les totaux (effectif total, 100 %)"
    - "Calculer et interpréter une fréquence cumulée (« au plus deux »)"
    - "Comparer deux groupes de tailles différentes par leurs fréquences, pas leurs effectifs"
  en:
    - "Build a table of counts and frequencies, and check the totals (total count, 100%)"
    - "Compute and interpret a cumulative frequency (“at most two”)"
    - "Compare two groups of different sizes by their frequencies, not their counts"

