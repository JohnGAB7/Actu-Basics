  - {hypothese: "Population complète", intuition: "On décrit la classe, on ne généralise pas", testable: "", non_testable: "", diagnostic: "", si_elle_echoue: "Sur un échantillon, une fréquence a une marge d'erreur (EP-S6)"}

reproductibilite: "Calculs entièrement à l'écran ; blocs verifier de la fiche de production"

deroule:
  - {etape: question, contenu: "Mille réponses : comment les résumer ? On part de 25 élèves"}
  - {etape: donnees, contenu: "Frères et sœurs : 5, 10, 6, 4 ; vérifier le total 25"}
  - {etape: formalisation, contenu: "Fréquence = effectif ÷ total ; tableau 20, 40, 24, 16 % ; total 100 %"}
  - {etape: raisonnement, contenu: "Fréquences cumulées : 20, 60, 84, 100 % ; 84 % ont au plus deux frères et sœurs"}
  - {etape: limites, contenu: "Le piège : classes de 25 et 40 élèves, 10 contre 12, mais 40 % contre 30 %"}
  - {etape: exercice, contenu: "20 salariés : 8 voiture, 6 transports en commun, 4 vélo, 2 marche"}
  - {etape: correction, contenu: "40, 30, 20, 10 % ; cumul dans l'ordre choisi 40, 70, 90, 100 %"}
  - {etape: rappel, contenu: "Dans l'épisode, remplacé par la synthèse commune ; transition vers le chapitre 2"}

formules:
  - {formule: "fréquence = effectif / total", explication_symboles: "effectif d'une modalité ; total des individus", conditions: "somme des fréquences = 100 %"}
  - {formule: "fréquence cumulée = somme des fréquences jusqu'à la modalité", explication_symboles: "", conditions: "modalités rangées dans un ordre ; naturel si la variable est ordonnée, choisi sinon"}

calculs_a_verifier:
  - {expression: "5 + 10 + 6 + 4", attendu: 25, libelle: "Total des effectifs"}
  - {expression: "10 / 25 * 100", attendu: 40, libelle: "Fréquence de « 1 », en %"}
  - {expression: "20 + 40 + 24", attendu: 84, libelle: "Cumul jusqu'à 2"}
  - {expression: "12 / 40 * 100", attendu: 30, libelle: "Classe B, en %"}
  - {expression: "8 / 20 * 100", attendu: 40, libelle: "Voiture, en %"}
  - {expression: "40 + 30 + 20", attendu: 90, libelle: "Cumul jusqu'au vélo"}

idees_fausses:
  - {idee: "Oublier le total", desamorcee_a_l_etape: "Compter : les effectifs"}
  - {idee: "Comparer des effectifs de groupes de tailles différentes", desamorcee_a_l_etape: "Le piège : comparer des effectifs"}

exercice:
  question: "20 salariés : 8 voiture, 6 transports en commun, 4 vélo, 2 marche. Fréquences et cumul ?"
  correction: "8/20 = 40 %, 6/20 = 30 %, 4/20 = 20 %, 2/20 = 10 % ; cumul dans cet ordre 40, 70, 90, 100 %. La variable n'étant pas ordonnée, le cumul dépend de l'ordre choisi (ici du plus fréquent au moins fréquent)."
  pause_secondes: 8

preuve_apprentissage:
  tache: "Construire sans aide le tableau d'effectifs et de fréquences de l'exercice"
  question_de_transfert: "Ville A : 300 cyclistes sur 2 000 habitants ; ville B : 400 sur 5 000. Où fait-on le plus de vélo ?"
  diagnostic_d_erreur: "« 12 élèves, c'est plus que 10, donc la classe B a plus d'élèves avec un frère ou une sœur » : qu'est-ce qui manque ?"
  limite_a_enoncer: "Une fréquence ne dit rien du nombre d'individus : 40 % de 25 ou de 25 000 n'ont pas le même poids"

