# ------------------------------------------------------------------ déroulé de l'épisode
deroule_episode:
  - bloc: ouverture
    duree_s: 20
    fr: "Combien d'habitants à Paris ? Deux virgule un millions. Ou onze millions. Ou treize virgule trois millions. Combien de chômeurs en France ? Deux virgule sept millions. Ou trois virgule trois millions. Ces cinq chiffres sont tous justes. Alors, comment savoir lequel croire ?"
    en: "How many people live in Paris? Two point one million. Or eleven million. Or thirteen point three million. How many people are unemployed in France? Two point seven million. Or three point three million. All five figures are correct. So how do you know which one to believe?"
    ecran: "Les cinq chiffres apparaissent un par un, puis le mot « justes » ; sources Insee en note"
  - bloc: accueil
    duree_s: 15
    fr: "Bonjour, et bienvenue ! Merci d'être là. On cite des chiffres tous les jours, dans les journaux, au travail, en famille. Dans cet épisode, on apprend à poser les bonnes questions à un chiffre, avant même de le calculer."
    en: "Hi, and welcome! Thanks for being here. We quote numbers every day, in the news, at work, at home. In this episode, we learn to ask a number the right questions, before we even calculate anything."
  - bloc: plan
    duree_s: 15
    fr: "Quatre étapes : ce qu'est une donnée ; de qui parle un chiffre ; quel type de variable on manipule ; et d'où viennent les données. Avec deux laboratoires en direct et un exercice de synthèse corrigé."
    en: "Four steps: what data are; who a number is about; what type of variable we're handling; and where data come from. With two live labs and a worked summary exercise."
    ecran: "Plan en 4 lignes ; les chapitres YouTube reprennent ces titres"
  - bloc: chapitre
    id: S1.01
    titre: {fr: "1. Qu'est-ce qu'une donnée ?", en: "1. What counts as data?"}
    duree_min: [3, 4]
    changements: "L'accroche du chapitre (Paris) devient son titre numéroté : l'ouverture de l'épisode a déjà posé les trois chiffres. Le défi « lequel est juste ? » est conservé. Exercice validé conservé (tour Eiffel ou temps de trajet) ; sa correction se termine par une phrase qui présente le fil rouge : « Une entreprise fictive de 20 salariés se pose exactement cette question B pour ses salariés. Nous allons la suivre tout l'épisode. » Les trois questions à poser à un chiffre passent dans la synthèse."
    transition: {fr: "Une question statistique porte sur un groupe. Mais lequel, exactement ?", en: "A statistical question is about a group. But which group, exactly?"}
  - bloc: chapitre
    id: S1.02
    titre: {fr: "2. De qui parle ce chiffre ?", en: "2. Who is this number about?"}
    duree_min: [4, 5]
    changements: "Après le titre sur le sommeil, une scène ajoutée applique les trois briques à l'entreprise du fil rouge : population, les 20 salariés de l'entreprise ; individu, un salarié ; variable, son temps de trajet en minutes, un jour donné, déclaré par le salarié. Au revenu moyen du village, la voix dit une fois ce qu'est une moyenne : « on partage le total également » (complétude, la moyenne est approfondie en EP-S2A). Exercice validé conservé (téléphones des collégiens)."
    transition: {fr: "Changer d'individu change le chiffre. Voyons jusqu'où, en direct.", en: "Changing the unit changes the number. Let's see how far, live."}
  - bloc: laboratoire
    id: LAB-1
    statut_realisation: {storyboard: fait, calcul_teste: a_faire, interface_site: a_faire, animation_video: a_faire, livre: non}
    titre: {fr: "Laboratoire : par ménage ou par personne", en: "Lab: per household or per person"}
    duree_s: 50
    deroulement_fr: "Le village fictif du chapitre : trois ménages, 9 000 € de revenus par mois. Deux compteurs : « par ménage » et « par personne ». Au départ, 3 ménages et 7 habitants : 3 000 € par ménage, environ 1 286 € par personne. Un curseur fait grandir le ménage B, de 4 à 6 personnes (deux enfants naissent) ; les revenus ne bougent pas. Le compteur « par ménage » reste à 3 000 € ; le compteur « par personne » descend à 9 000 ÷ 9 = 1 000 €. Même village, même argent : un chiffre ne bouge pas, l'autre baisse d'un quart. Avant de dire « le revenu moyen a baissé », il faut savoir par qui on divise."
    deroulement_en: "The fictional village from the chapter: three households, €9,000 of income a month. Two counters: 'per household' and 'per person'. At the start, 3 households and 7 people: €3,000 per household, about €1,286 per person. A slider grows household B from 4 to 6 people (two babies are born); income doesn't change. The 'per household' counter stays at €3,000; the 'per person' counter drops to 9,000 ÷ 9 = €1,000. Same village, same money: one number stays put, the other falls by a quarter. Before saying 'average income fell', you need to know what you're dividing by."
    site: "Même laboratoire sur la page de l'épisode : l'apprenant règle la taille et le revenu de chaque ménage ; les deux moyennes sont recalculées à chaque position, jamais figées."
    moteur: "Modèle d'animation « curseur » d'EP-S2A, avec deux compteurs ; à défaut, deux scènes « chiffre » enchaînées."
  - bloc: chapitre
    id: S1.03
    titre: {fr: "3. Quel type de variable ?", en: "3. What type of variable?"}
    duree_min: [5, 6]
    changements: "L'accroche du chapitre devient son titre numéroté ; le défi des codes postaux est conservé. Après les quatre types de variables, une scène ajoutée montre le questionnaire de l'entreprise du fil rouge, quatre questions et quatre types : le mode de transport (nominale), la satisfaction du trajet de 1 à 5 (ordinale), le nombre de correspondances (discrète), le temps de trajet en minutes (continue). Le reste du chapitre est inchangé ; exercice validé conservé (étoiles d'hôtel)."
    transition: {fr: "On sait maintenant ce qu'on mesure. Reste une question : qui a mesuré, et comment ?", en: "We now know what we measure. One question remains: who measured it, and how?"}
  - bloc: chapitre
    id: S1.04
    titre: {fr: "4. D'où viennent les données ?", en: "4. Where do data come from?"}
    duree_min: [5, 6]
    changements: "L'accroche du chapitre devient son titre numéroté (l'ouverture a déjà posé les deux chiffres du chômage). Chiffres du 2e trimestre 2026 conservés, comme décidé par JG le 08/11/2026 (voir « a_trancher_par_le_relecteur »). Après l'exercice validé (naissances, confiance, trafic), une scène ajoutée revient à l'entreprise : avec 20 salariés, on peut tous les interroger, c'est un recensement de l'entreprise ; une grande entreprise n'interrogerait qu'un échantillon. Elle annonce le laboratoire 2."
    transition: {fr: "Et si notre entreprise n'interrogeait que cinq salariés sur vingt ? Essayons.", en: "What if our company only asked five employees out of twenty? Let's try."}
  - bloc: laboratoire
    id: LAB-2
    statut_realisation: {storyboard: fait, calcul_teste: a_faire, interface_site: a_faire, animation_video: a_faire, livre: non}
    titre: {fr: "Laboratoire : tout le monde ou un échantillon", en: "Lab: everyone or a sample"}
    duree_s: 60
    deroulement_fr: "Les 20 salariés en pastilles, chacun avec son temps de trajet ; ceux qui mettent moins de 20 minutes sont allumés : 10 sur 20, soit 50 %. C'est la vraie réponse, puisqu'on a interrogé tout le monde. Puis trois tirages de 5 salariés au hasard. Premier tirage : 7, 15, 21, 29 et 38 minutes, 2 sous 20 minutes sur 5, soit 40 %. Deuxième : 4, 11, 18, 23 et 44, soit 60 %. Troisième : 9, 12, 14, 16 et 32, soit 80 %. Trois échantillons, trois réponses, et aucune ne vaut 50 %. Personne n'a menti : c'est le hasard du tirage. C'est la marge d'erreur d'un sondage, et c'est tout l'objet du prochain épisode."
    deroulement_en: "The 20 employees as dots, each with their travel time; those who take under 20 minutes light up: 10 out of 20, so 50%. That's the true answer, since everyone was asked. Then three draws of 5 employees at random. First draw: 7, 15, 21, 29 and 38 minutes, 2 under 20 minutes out of 5, so 40%. Second: 4, 11, 18, 23 and 44, so 60%. Third: 9, 12, 14, 16 and 32, so 80%. Three samples, three answers, and none of them is 50%. Nobody lied: it's the luck of the draw. That's a survey's margin of error, and it's what the next episode is all about."
    site: "Bouton « nouveau tirage » : 5 salariés tirés au hasard, recomptés à chaque fois, avec l'historique des parts obtenues ; un réglage fait passer la taille de l'échantillon de 5 à 10 puis 15, et l'apprenant voit les réponses se resserrer autour de 50 %."
    moteur: "Modèle « foule » (20 pastilles) d'EP-S2A, avec mise en évidence des 5 tirés ; à défaut, trois scènes « etapes »."
  - bloc: synthese
    duree_s: 45
    fr: "Ce qu'il faut retenir. Un : une question statistique attend des réponses qui varient, et une donnée est toujours une mesure, faite par quelqu'un, selon une définition. Deux : avant de comparer, demandez de qui parle le chiffre, la population, l'individu, la variable ; changer d'individu change le chiffre. Trois : un nombre peut être une étiquette, un rang ou une quantité, et l'échelle dit quelles opérations ont un sens. Quatre : recensement, sondage, fichier ou capteurs, chaque source a une force et une limite. Devant n'importe quel chiffre, posez trois questions : quelle question, quelle définition, et qui a mesuré, quand et comment ?"
    en: "What to remember. One: a statistical question expects answers that vary, and a data point is always a measurement, made by someone, under a definition. Two: before comparing, ask who the number is about, the population, the unit, the variable; changing the unit changes the number. Three: a number can be a label, a rank or a quantity, and the scale tells you which operations make sense. Four: census, survey, records or sensors, each source has a strength and a limit. In front of any number, ask three questions: which question, which definition, and who measured it, when and how?"
  - bloc: exercice_de_synthese
    pause_secondes: 15
    fr: "À vous. Une commune fictive veut savoir combien de temps ses habitants passent chaque jour dans les transports. Elle leur demande aussi leur mode de transport principal et une note de satisfaction de 1 à 5. Un : est-ce une question statistique ? Deux : quelle est la population, l'individu, la variable ? Trois : quel est le type de chacune des trois variables ? Quatre : la commune hésite entre interroger tous les habitants, en interroger 500 tirés au sort, ou compter les validations de cartes de bus ; donnez pour chaque source une force et une limite. Mettez la vidéo en pause."
    en: "Your turn. A fictional town wants to know how long its residents spend in transport each day. It also asks for their main mode of transport and a satisfaction score from 1 to 5. One: is this a statistical question? Two: what are the population, the unit and the variable? Three: what type is each of the three variables? Four: the town is choosing between asking every resident, asking 500 residents drawn at random, or counting bus card taps; give one strength and one limit for each source. Pause the video."
    questions_a_l_ecran: true   # LMEC-DEC-017 : l'énoncé et les quatre questions sont écrits à l'écran, numérotés
    correction_fr: "Un : oui, les durées varient d'un habitant à l'autre. Deux : la population, ce sont les habitants de la commune, à préciser (à partir de quel âge ? quelle semaine ?) ; l'individu, un habitant ; la variable, son temps quotidien dans les transports, en minutes. Trois : le temps est quantitatif continu ; le mode de transport est qualitatif nominal ; la satisfaction est qualitative ordinale, et en faire la moyenne suppose des écarts égaux, à dire. Quatre : tout le monde, c'est un recensement, complet mais lourd et coûteux ; 500 tirés au sort, c'est un sondage, rapide mais avec une marge d'erreur et des non-réponses ; les validations, c'est un fichier, énorme et continu, mais il ne voit que les usagers du bus, et il compte des passages, pas des personnes : l'individu a changé."
    correction_en: "One: yes, the times vary from one resident to another. Two: the population is the town's residents, to be specified (from what age? which week?); the unit is one resident; the variable is their daily time in transport, in minutes. Three: time is quantitative and continuous; the mode of transport is qualitative and nominal; satisfaction is qualitative and ordinal, and averaging it assumes equal gaps, which you should say. Four: everyone is a census, complete but heavy and costly; 500 at random is a survey, quick but with a margin of error and non-responses; card taps are records, huge and continuous, but they only see bus users, and they count taps, not people: the unit has changed."
  - bloc: cloture
    duree_s: 25
    fr: "Voilà : la prochaine fois qu'on vous lance un chiffre, vous saurez lui demander d'où il vient. Mais un échantillon peut aussi se tromper, et pas seulement par hasard : c'est tout l'enjeu du prochain épisode. Si cette vidéo vous a été utile, abonnez-vous, laissez un like et partagez-la avec quelqu'un à qui elle servira. Et si un exercice vous résiste, écrivez-nous en commentaire : on vous aide, gratuitement. Merci d'avoir regardé, et à très vite !"
    en: "That's it: next time someone throws a number at you, you'll know how to ask where it comes from. But a sample can also be wrong, and not just by chance: that's what the next episode is all about. If this video was useful, subscribe, leave a like and share it with someone it will help. And if an exercise gets the better of you, write to us in the comments: we'll help you, for free. Thanks for watching, see you very soon!"
    controle_qc: "Contient « bonjour » à l'accueil (rang 2, après l'ouverture), et à la clôture « prochain épisode », « abonnez », « like », « partagez » : conforme à parcours_spectateur (charte.yaml). Prochain épisode : EP-S1B « Pourquoi un échantillon peut mentir »."
  - bloc: fin
    duree_s: 4
    fr: "Fin de marque : logo officiel (variante selon le fond) et « Éveiller par les chiffres. »"
    en: "Brand end card: official logo (variant for the background) and “Enlightening through numbers.”"

