# Fiche de conception d'ÉPISODE LONG, programme 1.13. Modèle : contenus/conception/EP-S2A.yaml (épisode pilote
# de référence, LMEC-DEC-017). Écrite par Claude le 2026-11-28, à la demande de JG (26/11/2026 : produire EP-S1A,
# premier épisode du module S1, sur le modèle d'EP-S2A).
# Les quatre chapitres reprennent les fiches de production validées par JG le 08/11/2026 (lot 1, S1.01 à S1.04) ;
# cette fiche ne réécrit que ce qui est propre à l'épisode : ouverture, accueil, plan, fil rouge, transitions,
# laboratoires, synthèse, exercice de synthèse, clôture. Les seuls chiffres extérieurs sont ceux des chapitres
# validés (Insee) ; tout le reste est fictif et annoncé comme tel.
id_programme: EP-S1A
statut: revue_claude            # à valider par JG avant l'assemblage de la fiche de production
contient: [S1.01, S1.02, S1.03, S1.04]
fiches_chapitres:               # fiches de production validées (08/11/2026), reprises telles quelles sauf « changements »
  S1.01: contenus/fiches/2026-11-n1-s1-01-qu-est-ce-qu-une-donnee.yaml
  S1.02: contenus/fiches/2026-11-n1-s1-02-population-individu-variable.yaml
  S1.03: contenus/fiches/2026-11-n1-s1-03-types-de-variables.yaml
  S1.04: contenus/fiches/2026-11-n1-s1-04-d-ou-viennent-les-donnees.yaml
fiche_production: "à créer après validation : contenus/fiches/2026-12-ep-s1a-d-ou-vient-un-chiffre.yaml"

titres:
  fr: "D'où vient un chiffre ? Données, populations et variables"
  en: "Where does a number come from? Data, populations and variables"
  # Titre YouTube proposé (court, lisible sur téléphone), le titre long reste sur le site :
  youtube_fr: "2,1 ou 13,3 millions d'habitants ? D'où vient un chiffre"
  youtube_en: "2.1 or 13.3 million people? Where a number comes from"
question_centrale:
  fr: "Avant de calculer quoi que ce soit, que faut-il savoir d'un chiffre pour lui faire confiance ?"
  en: "Before calculating anything, what do you need to know about a number to trust it?"

position: {pilier: statistiques, niveau: 1, module: S1, rang_dans_module: 1}

public:
  prerequis: []                 # premier épisode du pilier statistiques
  niveau_maths: M0
  rappel_conseille: [M0.01, M0.02]   # via EP-M01 (fractions, pourcentages, millions)
  # Complétude (règle 5) : toutes les notions utilisées, même « évidentes ».
  notions_utilisees:
    - {notion: "Lire un grand nombre en millions (2 103 778 ≈ 2,1 millions)", episode: EP-M01, rappel: "Montré une fois au chapitre 1 : le nombre exact en note, l'arrondi à l'écran"}
    - {notion: "Pourcentage (15 % des actifs ; 2 sur 5 = 40 %)", episode: EP-M01, rappel: "Au laboratoire 2 : 2 sur 5, c'est 2 divisé par 5, soit 0,4, soit 40 %"}
    - {notion: "Moyenne simple : total divisé par le nombre", episode: EP-S2A, rappel: "Dite au chapitre 2 au moment du revenu moyen : « on partage le total également » ; la moyenne est approfondie en EP-S2A. Au chapitre 3, la moyenne des codes postaux est calculée à l'écran, (75001 + 13001) ÷ 2"}
    - {notion: "Celsius et kelvins (0 °C = 273,15 K)", episode: "", rappel: "Donné à l'écran au chapitre 3, avec la phrase « le zéro des kelvins est le zéro absolu »"}
    - {notion: "Échantillon, marge d'erreur", episode: EP-S1B, rappel: "Introduits en une phrase au chapitre 4 et montrés au laboratoire 2 ; expliqués en EP-S1B"}
    # Notions enseignées DANS l'épisode et réutilisées plus loin : question statistique, donnée = mesure (ch. 1) ;
    # population, individu, variable (ch. 2) ; nominale, ordinale, discrète, continue, échelles (ch. 3) ;
    # recensement, sondage, fichier, capteurs (ch. 4).

objectifs:
  fr:
    - "Distinguer une question statistique, dont les réponses varient, d'une question à réponse unique"
    - "Reconnaître qu'une donnée est une mesure, faite par quelqu'un, selon une définition"
    - "Identifier la population, l'individu et la variable, et expliquer pourquoi changer d'individu change le chiffre"
    - "Classer une variable (nominale, ordinale, discrète, continue) et dire quelles opérations ont un sens"
    - "Distinguer recensement, sondage, fichier administratif et capteurs, avec une force et une limite de chacun"
  en:
    - "Tell a statistical question, whose answers vary, from a question with a single answer"
    - "Recognise that a data point is a measurement, made by someone, under a definition"
    - "Identify the population, the unit and the variable, and explain why changing the unit changes the number"
    - "Classify a variable (nominal, ordinal, discrete, continuous) and say which operations make sense"
    - "Tell apart a census, a survey, administrative records and sensors, with one strength and one limit of each"

intuition: "Un chiffre est la réponse à une question précise, sur des individus précis, mesurée d'une façon précise. Changez l'une des trois, et le chiffre change, sans que personne ne se trompe."
exemple_fil_rouge: >-
  Une entreprise fictive de 20 salariés se demande combien de temps ses salariés mettent pour venir travailler.
  Elle apparaît à l'exercice du chapitre 1 (temps de trajet : une question statistique), devient l'exemple de
  population, d'individu et de variable au chapitre 2, prête son questionnaire au chapitre 3 (quatre variables,
  quatre types), et choisit sa source au chapitre 4 et au laboratoire 2. Ce sont les mêmes 20 salariés et les
  mêmes 20 temps de trajet qu'en EP-S2A, qui commence là où cet épisode s'arrête : les données sont collectées,
  il reste à les résumer. Ce n'est pas « JG's Holding », réservée au parcours Actuariat.
exemple_reel:
  description: "Ceux des chapitres validés : population de Paris selon trois définitions (Insee, recensement 2023) ; chômage au sens du BIT et inscrits à France Travail au 2e trimestre 2026 (Insee)."
  source: {organisme: "Insee", titre: "Voir les fiches S1.01 et S1.04", url: "https://www.insee.fr/fr/statistiques/9032359", date_publication: "2026-08-07", periode_donnees: "2023 ; 2e trimestre 2026", consulte_le: "2026-11-03"}

