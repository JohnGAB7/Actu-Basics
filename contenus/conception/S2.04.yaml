deroule:
  - {etape: question, contenu: "« En moyenne » : ça veut dire quoi ?"}
  - {etape: intuition, contenu: "Cagnotte : 60 € partagés entre 4, 15 € chacun"}
  - {etape: formalisation, contenu: "Moyenne = somme ÷ nombre ; notation Σ pas à pas"}
  - {etape: raisonnement, contenu: "Point d'équilibre : −10, −5, 0, +15, somme 0"}
  - {etape: formalisation, contenu: "Moyenne pondérée : (14 × 3 + 10 × 1) ÷ 4 = 13, contre 12 sans coefficients"}
  - {etape: exercice, contenu: "Classes de 10 et 30 élèves, moyennes 12 et 8"}
  - {etape: correction, contenu: "(120 + 240) ÷ 40 = 9, et non 10"}
  - {etape: application, contenu: "Dans l'épisode : trajets 425 ÷ 20 = 21,25 min, ce qu'aurait chacun si le total des durées individuelles était partagé également (et non un temps passé ensemble)"}
