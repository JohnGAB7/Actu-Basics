  - {formule: "moyenne pondérée = Σ nᵢ xᵢ / Σ nᵢ", explication_symboles: "nᵢ coefficients ou effectifs", conditions: "moyenne de groupes : pondérer par la taille des groupes"}

calculs_a_verifier:
  - {expression: "(5 + 10 + 15 + 30) / 4", attendu: 15, libelle: "Moyenne de la cagnotte"}
  - {expression: "(5 - 15) + (10 - 15) + (15 - 15) + (30 - 15)", attendu: 0, libelle: "Somme des écarts à la moyenne"}
  - {expression: "(14 * 3 + 10 * 1) / (3 + 1)", attendu: 13, libelle: "Moyenne pondérée"}
  - {expression: "(10 * 12 + 30 * 8) / 40", attendu: 9, libelle: "Moyenne générale"}
  - {expression: "425 / 20", attendu: 21.25, libelle: "Moyenne des trajets (épisode)"}
  - {expression: "round((152.5*2 + 157.5*6 + 162.5*9 + 167.5*5 + 172.5*6 + 177.5*9 + 182.5*5 + 187.5*2) / 44)", attendu: 170, libelle: "Moyenne approchée des tailles, en cm (169,8)"}

