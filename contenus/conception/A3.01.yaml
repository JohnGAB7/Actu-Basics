titres:
  fr: "Lire une table de mortalité"
  en: "Reading a life table"
question_centrale:
  fr: "À 65 ans, combien d'années vous reste-t-il, en moyenne ?"
  en: "At 65, how many years do you have left, on average?"

position: {pilier: actuariat, niveau: 3, module: A3, rang_dans_module: 1}   # pilier A : parcours propre (programme 1.13, REVISION-1.13.md)

public:
  prerequis: [A2.01]
  niveau_maths: M0
  rappel_conseille: []
  notions_utilisees:
    - {notion: "Fraction et pourcentage", episode: EP-M01, rappel: "716 046 sur 801 043, c'est 716 046 ÷ 801 043 ≈ 0,894, soit 89,4 %"}
    - {notion: "Probabilité d'un événement", episode: "", rappel: "Une probabilité est une proportion de cas : sur 100 personnes de 60 ans, environ 89 atteignent 65 ans"}
    - {notion: "Probabilité conditionnelle", episode: "", rappel: "Rappel intégré (scène « Rappel probabilités ») : qₓ se lit « sachant qu'on a atteint l'âge x »"}
    - {notion: "Moyenne", episode: EP-S2A, rappel: "L'espérance de vie est une moyenne : la moitié des personnes ne vivent pas exactement ce nombre d'années"}
    - {notion: "JG's Holding", episode: "", rappel: "Assureur fictif, toujours annoncé comme tel"}

objectifs:
  fr:
    - "Lire une table de mortalité : âge x, survivants lₓ, décès dₓ, probabilités qₓ et pₓ, espérance de vie eₓ"
    - "Calculer une probabilité de survie sur plusieurs années comme un rapport de survivants (l₆₅ ÷ l₆₀)"
    - "Distinguer une table observée (ce qui s'est passé) d'une table de tarification (ce qu'un assureur suppose)"
    - "Citer les éléments d'identité d'une table : organisme, population, période, usage, date"
  en:
    - "Read a life table: age x, survivors lₓ, deaths dₓ, probabilities qₓ and pₓ, life expectancy eₓ"
    - "Compute a multi-year survival probability as a ratio of survivors (l₆₅ ÷ l₆₀)"
    - "Tell an observed table (what happened) from a pricing table (what an insurer assumes)"
    - "Name the identity of a table: issuer, population, period, use, date"

intuition: "Une table de mortalité suit une cohorte de 1 000 000 de personnes, âge après âge : tout se lit comme un rapport de survivants."
exemple_fil_rouge: "JG's Holding (fictive) vend un capital décès et une rente viagère. Elle doit choisir une table : la même question (« combien d'années à 65 ans ? ») donne deux réponses selon la table."
exemple_reel:
  description: "Espérance de vie à 65 ans observée : INSEE (édition FR), SSA Period Life Table (édition EN). Valeurs à relever à la source au moment de l'écriture."
  source: {organisme: "INSEE / US Social Security Administration", titre: "à relever", url: "", date_publication: "", periode_donnees: "", consulte_le: ""}

