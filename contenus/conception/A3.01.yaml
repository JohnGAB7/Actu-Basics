    support: ecran
    nature: calcul_derive
    calcul: {entrees: "Paramètres de Makeham de la table MK : k = 1 000 450,59 ; s = 0,999106875782 ; g = 0,999549614043 ; c = 1,103798111448", formule: "lₓ = k · sˣ · g^(cˣ)", transformations: "arrondi à l'unité"}
    definition: "Nombre de survivants à l'âge exact x sur une cohorte de départ"
    unite: "personnes"
    population: "Table réglementaire belge MK (hommes), usage tarification"
    periode: ""
    couverture: ""
    revisions: ""
    source_primaire: {organisme: "Texte réglementaire belge définissant les tables MK/FK (à identifier et vérifier par Perplexity)", url: "", consulte_le: ""}
    incertitude: "Aucune pour le calcul ; la table est une hypothèse prudente, pas une mesure"
    comparabilite: "Ne pas comparer à une table observée sans le dire : usages différents (c'est l'objet de la scène 9)"
  - chiffre: "₅p₆₀ ≈ 0,894 ; q₆₅ ≈ 0,029 ; e₆₅ (MK) ≈ 12,3 ans"
    support: ecran
    nature: calcul_derive
    calcul: {entrees: "lₓ MK ci-dessus", formule: "₅p₆₀ = l₆₅ / l₆₀ ; q₆₅ = (l₆₅ − l₆₆) / l₆₅ ; e₆₅ = Σₖ l₆₅₊ₖ / l₆₅ (k = 1 … 51)", transformations: "arrondis"}
    definition: "Probabilité de survie, probabilité de décès dans l'année, espérance de vie abrégée"
    unite: "probabilité ; années"
    population: "Table MK"
    periode: ""
    couverture: ""
    revisions: ""
    source_primaire: {organisme: "", url: "", consulte_le: ""}
    incertitude: "Aucune pour le calcul"
    comparabilite: "Mêmes valeurs que la séance a3/s01 du parcours (recalculées par ses tests)"
  - chiffre: "e₆₅ observée (FR : INSEE ; EN : SSA)"
    support: ecran
    nature: source
    calcul: {entrees: "", formule: "", transformations: ""}
    definition: "Espérance de vie à 65 ans du moment (table du moment, ou période)"
    unite: "années"
    population: "France (INSEE) ; États-Unis (SSA) ; préciser sexe ou ensemble"
    periode: "à relever"
    couverture: ""
