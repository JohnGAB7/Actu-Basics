deroule:
  - {etape: question, contenu: "1 000 € par an pendant 10 ans : combien JG's Holding doit-elle mettre de côté aujourd'hui ?"}
  - {etape: intuition, contenu: "10 000 € ? Moins, puisque chaque paiement est actualisé"}
  - {etape: donnees, contenu: "Frise de dix paiements ; on pourrait additionner dix lignes comme en A1.03"}
  - {etape: formalisation, contenu: "aₙ = (1 − vⁿ) ÷ i ; à 2,5 % sur 10 ans : 8,7521, donc 8 752,06 €"}
  - {etape: raisonnement, contenu: "Paiements en début d'année : un an d'actualisation en moins, × 1,025, soit 8 970,87 €"}
  - {etape: raisonnement, contenu: "Paiements sans fin : 1 000 ÷ 0,025 = 40 000 € (perpétuité)"}
  - {etape: application, contenu: "Dans l'autre sens : un emprunt de 100 000 € sur 10 ans à 2,5 % se rembourse par 100 000 ÷ 8,7521 = 11 425,88 € par an"}
  - {etape: exercice, contenu: "500 € par an pendant 5 ans, en fin d'année, à 2,5 % : valeur actuelle ?"}
  - {etape: correction, contenu: "500 × (1 − 1,025⁻⁵) ÷ 0,025 ≈ 2 322,91 €"}
  - {etape: limites, contenu: "Paiements certains : une rente viagère, elle, s'arrête au décès"}
  - {etape: rappel, contenu: "La suite : un taux différent pour chaque échéance, la courbe des taux (A1.05)"}

formules:
  - {formule: "a_n = (1 - v^n) / i", explication_symboles: "valeur actuelle de 1 versé à la fin de chacune des n années ; v = 1 ÷ (1 + i)", conditions: "taux constant, fin de période"}
  - {formule: "\\ddot{a}_n = (1 + i) \\cdot a_n", explication_symboles: "paiements en début de période", conditions: ""}
  - {formule: "a_\\infty = 1 / i", explication_symboles: "perpétuité", conditions: "i > 0"}
  - {formule: "R = K / a_n", explication_symboles: "paiement constant R d'un emprunt de capital K", conditions: "fin de période"}

