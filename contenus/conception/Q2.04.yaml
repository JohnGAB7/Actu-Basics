reproductibilite: "Pas de calcul ; référence DOI dans la fiche de production"

deroule:   # V2 après la revue audiovisuelle de la PR #15 (cible 80 à 90 s)
  - {etape: question, contenu: "On n'examine que les avions revenus : que peut-on en conclure ?"}
  - {etape: raisonnement, contenu: "Animation « selection » : 8 partis, 5 revenus, 3 absents ; données = survivants ; flèche « sélection par la survie »"}
  - {etape: formalisation, contenu: "Méthode de Wald : avions revenus selon le nombre d'impacts, nombre total d'avions engagés"}
  - {etape: application, contenu: "Animation « selection » : entreprises créées, disparues, survivantes"}
  - {etape: rappel, contenu: "Définition du biais du survivant"}
  - {etape: exercice, contenu: "Une étude ne porte que sur les entreprises encore en activité : quel groupe manque ?"}
  - {etape: correction, contenu: "Celles qui ont fermé, éliminées avant l'observation"}
  - {etape: rappel, contenu: "Qui manque dans les données ? Renvoi à S1.05"}

