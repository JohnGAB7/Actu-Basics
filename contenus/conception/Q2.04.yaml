    statut: sourcee
    source: "Mangel et Samaniego (1984) ; la référence de l'article cite le rapport de Wald « A Method of Estimating Plane Vulnerability Based on Damage of Survivors » (réédité CNA, CRC 432, 1980)"
    verification: "Titre et notice vérifiés sur Crossref le 2026-11-03. Texte intégral non lu : ChatGPT ou JG peuvent le confirmer via JSTOR (10.2307/2288257)"
  - affirmation: "Les zones peu touchées sur les survivants signalent les zones où un impact empêchait le retour"
    statut: sourcee
    source: "Raisonnement découlant du titre même du rapport de Wald (estimer la vulnérabilité d'après les dégâts des survivants)"
    verification: "Formulation volontairement générale : aucune zone précise (moteurs, cockpit, fuselage) n'est nommée, car la source lue ne le confirme pas"
  - affirmation: "On envisageait d'abord de renforcer les zones les plus touchées"
    statut: hypothese
    source: ""
    verification: "Présentée comme « l'idée qui vient d'abord », non comme un fait historique attribué à quelqu'un. À confirmer dans le texte de Mangel et Samaniego ou à garder sous cette forme"
  - affirmation: "Les vieux bâtiments semblent mieux construits parce que les plus fragiles ont disparu"
    statut: hypothese
    source: ""
    verification: "Illustration de raisonnement, pas une affirmation sur la qualité réelle du bâti ancien. Le texte dit « semblent »"
  - affirmation: "Les entreprises qui ont fermé faisaient peut-être pareil"
    statut: hypothese
    source: ""
    verification: "Formulé au conditionnel (« peut-être ») : illustration, pas un fait"

