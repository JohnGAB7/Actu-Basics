titres:
  fr: "Que disent les avions revenus ?"
  en: "What do the returning planes tell us?"
question_centrale:
  fr: "Pourquoi les vieux bâtiments semblent-ils mieux construits que les neufs ?"
  en: "Why do old buildings seem better built than new ones?"

position: {pilier: quotidien, niveau: 1, module: Q2, rang_dans_module: 4}

public:
  prerequis: []
  niveau_maths: M0
  rappel_conseille: []
  renvoi: [S1.05]

objectifs:   # Réduits à un seul après la revue de la PR #15 (capsule d'une minute)
  fr:
    - "Reconnaître le biais du survivant : se demander ce qui manque dans les données"
  en:
    - "Spot survivorship bias: ask what is missing from the data"

intuition: "On ne voit que ce qui a survécu ; les échecs ont disparu des données."
exemple_fil_rouge: "Les avions revenus de mission : ils ne disent pas tout, car les avions abattus manquent aux données. Script proposé par ChatGPT (2e revue de la PR #15), intégré tel quel."
exemple_reel:
  description: "Méthode d'Abraham Wald pour estimer la vulnérabilité des avions à partir des dégâts des survivants. Partie lue mot à mot (environ 60 %) : probabilité d'être abattu selon le NOMBRE d'impacts, à partir des avions revenus ayant reçu i impacts (A_i) et du nombre d'avions engagés (N). Aucune zone de l'avion n'est nommée dans cette partie."
  source:
    organisme: "Center for Naval Analyses (réédition) ; Journal of the American Statistical Association"
    titre: "A. Wald, A Method of Estimating Plane Vulnerability Based on Damage of Survivors, CRC 432, juillet 1980 ; M. Mangel et F. J. Samaniego, Abraham Wald's Work on Aircraft Survivability, JASA 79(386), 1984, p. 259-267"
    url: "https://apps.dtic.mil/sti/pdfs/ADA091073.pdf ; https://doi.org/10.1080/01621459.1984.10478038"
    date_publication: "1980-07 (réédition) ; 1984-06"
    periode_donnees: "Seconde Guerre mondiale"
    consulte_le: "2026-11-03. Rapport de Wald lu à environ 60 % (texte DTIC, OCR partiellement illisible) ; article de 1984 : notice Crossref seulement"

provenance: []   # Aucun chiffre à l'écran ni dans la voix.

affirmations_qualitatives:
  - affirmation: "Pendant la guerre, des analystes ont étudié les dégâts des avions revenus de mission"
    statut: sourcee
    source: "Rapport de Wald (CRC 432) : titre et partie I (avions revenus après i impacts, A_i)"
    verification: "Lu mot à mot le 2026-11-03"
  - affirmation: "Une première intuition semblait évidente : renforcer les zones les plus touchées"
    statut: hypothese
    source: ""
    verification: "Formulée comme une intuition, pas comme une décision historique attribuée à quelqu'un. Non trouvée dans la partie lue du rapport de Wald. À confirmer dans Mangel et Samaniego (1984) avant de la présenter comme un fait"
  - affirmation: "Les zones très touchées pouvaient être survivables ; une zone peu touchée pouvait signaler un impact qui empêchait le retour"
    statut: illustration
    source: ""
    verification: "Mécanisme général au conditionnel, signalé à l'écran (note). Non attribué à Wald : la partie lue de son rapport raisonne sur le nombre d'impacts, pas sur des zones"
  - affirmation: "Une méthode d'Abraham Wald estime la vulnérabilité à partir des dégâts des survivants"
    statut: sourcee
    source: "Rapport de Wald (CRC 432), titre ; note à l'écran sur la dernière scène"
    verification: "Lu le 2026-11-03"

