  population_et_mesure: "Montrée : seulement les avions revenus"
  origine_des_donnees: "Montrée : c'est le cœur du biais"
  exploration: "Non traitée (format court)"
  methode_et_raison: "Montrée en mots : raisonner sur les absents"
  hypotheses: "Récit simplifié, signalé dans les hypothèses de la fiche"
  resultat_et_incertitude: "Non traitée (format court)"
  interpretation_permise_et_interdite: "Montrée : ne pas tirer de leçon des seuls survivants"
  reproductibilite: "Source citée à l'écran et dans la légende"

