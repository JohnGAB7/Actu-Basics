  tache: "Nommer le biais dans une situation nouvelle"
  question_de_transfert: "Une étude montre que les musiciens célèbres ont commencé tôt la musique. Faut-il en conclure que commencer tôt rend célèbre ? Qui manque dans les données ?"
  diagnostic_d_erreur: "« Les chats qui tombent du dixième étage s'en sortent mieux que ceux du cinquième, d'après les cliniques vétérinaires » : quel animal manque dans ces données ?"
  limite_a_enoncer: "Savoir qu'il manque des données ne dit pas ce qu'elles contiennent : il faut les chercher ou les modéliser"

