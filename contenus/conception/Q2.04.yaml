  type: recit_source
  raison_du_choix: "Une capsule de paradoxe d'une seule idée, sans calcul ; l'exemple historique est le plus parlant"
  source: {organisme: "", url: "", licence: "", population: "", variables: "", periode: "", limites: ""}
  parametres_simulation: ""

