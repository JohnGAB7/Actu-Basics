titres: {fr: "2,4 millions de réponses, et faux : le biais de sélection", en: "2.4 million answers, and wrong: selection bias"}
question_centrale:
  fr: "Comment un sondage de 2,4 millions de réponses a-t-il pu se tromper de vainqueur ?"
  en: "How could a poll with 2.4 million answers pick the wrong winner?"
position: {pilier: statistiques, niveau: 1, module: S1, rang_dans_module: 5}
public: {prerequis: [S1.04], niveau_maths: M0, rappel_conseille: []}

intuition: "Un grand échantillon mal choisi reste mal choisi : on mesure très précisément la mauvaise population."
exemple_fil_rouge: "Le sondage du Literary Digest, élection présidentielle américaine de 1936."
exemple_reel:
  description: "Literary Digest 1936 : environ 10 millions de bulletins envoyés, près de 2,4 millions retournés (environ 24 %), Landon 54 %, Roosevelt 41 % ; Roosevelt obtient 61 % des voix. Chiffres de Gallup non cités (non lus)."
  source:
    organisme: "Social Science History ; Statistics, Politics and Policy"
    titre: "D. Lusinchi, « President Landon and the 1936 Literary Digest Poll: Were Automobile and Telephone Owners to Blame? », 2012 ; S. Lohr et J. M. Brick, « Roosevelt Predicted to Win: Revisiting the 1936 Literary Digest Poll », 2017"
    url: "https://pdixon.stat.iastate.edu/stat587/resources/president-landon-and-the-1936-literary-digest-poll-were-automobile-and-telephone-owners-to-blame.pdf ; https://www.gwern.net/doc/statistics/bias/2017-lohr.pdf"
    date_publication: "2012 ; 2017"
    periode_donnees: "1936"
    consulte_le: "2026-11-03. Lusinchi lu mot à mot p. 24 à 37 environ ; Lohr et Brick p. 65-66. Copies hébergées par des tiers : DOI à ajouter"

provenance:
