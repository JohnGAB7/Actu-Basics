  - {affirmation: "Les adresses venaient notamment d'annuaires téléphoniques et de listes de propriétaires de voitures", statut: sourcee, source: "Titre et propos de Lusinchi (2012) ; Lohr et Brick (2017), p. 66 (Gallup accuse la base de sondage)", verification: "Lu le 2026-11-03"}
  - {affirmation: "Squire (1988) : la base de sondage et la non-réponse ont joué toutes les deux", statut: sourcee, source: "Lohr et Brick (2017), p. 66 ; Lusinchi (2012), p. 33", verification: "Lu le 2026-11-03"}
  - {affirmation: "Les personnes sans téléphone fixe sont souvent plus jeunes", statut: hypothese, source: "", verification: "Formulation prudente ; à sourcer ou retirer"}
