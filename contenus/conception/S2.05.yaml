  - {affirmation: "Beaucoup pensent que la moitié des gens gagne plus que le salaire moyen", statut: hypothese, source: "", verification: "Question du défi d'ouverture, à mesurer dans le test pilote"}

cycle_enquete:
  question: "Montrée : que gagne un salarié typique ?"
  population_et_mesure: "Montrée : les clients du café, salaire mensuel"
  origine_des_donnees: "Montrée : exemple fictif"
  exploration: "Supposée : les valeurs sont lues dans la note à l'écran"
  methode_et_raison: "Montrée : moyenne puis médiane, et pourquoi"
  hypotheses: "Montrée : nombres fictifs"
  resultat_et_incertitude: "Pas d'incertitude : population complète, pas d'échantillon"
  interpretation_permise_et_interdite: "Montrée : choisir l'indicateur selon la question"
  reproductibilite: "Tous les calculs sont à l'écran et recalculés par le moteur"

donnees_ou_simulation:
  type: calcul_pur
  raison_du_choix: "Des nombres ronds, qu'on suit de tête, isolent l'effet d'une seule valeur extrême"
  source: {organisme: "", url: "", licence: "", population: "", variables: "", periode: "", limites: ""}
  parametres_simulation: ""

hypotheses_et_limites:
  - {hypothese: "Population complète, pas d'échantillon", intuition: "On décrit, on n'infère pas", testable: "", non_testable: "", diagnostic: "", si_elle_echoue: "Avec un échantillon, moyenne et médiane auraient une incertitude (S6)"}

reproductibilite: "Calculs entièrement à l'écran ; blocs verifier de la fiche de production"

deroule:
  - {etape: question, contenu: "Accroche et défi : quelle part gagne moins que la moyenne ?"}
  - {etape: donnees, contenu: "Neuf clients, moyenne 2 200 €"}
  - {etape: raisonnement, contenu: "Le client riche : moyenne 21 980 €, 90 % sous la moyenne"}
  - {etape: formalisation, contenu: "Médiane : ranger, milieu, position (n + 1) / 2, cas pair"}
  - {etape: raisonnement, contenu: "Médiane du café 2 200 puis 2 250 € ; règle selon la forme de la distribution ; réponse au défi"}
  - {etape: exercice, contenu: "Sept salaires, puis un huitième à 20 000 €"}
  - {etape: correction, contenu: "1 800 / 1 800, puis 4 075 / 1 850"}
  - {etape: application, contenu: "Quel indicateur pour quelle question"}
  - {etape: limites, contenu: "La médiane ignore l'ampleur des écarts"}
  - {etape: rappel, contenu: "Trois points à retenir"}

formules:
  - {formule: "moyenne = somme / nombre", explication_symboles: "somme des valeurs, nombre de valeurs", conditions: "variable quantitative"}
  - {formule: "position = (n + 1) / 2", explication_symboles: "n : nombre de valeurs rangées", conditions: "position non entière : moyenne des deux valeurs voisines"}

calculs_a_verifier:
  - {expression: "19800 / 9", attendu: 2200, libelle: "Moyenne des 9 salaires"}
  - {expression: "(19800 + 200000) / 10", attendu: 21980, libelle: "Moyenne des 10 salaires"}
  - {expression: "(2200 + 2300) / 2", attendu: 2250, libelle: "Médiane des 10 salaires"}
  - {expression: "(12600 + 20000) / 8", attendu: 4075, libelle: "Moyenne de l'exercice après"}
  - {expression: "(1800 + 1900) / 2", attendu: 1850, libelle: "Médiane de l'exercice après"}

idees_fausses:
  - {idee: "La moitié des gens gagne plus que le salaire moyen", desamorcee_a_l_etape: "chiffre 90 %, puis réponse au défi"}
  - {idee: "La médiane est toujours meilleure", desamorcee_a_l_etape: "Laquelle choisir ? et limite de la médiane"}

exercice:
  question: "Sept salaires : 1 500, 1 600, 1 700, 1 800, 1 900, 2 000, 2 100 €. Moyenne et médiane, puis après l'arrivée d'un salaire de 20 000 €."
  correction: "Avant : 12 600 / 7 = 1 800 €, médiane 1 800 €. Après : 32 600 / 8 = 4 075 €, médiane (1 800 + 1 900) / 2 = 1 850 €."
  pause_secondes: 8

preuve_apprentissage:
  tache: "Calculer la médiane de 6 valeurs données, sans aide"
  question_de_transfert: "Dans un village, un château vaut 30 millions d'euros et les maisons entre 150 000 et 300 000 €. Le prix moyen d'un logement décrit-il bien le village ? Quel indicateur choisir ?"
  diagnostic_d_erreur: "« Le salaire moyen a augmenté, donc la plupart des salariés gagnent plus qu'avant » : pourquoi est-ce faux ?"
  limite_a_enoncer: "La médiane ne dit rien de l'ampleur des écarts"

