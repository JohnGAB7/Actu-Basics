titres:
  fr: "Moyenne ou médiane ?"
  en: "Mean or median?"
question_centrale:
  fr: "Pourquoi la plupart des gens gagnent-ils moins que le salaire moyen ?"
  en: "Why do most people earn less than the average salary?"

position: {pilier: statistiques, niveau: 1, module: S2, rang_dans_module: 5}

public:
  prerequis: [S2.04, S2.03]
  niveau_maths: M0
  rappel_conseille: [M0.01]

objectifs:
  fr:
    - "Calculer une médiane avec un nombre impair, puis pair, de valeurs"
    - "Prévoir dans quel sens la moyenne s'écarte de la médiane quand la distribution est asymétrique"
    - "Choisir l'indicateur qui répond à une question donnée"
  en:
    - "Find the median of an odd and of an even number of values"
    - "Predict which way the mean moves away from the median in a skewed distribution"
    - "Choose the summary that answers a given question"

intuition: "Une seule valeur extrême déplace la moyenne, presque jamais la médiane."
exemple_fil_rouge: "Neuf clients d'un café (1 600 à 2 800 € par mois, moyenne et médiane 2 200 €). Un dixième client à 200 000 € entre : moyenne 21 980 €, médiane 2 250 €."
