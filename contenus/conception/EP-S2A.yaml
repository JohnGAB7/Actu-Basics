  question_de_transfert: "Une appli annonce « temps de livraison moyen : 35 minutes ». Quelle information manque pour savoir si votre livraison arrivera probablement en moins de 35 minutes ?"
  diagnostic_d_erreur: "« Le trajet moyen a augmenté de 4 minutes, donc tout le monde met plus longtemps » : pourquoi est-ce faux ? (laboratoire 2)"
  limite_a_enoncer: "Moyenne et médiane ne disent rien de l'étalement des valeurs (épisode suivant)"

duree_estimee_min: [26, 32]     # chapitres resserrés (transitions communes, un seul rappel final) ; à mesurer après synthèse vocale
format: youtube_lesson
raison_du_format: "Épisode long du programme 1.13 : cinq notions qui se suivent, deux laboratoires, une synthèse et un exercice commun"
chapitres_youtube: ["0:00 Ouverture", "Compter", "Dessiner", "Laboratoire : les classes", "La forme", "La moyenne", "Moyenne ou médiane", "Laboratoire : la valeur extrême", "Synthèse et exercice"]   # horodatages après rendu
