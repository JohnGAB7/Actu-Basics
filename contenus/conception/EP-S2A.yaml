cycle_enquete:
  question: "Montrée : comment résumer les trajets des salariés ?"
  population_et_mesure: "Montrée : 20 salariés, mode de transport (qualitatif) et temps de trajet en minutes (quantitatif)"
  origine_des_donnees: "Montrée : données fictives, annoncées comme telles à l'écran"
  exploration: "Montrée : tableau, puis histogramme, puis forme"
  methode_et_raison: "Montrée : chaque résumé est choisi d'après la variable et la question"
  hypotheses: "Montrée : nombres fictifs, population complète"
  resultat_et_incertitude: "Pas d'incertitude : on décrit une population entière ; l'incertitude d'un échantillon vient en EP-S6"
  interpretation_permise_et_interdite: "Montrée : « trajet typique » = médiane ; la moyenne est le total divisé par le nombre de salariés, c'est-à-dire le temps qu'aurait chacun si le total des durées individuelles était partagé également ; ce total additionne des trajets individuels et ne mesure pas un temps passé ensemble"
  reproductibilite: "Toutes les valeurs à l'écran, tous les calculs recalculés par le moteur et dans le laboratoire du site"

