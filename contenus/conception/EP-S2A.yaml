affirmations_qualitatives:
  - {affirmation: "Pour une distribution avec des valeurs extrêmes, la médiane décrit mieux le centre que la moyenne, car elle ne dépend pas de la valeur précise des extrêmes", statut: sourcee, source: "OpenStax, Introductory Statistics 2e, section 2.5", verification: "Lu le 21/11/2026"}
  - {affirmation: "Le choix des classes d'un histogramme est arbitraire ou suit une règle ; on peut aussi diviser l'effectif par l'effectif total × la largeur de classe, et l'aire totale vaut alors 1 (densité de fréquence). L'épisode utilise l'autre normalisation, effectif ÷ largeur (densité d'effectif, aire totale N)", statut: sourcee, source: "NIST/SEMATECH e-Handbook of Statistical Methods, 1.3.3.14 Histogram", verification: "Lu le 21/11/2026"}
