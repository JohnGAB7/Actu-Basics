# Fiche de conception d'ÉPISODE LONG (pilote), programme 1.13. Modèle : modeles/fiche-conception-episode.yaml,
# étendu au niveau de l'épisode (chapitres, laboratoires, synthèse, clôture). Écrite par Claude le 2026-11-21.
# Les cinq chapitres reprennent les fiches déjà validées (S2.01 à S2.05) ; cette fiche ne réécrit que ce qui
# est propre à l'épisode : ouverture, accueil, plan, transitions, laboratoires, synthèse, exercice de synthèse,
# clôture. Aucun chiffre extérieur : toutes les données sont fictives et tous les calculs sont recalculés.
id_programme: EP-S2A
statut: valide_jg               # validée par JG le 22/11/2026 (PR #50), après revue ChatGPT du 22/11 et corrections
contient: [S2.01, S2.02, S2.03, S2.04, S2.05]
fiches_chapitres:               # fiches de conception validées, reprises telles quelles sauf « changements » ci-dessous
  S2.01: contenus/conception/S2.01.yaml
  S2.02: contenus/conception/S2.02.yaml
  S2.03: contenus/conception/S2.03.yaml
  S2.04: contenus/conception/S2.04.yaml
  S2.05: contenus/conception/S2.05.yaml
fiche_production: "à créer après validation : contenus/fiches/2026-12-ep-s2a-resumer-des-donnees.yaml"

titres:
  fr: "Résumer des données : tableaux, histogrammes, moyenne et médiane"
  en: "Summarizing data: tables, histograms, mean and median"
  # Titre YouTube proposé (court, lisible sur téléphone), le titre long reste sur le site :
  youtube_fr: "Moyenne, médiane, histogramme : résumer des données sans se faire avoir"
  youtube_en: "Mean, median, histogram: summarizing data without being fooled"
question_centrale:
  fr: "Comment résumer vingt, mille ou un million de valeurs sans trahir ce qu'elles disent ?"
  en: "How do you sum up twenty, a thousand or a million values without betraying what they say?"

position: {pilier: statistiques, niveau: 1, module: S2, rang_dans_module: 1}

public:
  prerequis: [S1.03]            # via EP-S1A
  niveau_maths: M0
  rappel_conseille: [M0.01, M0.03, M1.01]   # via EP-M01
  # Complétude (règle 5) : toutes les notions utilisées, même « évidentes ».
  notions_utilisees:
    - {notion: "Individu, population, variable", episode: EP-S1A, rappel: "Une phrase en ouverture : chaque salarié est un individu, le temps de trajet est une variable"}
    - {notion: "Variable qualitative ou quantitative, ordonnée ou non", episode: EP-S1A, rappel: "Rappelé au chapitre 2, au moment de choisir barres ou histogramme"}
    - {notion: "Fraction et pourcentage", episode: EP-M01, rappel: "8 sur 20, c'est 8 divisé par 20, soit 0,4, soit 40 % (montré une fois au chapitre 1)"}
    - {notion: "Lire un graphique : axes, graduations", episode: EP-M01, rappel: "Les axes sont nommés à voix haute à la première courbe"}
    - {notion: "Aire d'un rectangle", episode: "", rappel: "Largeur × hauteur, avec un rectangle dessiné, au chapitre 2 (classes inégales)"}
    - {notion: "Ranger des nombres dans l'ordre croissant", episode: "", rappel: "Montré au chapitre 5 avant la médiane"}
    - {notion: "Signe Σ (somme)", episode: EP-M01, rappel: "Présenté pas à pas au chapitre 4 ; jamais nécessaire pour suivre"}
    - {notion: "Classe [a ; b[ : la borne gauche est incluse, la droite non", episode: "", rappel: "Dit au chapitre 2 et rappelé au laboratoire : chaque classe contient sa borne gauche, pas sa borne droite ; un trajet de 15 minutes compte dans 15–20 (classes de 5), un trajet de 20 minutes dans 20–30. La dernière classe se termine strictement au-dessus du maximum (44 min : dernière classe 40–50 ou 40–60), donc aucune valeur ne tombe sur sa borne droite"}
    - {notion: "Moyenne approchée par les centres de classes (tailles groupées)", episode: "", rappel: "Chapitre 4, au rappel des tailles : quand on ne connaît que les classes, on prend le milieu de chaque classe comme valeur de ses individus ; le résultat est une approximation"}
    - {notion: "Arrondi au dixième", episode: "", rappel: "Annoncé quand on l'utilise (densité 0,67)"}
    # Notions enseignées DANS l'épisode et réutilisées plus loin : effectif, fréquence, cumul (ch. 1) ;
    # classe, densité (ch. 2) ; mode, symétrie, queue (ch. 3) ; moyenne simple et pondérée (ch. 4) ; médiane (ch. 5).

objectifs:
  fr:
    - "Construire un tableau d'effectifs, de fréquences et de fréquences cumulées"
    - "Choisir entre diagramme en barres et histogramme selon le type de variable"
    - "Expliquer comment la largeur des classes change un histogramme, et lire une densité quand les classes sont inégales"
    - "Décrire la forme d'une distribution : symétrie, queue, une ou deux bosses"
    - "Calculer une moyenne simple et pondérée, et une médiane (nombre pair ou impair de valeurs)"
    - "Choisir entre moyenne et médiane d'après la forme de la distribution et la question posée"
  en:
    - "Build a table of counts, relative frequencies and cumulative frequencies"
    - "Choose between a bar chart and a histogram from the type of variable"
    - "Explain how bin width changes a histogram, and read a density when bins are unequal"
    - "Describe the shape of a distribution: symmetry, tail, one or two peaks"
    - "Compute a simple and a weighted mean, and a median (odd or even number of values)"
    - "Choose between mean and median from the shape of the distribution and the question asked"

intuition: "Résumer, c'est choisir ce qu'on garde. Un tableau garde les proportions, un histogramme garde la silhouette, la moyenne garde le total, la médiane garde le milieu."
exemple_fil_rouge: >-
  Une entreprise fictive de 20 salariés, la même d'un bout à l'autre : leur mode de transport (ch. 1),
  leur temps de trajet (ch. 2 et 3, puis au laboratoire et dans la synthèse). Les chapitres 4 et 5 gardent
  leurs exemples validés (cagnotte, notes pondérées, café), et la synthèse revient à l'entreprise.
  Ce n'est pas « JG's Holding », réservée au parcours Actuariat.
exemple_reel:
  description: "Aucun. Un exemple réel (distribution des salaires, Insee ou ONS) reste reporté comme dans S2.05, faute de fiche de provenance."
  source: {organisme: "", titre: "", url: "", date_publication: "", periode_donnees: "", consulte_le: ""}

