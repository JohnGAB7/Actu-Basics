cycle_enquete:
  question: "Montrée : comment dessiner des trajets ?"
  population_et_mesure: "Montrée : 20 salariés, temps en minutes"
  origine_des_donnees: "Montrée : exemple fictif"
  exploration: "Montrée : deux largeurs de classes, puis classes inégales"
  methode_et_raison: "Montrée : barres pour des catégories, histogramme pour des nombres, densité si classes inégales"
  hypotheses: "Montrée : nombres fictifs"
  resultat_et_incertitude: "Pas d'incertitude : population complète"
  interpretation_permise_et_interdite: "Montrée : comparer des surfaces, pas des hauteurs, quand les classes sont inégales"
