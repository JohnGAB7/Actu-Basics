titres:
  fr: "Diagrammes en barres et histogrammes"
  en: "Bar charts and histograms"
question_centrale:
  fr: "Pourquoi un histogramme n'est-il pas un diagramme en barres ?"
  en: "Why is a histogram not a bar chart?"

position: {pilier: statistiques, niveau: 1, module: S2, rang_dans_module: 2}

public:
  prerequis: [S2.01]
  niveau_maths: M0
  rappel_conseille: [M0.03]
  notions_utilisees:
    - {notion: "Effectif, total", episode: "EP-S2A, chapitre 1", rappel: ""}
    - {notion: "Variable qualitative ou quantitative continue", episode: EP-S1A, rappel: "Catégories (mode de transport) contre nombres qui se suivent sans trou (minutes)"}
    - {notion: "Lire un graphique : axes, graduations", episode: EP-M01, rappel: "Axes nommés à voix haute"}
    - {notion: "Aire d'un rectangle", episode: "", rappel: "Largeur × hauteur, rectangle dessiné et mesuré (0,7 × 10 = 7)"}
    - {notion: "Classe [a ; b[", episode: "", rappel: "Chaque classe contient sa borne gauche et pas sa borne droite ; la dernière classe se termine au-dessus du maximum"}
    - {notion: "Division et arrondi au centième", episode: EP-M01, rappel: "10 ÷ 30 ≈ 0,33, annoncé comme arrondi"}

objectifs:
  fr:
    - "Choisir le diagramme en barres pour des catégories et l'histogramme pour une variable numérique groupée en classes"
    - "Montrer que la largeur des classes change la silhouette d'un histogramme"
    - "Calculer une densité d'effectif (effectif ÷ largeur) et lire l'effectif comme l'aire d'un rectangle"
  en:
    - "Use a bar chart for categories and a histogram for a numeric variable grouped into bins"
    - "Show that bin width changes the shape of a histogram"
    - "Compute a count density (count ÷ width) and read the count as the area of a rectangle"

intuition: "Dans un histogramme, c'est la surface qui compte, pas la hauteur."
exemple_fil_rouge: "Les 20 salariés de l'entreprise fictive : mode de transport (barres), puis temps de trajet en classes de 10 et 20 minutes, puis classes inégales 0–10, 10–20, 20–50."
