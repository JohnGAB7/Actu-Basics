  source: {organisme: "", url: "", licence: "", population: "Fictive", variables: "mode de transport, temps de trajet", periode: "", limites: ""}
  parametres_simulation: "Aucun tirage aléatoire"

hypotheses_et_limites:
  - {hypothese: "Classes choisies à la main", intuition: "Il n'y a pas une seule bonne largeur", testable: "", non_testable: "", diagnostic: "Comparer plusieurs largeurs (laboratoire 1)", si_elle_echoue: "Des règles de choix de largeur existent (Scott, cité par le NIST) : niveau avancé, S11.08 (de l'histogramme aux noyaux)"}

reproductibilite: "Calculs entièrement à l'écran ; blocs verifier de la fiche de production ; module de calcul des laboratoires"

deroule:
  - {etape: question, contenu: "Des barres qui se touchent, ou non : ça change tout"}
  - {etape: donnees, contenu: "Diagramme en barres du mode de transport des 20 salariés (tableau du chapitre 1)"}
  - {etape: raisonnement, contenu: "Histogramme des temps de trajet, classes de 10 minutes (3, 7, 6, 3, 1), borne gauche incluse ; barres jointives"}
  - {etape: raisonnement, contenu: "Mêmes données en classes de 20 minutes (10, 9, 1) : le sommet disparaît"}
  - {etape: limites, contenu: "Classes inégales 0–10, 10–20, 20–50 : en effectif, la grande classe écrase tout"}
  - {etape: formalisation, contenu: "Densité d'effectif = effectif ÷ largeur ; aire = effectif ; 0,3, 0,7, 0,33 salarié par minute"}
  - {etape: exercice, contenu: "40 visiteurs : 0–20 : 8, 20–30 : 12, 30–60 : 20 ; classe la plus dense ?"}
  - {etape: correction, contenu: "0,4, 1,2 et environ 0,67 visiteur par année : 20–30 ans"}
  - {etape: application, contenu: "Dans l'épisode : laboratoire 1 (largeur des classes et bascule effectif / densité)"}

formules:
  - {formule: "densité d'effectif = effectif / largeur de la classe", explication_symboles: "largeur en unités de la variable", conditions: "indispensable dès que les classes sont inégales"}
  - {formule: "aire du rectangle = densité × largeur = effectif", explication_symboles: "", conditions: "aire totale = effectif total N"}

calculs_a_verifier:
  - {expression: "8 + 6 + 4 + 2", attendu: 20, libelle: "Total des salariés"}
  - {expression: "3 + 7 + 6 + 3 + 1", attendu: 20, libelle: "Total, classes de 10 minutes"}
  - {expression: "6 + 3 + 1", attendu: 10, libelle: "Classe 20 à 50 minutes"}
  - {expression: "round(10 / 30, 2)", attendu: 0.33, libelle: "Densité de la classe 20 à 50 minutes"}
  - {expression: "0.7 * 10", attendu: 7, libelle: "Surface de la classe 10 à 20 minutes"}
  - {expression: "12 / 10", attendu: 1.2, libelle: "Densité 20 à 30 ans"}
  - {expression: "round(20 / 30, 2)", attendu: 0.67, libelle: "Densité 30 à 60 ans"}

idees_fausses:
  - {idee: "Espaces entre les barres d'un histogramme", desamorcee_a_l_etape: "L'histogramme : des nombres en classes"}
  - {idee: "Classes de largeurs inégales sans corriger les hauteurs", desamorcee_a_l_etape: "Classes inégales : la surface compte"}

exercice:
  question: "Âges de 40 visiteurs : 0–20 : 8, 20–30 : 12, 30–60 : 20. Quelle classe est la plus dense ?"
  correction: "Densités d'effectif : 8 ÷ 20 = 0,4, 12 ÷ 10 = 1,2, 20 ÷ 30 ≈ 0,67 visiteur par année d'âge. La plus dense est 20–30 ans ; l'histogramme en effectifs ferait croire que c'est 30–60 ans."
  pause_secondes: 8

preuve_apprentissage:
  tache: "Calculer sans aide les densités de l'exercice et désigner la classe la plus dense"
  question_de_transfert: "Un histogramme des revenus regroupe « 5 000 € et plus » en une seule barre très haute. Que conclure ?"
  diagnostic_d_erreur: "« La barre la plus haute est la classe la plus peuplée par unité » : vrai si les classes sont inégales ?"
  limite_a_enoncer: "Un histogramme dépend du choix des classes : toujours regarder leur largeur"

