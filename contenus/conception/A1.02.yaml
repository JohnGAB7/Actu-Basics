  source: {organisme: "", url: "", licence: "", population: "", variables: "", periode: "", limites: ""}
  parametres_simulation: ""

hypotheses_et_limites:
  - {hypothese: "Taux constant toute l'année", intuition: "Le même 1 % chaque mois", testable: "", non_testable: "", diagnostic: "", si_elle_echoue: "Taux variables : on multiplie les facteurs mois par mois"}

reproductibilite: "Formules à l'écran ; tableur : =(1+1%)^12-1"

deroule:
  - {etape: question, contenu: "1 % par mois sur une prime payée en mensualités : est-ce 12 % par an ?"}
  - {etape: intuition, contenu: "On multiplie par 12 : 12 %. C'est le taux nominal"}
  - {etape: donnees, contenu: "1 000 € à 1 % par mois : 1 010 € ; 1 020,10 € ; … ; 1 126,83 € après 12 mois, contre 1 120 € à 12 % simples"}
  - {etape: formalisation, contenu: "Taux effectif annuel = (1 + j)ᵐ − 1 ; nominal = j × m"}
  - {etape: raisonnement, contenu: "1,5 % par mois : 18 % nominal, 19,56 % effectif ; l'écart grandit avec le taux"}
  - {etape: raisonnement, contenu: "Dans l'autre sens : 5 % par an équivaut à 0,4074 % par mois, pas 5 ÷ 12 = 0,4167 %"}
  - {etape: exercice, contenu: "6 % par an, capitalisés chaque trimestre : quel taux effectif annuel ?"}
  - {etape: correction, contenu: "1,5 % par trimestre ; 1,015⁴ − 1 ≈ 6,14 %"}
  - {etape: application, contenu: "Un actuaire convertit toujours les taux sur la même période avant de comparer ou d'actualiser"}
  - {etape: limites, contenu: "Capitaliser à chaque instant mène au taux continu : la séance du parcours va plus loin"}
  - {etape: rappel, contenu: "La suite : la valeur actuelle de plusieurs paiements (A1.03)"}

formules:
  - {formule: "i = (1 + j)^m - 1", explication_symboles: "j taux par période ; m périodes par an ; i taux effectif annuel", conditions: "taux constant"}
  - {formule: "j = (1 + i)^{1/m} - 1", explication_symboles: "taux périodique équivalent", conditions: ""}
  - {formule: "i^{(m)} = m \\cdot j", explication_symboles: "taux nominal annuel", conditions: "à ne pas confondre avec i"}

calculs_a_verifier:
  - {expression: "1000 * 1.12", attendu: 1120, libelle: "12 % simples sur un an"}
  - {expression: "1000 * 1.01**12", attendu: 1126.83, libelle: "1 % par mois pendant 12 mois"}
  - {expression: "100 * (1.01**12 - 1)", attendu: 12.68, libelle: "Taux effectif de 1 % par mois, en %"}
  - {expression: "100 * (1.015**12 - 1)", attendu: 19.56, libelle: "Taux effectif de 1,5 % par mois, en %"}
  - {expression: "100 * (1.05**(1/12) - 1)", attendu: 0.4074, libelle: "Mensuel équivalent à 5 % par an, en %"}
  - {expression: "100 * 0.05 / 12", attendu: 0.4167, libelle: "5 ÷ 12, en %"}
  - {expression: "100 * (1.015**4 - 1)", attendu: 6.14, libelle: "Exercice : 6 % trimestriels, en %"}

idees_fausses:
  - {idee: "Un taux mensuel × 12 donne le taux annuel", desamorcee_a_l_etape: "donnees"}
  - {idee: "Un taux annuel ÷ 12 donne le taux mensuel équivalent", desamorcee_a_l_etape: "raisonnement"}

exercice:
  question: "JG's Holding place sa trésorerie à 6 % par an, capitalisés chaque trimestre. Quel est le taux effectif annuel ?"
  correction: "Taux trimestriel : 6 % ÷ 4 = 1,5 %. Taux effectif : 1,015⁴ − 1 ≈ 0,0614, soit 6,14 % par an, un peu plus que 6 %."
  pause_secondes: 10

preuve_apprentissage:
  tache: "Convertir un taux périodique en taux effectif annuel, et inversement"
  question_de_transfert: "2 % par semestre ou 4 % par an : lequel rapporte le plus ?"
  diagnostic_d_erreur: "« 1 % par mois = 12 % par an » : quel effet est oublié ?"
  limite_a_enoncer: "Les formules supposent un taux constant sur l'année"

