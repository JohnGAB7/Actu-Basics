objectifs:
  fr:
    - "Calculer le taux effectif annuel d'un taux périodique : (1 + j)ᵐ − 1"
    - "Distinguer taux nominal annuel (j × m) et taux effectif annuel"
    - "Calculer le taux périodique équivalent à un taux annuel donné"
  en:
    - "Compute the effective annual rate of a periodic rate: (1 + j)ᵐ − 1"
    - "Tell the nominal annual rate (j × m) from the effective annual rate"
    - "Compute the periodic rate equivalent to a given annual rate"

intuition: "Plus on capitalise souvent, plus les intérêts ont le temps de rapporter des intérêts : 12 fois 1 % donne plus que 12 %."
exemple_fil_rouge: "JG's Holding (fictive) propose à ses clients de payer leur prime en 12 mensualités, avec un coût de 1 % par mois. Est-ce un coût de 12 % par an ?"
