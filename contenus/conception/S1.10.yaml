  tache: Répondre à la question de transfert sans aide
  question_de_transfert: Un fichier « anonyme » contient âge exact, profession et village. Est-il anonyme ?
  diagnostic_d_erreur: '« Il n''y a pas de nom, donc personne n''est reconnaissable » : qu''est-ce qui manque ?'
