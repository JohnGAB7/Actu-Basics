intuition: Plus on croise de colonnes, plus chaque ligne devient unique.
exemple_fil_rouge: Date de naissance × sexe × code postal ; commune fictive de 2 000 habitants ; entreprise fictive de 500 salariés.
exemple_reel: 'L. Sweeney (2000), « Simple Demographics Often Identify People Uniquely » : 87 % des Américains identifiables
