deroule:
  - {etape: question, contenu: "2 900 € tout de suite, ou 1 000 € par an pendant 3 ans ?"}
  - {etape: intuition, contenu: "3 000 € > 2 900 € : on prend les trois paiements ?"}
  - {etape: donnees, contenu: "Frise : 1 000 € à la fin des années 1, 2 et 3"}
  - {etape: raisonnement, contenu: "À 3 % : 970,87 € + 942,60 € + 915,14 € = 2 828,61 €, moins que 2 900 €"}
  - {etape: formalisation, contenu: "VA = Σ Cₖ ÷ (1 + i)ᵏ"}
  - {etape: raisonnement, contenu: "Le taux décide : à 0 %, 3 000 € ; à 6 %, 2 673,01 €"}
  - {etape: exercice, contenu: "À 4 % : 500 € dans 1 an puis 1 500 € dans 2 ans, ou l'inverse ?"}
  - {etape: correction, contenu: "480,77 + 1 386,83 = 1 867,60 € ; 1 442,31 + 462,28 = 1 904,59 € : l'argent reçu tôt vaut plus"}
  - {etape: application, contenu: "Un assureur compare ainsi des règlements, des primes et des prestations étalées dans le temps"}
  - {etape: limites, contenu: "Paiements certains et taux unique : deux hypothèses levées plus loin"}
  - {etape: rappel, contenu: "La suite : une formule pour les paiements réguliers, l'annuité (A1.04)"}

formules:
  - {formule: "VA = \\sum_{k=1}^{n} C_k / (1 + i)^k", explication_symboles: "Cₖ paiement à la fin de l'année k ; i taux annuel", conditions: "paiements certains, taux constant"}

calculs_a_verifier:
  - {expression: "1000 / 1.03", attendu: 970.87, libelle: "Paiement de l'année 1"}
  - {expression: "1000 / 1.03**2", attendu: 942.60, libelle: "Paiement de l'année 2"}
  - {expression: "1000 / 1.03**3", attendu: 915.14, libelle: "Paiement de l'année 3"}
  - {expression: "1000 / 1.03 + 1000 / 1.03**2 + 1000 / 1.03**3", attendu: 2828.61, libelle: "VA des trois paiements à 3 %"}
  - {expression: "1000 / 1.06 + 1000 / 1.06**2 + 1000 / 1.06**3", attendu: 2673.01, libelle: "VA à 6 %"}
  - {expression: "500 / 1.04 + 1500 / 1.04**2", attendu: 1867.60, libelle: "Exercice : 500 puis 1 500"}
  - {expression: "1500 / 1.04 + 500 / 1.04**2", attendu: 1904.59, libelle: "Exercice : 1 500 puis 500"}

idees_fausses:
