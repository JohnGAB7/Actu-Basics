  - {idee: "La meilleure offre est la même quel que soit le taux", desamorcee_a_l_etape: "raisonnement"}

exercice:
  question: "À 4 % par an, que vaut le plus aujourd'hui : 500 € dans 1 an puis 1 500 € dans 2 ans, ou 1 500 € dans 1 an puis 500 € dans 2 ans ?"
  correction: "Premier échéancier : 500 ÷ 1,04 + 1 500 ÷ 1,04² ≈ 480,77 + 1 386,83 = 1 867,60 €. Second : 1 500 ÷ 1,04 + 500 ÷ 1,04² ≈ 1 442,31 + 462,28 = 1 904,59 €. Même total de 2 000 €, mais le second vaut plus : l'argent reçu plus tôt."
  pause_secondes: 12

