  tache: "Calculer la valeur actuelle d'un échéancier de deux ou trois paiements"
  question_de_transfert: "À quel taux 2 900 € aujourd'hui et 3 × 1 000 € se valent-ils à peu près ? (essayer 1 % et 2 %)"
  diagnostic_d_erreur: "« 3 000 € > 2 900 €, donc l'échéancier vaut plus » : qu'est-ce qui manque ?"
  limite_a_enoncer: "La comparaison dépend du taux choisi"

