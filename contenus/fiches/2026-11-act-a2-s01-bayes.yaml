      - "Remonter d'un événement observé vers sa cause probable avec la formule de Bayes"
      - "Calculer la probabilité d'au moins un événement parmi n contrats indépendants"
    en:
      - "Compute a conditional probability P(A | B) and an intersection"
      - "Recognise two independent events"
      - "Rebuild an overall rate with the law of total probability"
      - "Go back from an observed event to its likely cause with Bayes' theorem"
      - "Compute the probability of at least one event among n independent policies"
