      - "Calculer l'annuité constante d'un prêt, P = L ÷ aₙ"
      - "Découper chaque paiement en intérêts et en capital remboursé, et dresser le tableau d'amortissement"
      - "Calculer le solde restant dû de façon prospective et rétrospective"
      - "Définir et estimer un taux de rendement interne (TRI)"
      - "Calculer la valeur d'un contrat d'épargne des deux façons"
    en:
      - "Compute the level payment of a loan, P = L ÷ aₙ"
      - "Split each payment into interest and principal repaid, and build the amortization schedule"
      - "Compute the outstanding balance prospectively and retrospectively"
      - "Define and estimate an internal rate of return (IRR)"
      - "Compute the value of a savings contract both ways"
  prerequis:
    fr: ["Séances A1.01 à A1.03 : annuités, annuités mensuelles, valeur accumulée"]
    en: ["Sessions A1.01 to A1.03: annuities, monthly annuities, accumulated value"]
  hypotheses:
