# Parcours Actuariat (pilier A), vidéo longue de la séance a1/s04 « Prêts, amortissement et taux de rendement »
# (YOUTUBE_LESSON 16:9, FR et EN). Commande : JohnGAB7/AB-Actuarial-Lab PR #27 (a-produire/A1.md), format de JG du 23/11/2026.
