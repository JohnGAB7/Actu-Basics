    en: https://www.youtube.com/watch?v=ThwJLgCSomc

editions:
  fr:
    titre: "Combien de chômeurs ? D'où viennent les données"
    legende: |
      Combien y a-t-il de chômeurs en France ? La réponse dépend de la façon dont on les compte : une enquête auprès des ménages ou un fichier d'inscrits ne mesurent pas la même chose. On découvre les quatre grandes sources de données, recensement, sondage, fichiers administratifs, capteurs et plateformes, avec une force et une limite pour chacune. Sources : Insee, Informations Rapides n° 192 (chômage au sens du BIT, 2e trimestre 2026) et « L'essentiel sur... le chômage » (inscrits à France Travail). Série « Lire un chiffre sans se faire avoir ».
    hashtags: [statistiques, donnees, chomage]
    scenes:
      - type: accroche
        texte: "Combien de chômeurs en France ? *Ça dépend de qui compte.*"
        voix_off: "Combien y a-t-il de chômeurs en France ? La réponse dépend de qui compte, et de la façon dont on compte."
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Quatre façons de collecter"
        voix_off: "Il existe quatre grandes façons de produire des données."
      - type: etapes
        texte: "Les quatre grandes sources"
        disposition: cartes
        etapes:
          - "*Recensement* : tout le monde"
          - "*Sondage* : un échantillon"
          - "*Fichiers* : enregistrer pour gérer"
          - "*Capteurs* : garder des traces"
        voix_off: "Le recensement interroge toute la population. L'enquête par sondage interroge seulement un échantillon, choisi pour la représenter. Le fichier administratif enregistre des personnes pour gérer un service : les impôts, l'état civil, les inscriptions. Enfin, les capteurs et les plateformes gardent des traces : passages de voitures, achats, connexions."
      - type: etapes
        texte: "Une force, une limite"
        etapes:
          - "Recensement : *complet*, mais lourd et coûteux"
          - "Sondage : *rapide*, mais marge d'erreur"
          - "Fichier : *énorme*, mais selon des règles de gestion"
          - "Capteurs : *en continu*, mais pas partout"
        voix_off: "Chaque source a une force et une limite. Le recensement est complet, mais lourd et coûteux à organiser. Le sondage est rapide, mais il a une marge d'erreur, et certaines personnes ne répondent pas. Le fichier administratif est énorme et déjà disponible, mais il ne compte que ce que ses règles de gestion lui demandent de compter. Les capteurs mesurent en continu, mais seulement là où ils sont installés. Les plateformes, elles, ne voient que leurs utilisateurs."
      - type: texte
        texte: "Ce qui n'est *pas collecté* n'apparaît pas dans les données"
        voix_off: "Retenez l'idée générale : chaque façon de collecter laisse sa trace dans le chiffre. Ce qui n'est pas collecté n'apparaît tout simplement pas dans les données."
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Le chômage : enquête ou fichier ?"
        voix_off: "Revenons au chômage, qui se mesure de deux façons différentes."
      - type: etapes
        texte: "Deux façons de compter"
        etapes:
          - "Insee : une *enquête*, définition du BIT"
          - "Sans emploi, *disponible*, en recherche *active*"
          - "France Travail : un *fichier* de personnes inscrites"
        voix_off: "D'un côté, l'Insee mène une enquête auprès d'un échantillon de ménages, et applique la définition du Bureau international du travail. Est chômeur, au sens du BIT, une personne de quinze ans ou plus qui n'a pas travaillé, même une heure, pendant une semaine donnée, qui est disponible pour travailler, et qui cherche activement un emploi. De l'autre côté, France Travail tient un fichier : il compte les personnes inscrites, selon ses propres règles d'inscription."
      - type: chiffre
        valeur: 2.7
        suffixe: {fr: " millions", en: " million"}
        texte: "de chômeurs au sens du BIT, au 2e trimestre 2026"
        note: "Insee, enquête Emploi : 2 677 000 personnes, données corrigées des variations saisonnières."
        voix_off: "Selon l'enquête de l'Insee, la France comptait deux virgule sept millions de chômeurs au sens du BIT au deuxième trimestre deux mille vingt-six."
        verifier:
          - {expression: "2677 / 1000", attendu: 2.7, libelle: "Chômeurs au sens du BIT, en millions"}
      - type: texte
        texte: "Un inscrit n'est pas forcément *chômeur au sens du BIT*, et inversement"
        note: "Insee : 3,3 millions d'inscrits à France Travail en catégorie A au 2e trimestre 2026 (France hors Mayotte)."
        voix_off: "Le nombre d'inscrits à France Travail est différent : trois virgule trois millions en catégorie A, au même trimestre. Ce n'est pas une erreur : les deux chiffres ne mesurent pas la même chose. Une personne qui a travaillé ne serait-ce qu'une heure dans la semaine de référence n'est pas chômeuse au sens du BIT, même si elle reste inscrite. À l'inverse, une personne qui cherche activement un emploi sans être inscrite peut être comptée par l'enquête, mais pas par le fichier."
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "D'où viennent ces chiffres ? *Les naissances* de l'année. *La confiance* dans les scientifiques. *Le trafic* du périphérique à 8 h."
        pause: 6
        voix_off: "À vous. D'où viennent ces trois chiffres ? Le nombre de naissances de l'année. La part des gens qui font confiance aux scientifiques. Le nombre de voitures sur le périphérique à huit heures du matin."
      - type: correction
        etapes:
          - "Naissances : *fichier administratif*, l'état civil"
          - "Confiance : *sondage*, avec une marge d'erreur"
          - "Trafic : *capteurs*, seulement là où il y en a"
        reponse: "Un fichier, un sondage, des capteurs"
        voix_off: "Les naissances viennent d'un fichier administratif, l'état civil : chaque naissance est déclarée à la mairie. La confiance dans les scientifiques vient d'un sondage : on ne peut pas interroger tout le monde, d'où une marge d'erreur. Le trafic vient de capteurs posés sur la route : il ne compte que les endroits équipés."
      - type: etapes
        texte: "Ce qu'il faut retenir"
        etapes:
          - "Demander : *qui* a collecté, et *comment* ?"
          - "Chaque source a une *force* et une *limite*"
          - "Deux sources, deux définitions : *deux chiffres*"
        voix_off: "Récapitulons. Devant un chiffre, demandez qui l'a collecté, et comment. Chaque source a une force et une limite. Et deux sources qui comptent avec deux définitions différentes donnent deux chiffres différents, sans qu'aucune ne se trompe."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "How many unemployed? Where numbers come from"
    legende: |
      How many people are unemployed in France? The answer depends on how they're counted: a household survey and a register of jobseekers don't measure the same thing. We look at the four main sources of data, censuses, surveys, administrative records, sensors and platforms, with one strength and one limitation for each. Sources: Insee, Informations Rapides no. 192 (ILO unemployment, Q2 2026) and Key facts on unemployment (France Travail registrations). Series "Reading numbers without being fooled".
    hashtags: [statistics, data, unemployment]
    scenes:
      - type: accroche
        texte: "How many unemployed people in France? *It depends who's counting.*"
        voix_off: "How many people are unemployed in France? The answer depends on who is counting, and how."
      - type: titre
        numero: 1
        texte: "Four ways to collect data"
        voix_off: "There are four main ways to produce data."
      - type: etapes
        texte: "The four main sources"
        disposition: cartes
        etapes:
          - "*Census*: ask everyone"
          - "*Survey*: ask a sample"
          - "*Administrative records*: record to manage"
          - "*Sensors and platforms*: keep traces"
        voix_off: "A census asks the whole population. A sample survey asks only a sample, chosen to represent it. Administrative records register people in order to run a service: taxes, births and deaths, registrations. Finally, sensors and platforms keep traces: cars going by, purchases, log-ins."
      - type: etapes
        texte: "One strength, one limitation"
        etapes:
          - "Census: *complete*, but heavy and costly"
          - "Survey: *fast*, but a margin of error"
          - "Records: *huge*, but defined by administrative rules"
          - "Sensors: *continuous*, but only where installed"
        voix_off: "Each source has a strength and a limitation. A census is complete, but heavy and costly to run. A survey is fast, but it has a margin of error, and some people don't answer. Administrative records are huge and already available, but they only count what their rules ask them to count. Sensors measure continuously, but only where they're installed. Platforms, for their part, only see their own users."
      - type: texte
        texte: "What *isn't collected* doesn't show up in the data"
        voix_off: "Remember the general idea: every way of collecting data leaves its mark on the number. What isn't collected simply doesn't show up in the data."
      - type: titre
        numero: 2
        texte: "Unemployment: survey or register?"
        voix_off: "Back to unemployment, which is measured in two different ways."
      - type: etapes
        texte: "Two ways of counting"
        etapes:
          - "Insee: a *survey*, ILO definition"
          - "No job, *available*, *actively* looking"
          - "France Travail: a *register* of jobseekers"
        voix_off: "On one side, Insee, the French statistics office, surveys a sample of households and applies the definition of the International Labour Organization. Under that definition, a person is unemployed if they have no job, are available to work, and are actively looking for one. On the other side, France Travail, the public employment service, keeps a register: it counts the people who have signed up, under its own rules."
      - type: chiffre
        valeur: 2.7
        suffixe: {fr: " millions", en: " million"}
        texte: "unemployed people under the ILO definition, Q2 2026"
        note: "Insee, Labour Force Survey: 2,677,000 people, seasonally adjusted."
        voix_off: "According to Insee's survey, France had two point seven million unemployed people under the ILO definition in the second quarter of twenty twenty-six."
        verifier:
          - {expression: "2677 / 1000", attendu: 2.7, libelle: "ILO unemployed, millions"}
      - type: texte
        texte: "A registered jobseeker isn't always *ILO-unemployed*, and vice versa"
        note: "Insee: 3.3 million people registered with France Travail in category A, Q2 2026 (France excluding Mayotte)."
        voix_off: "The number of people registered with France Travail is different: three point three million in category A, in the same quarter. That's not a mistake: the two figures don't measure the same thing. Someone who worked even one hour in the reference week isn't unemployed under the ILO definition, even if they stay registered. And someone actively looking for work without registering can be counted by the survey, but not by the register."
      - type: exercice
        texte: "Where do these numbers come from? *Births* this year. *Trust* in scientists. *Traffic* on the ring road at 8 a.m."
        pause: 6
        voix_off: "Your turn. Where do these three numbers come from? The number of births this year. The share of people who trust scientists. The number of cars on the ring road at eight in the morning."
      - type: correction
        etapes:
          - "Births: *administrative records*, the civil register"
          - "Trust: a *survey*, with a margin of error"
          - "Traffic: *sensors*, only where there are some"
        reponse: "A register, a survey, sensors"
        voix_off: "Births come from administrative records, the civil register: every birth is declared at the town hall. Trust in scientists comes from a survey: you can't ask everyone, hence a margin of error. Traffic comes from sensors on the road: it only counts the places that are equipped."
      - type: etapes
        texte: "What to remember"
        etapes:
          - "Ask: *who* collected it, and *how*?"
          - "Each source has a *strength* and a *limitation*"
          - "Two sources, two definitions: *two numbers*"
        voix_off: "Let's recap. When you see a number, ask who collected it, and how. Each source has a strength and a limitation. And two sources that count with two different definitions give two different numbers, without either of them being wrong."
      - type: fin
        texte: "Follow to learn how to read numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
