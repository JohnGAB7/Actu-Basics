# Niveau 1, vague 1, lot 1 : S1.04 « D'où viennent les données ? » (EDUCATIONAL)
# Fiche de conception : contenus/conception/S1.04.yaml
# Source lue le 2026-11-03 : Insee, Informations Rapides n° 192, « Au deuxième trimestre 2026, le taux
# de chômage augmente de 0,2 point et atteint 8,3 % », paru le 07/08/2026,
# https://www.insee.fr/fr/statistiques/9032359 : 2 677 milliers de chômeurs au sens du BIT (CVS, France).
# Le nombre d'inscrits à France Travail n'est PAS cité : la publication de la Dares n'a pas pu être lue
# (page de vérification anti-robot). Seule la différence de définition est énoncée.
# Prochaine publication de l'Insee le 10/11/2026 (3e trimestre) : chiffre à mettre à jour avant validation.
# Statut : brouillon. Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s1-04-d-ou-viennent-les-donnees
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S1.04 · D'où viennent les données ?"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Distinguer recensement, enquête par sondage, données administratives et données de capteurs ou de plateformes"
      - "Citer une force et une limite de chaque type de source"
    en:
      - "Tell apart a census, a sample survey, administrative records and sensor or platform data"
      - "Name one strength and one limitation of each type of source"
  prerequis:
    fr: ["S1.02 : population, individu, variable"]
    en: ["S1.02: population, unit, variable"]
  hypotheses:
    fr: "Chômage au sens du BIT : dernier chiffre publié par l'Insee à la date de préparation (2e trimestre 2026)"
    en: "ILO unemployment: latest figure published by Insee when the video was prepared (Q2 2026)"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

sources:
  - nom:
      fr: "Insee, Informations Rapides n° 192, chômage au 2e trimestre 2026"
      en: "Insee, Informations Rapides no. 192, unemployment in Q2 2026"
    url: "https://www.insee.fr/fr/statistiques/9032359"
    date_consultation: "2026-11-03"

editions:
  fr:
    titre: "Combien de chômeurs ? D'où viennent les données"
    legende: |
      Combien y a-t-il de chômeurs en France ? La réponse dépend de la façon dont on les compte : une enquête auprès des ménages ou un fichier d'inscrits ne mesurent pas la même chose. On découvre les quatre grandes sources de données, recensement, sondage, fichiers administratifs, capteurs et plateformes, avec une force et une limite pour chacune. Source : Insee, Informations Rapides n° 192 (chômage au sens du BIT, 2e trimestre 2026). Série « Lire un chiffre sans se faire avoir ».
    hashtags: [statistiques, donnees, chomage]
    scenes:
      - type: accroche
        texte: "Combien de chômeurs en France ? *Ça dépend de qui compte.*"
        voix_off: "Combien y a-t-il de chômeurs en France ? La réponse dépend de qui compte, et de la façon dont on compte."
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Quatre façons de collecter"
        voix_off: "Il existe quatre grandes façons de produire des données."
      - type: etapes
        texte: "Les quatre grandes sources"
        disposition: cartes
        etapes:
          - "*Recensement* : on interroge tout le monde"
          - "*Sondage* : on interroge un échantillon"
          - "*Fichier administratif* : on enregistre pour gérer"
          - "*Capteurs et plateformes* : on garde des traces"
        voix_off: "Le recensement interroge toute la population. L'enquête par sondage interroge seulement un échantillon, choisi pour la représenter. Le fichier administratif enregistre des personnes pour gérer un service : les impôts, l'état civil, les inscriptions. Enfin, les capteurs et les plateformes gardent des traces : passages de voitures, achats, connexions."
      - type: etapes
        texte: "Une force, une limite"
        etapes:
          - "Recensement : *complet*, mais lourd et coûteux"
          - "Sondage : *rapide*, mais marge d'erreur et non-réponses"
          - "Fichier : *énorme*, mais défini par des règles de gestion"
          - "Capteurs : *en continu*, mais seulement ce qui est équipé"
        voix_off: "Chaque source a une force et une limite. Le recensement est complet, mais lourd et coûteux à organiser. Le sondage est rapide, mais il a une marge d'erreur, et certaines personnes ne répondent pas. Le fichier administratif est énorme et déjà disponible, mais il ne compte que ce que ses règles de gestion lui demandent de compter. Les capteurs mesurent en continu, mais seulement là où ils sont installés, et seulement les personnes qui utilisent la plateforme."
      - type: texte
        texte: "Ce qui n'est *pas collecté* n'existe pas dans les données"
        voix_off: "Retenez l'idée générale : chaque façon de collecter laisse sa trace dans le chiffre. Ce qui n'est pas collecté n'existe tout simplement pas dans les données."
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Le chômage : enquête ou fichier ?"
        voix_off: "Revenons au chômage, qui se mesure de deux façons différentes."
      - type: etapes
        texte: "Deux façons de compter"
        etapes:
          - "Insee : une *enquête*, définition du BIT"
          - "Sans emploi, *disponible*, en recherche *active*"
          - "France Travail : un *fichier* de personnes inscrites"
        voix_off: "D'un côté, l'Insee mène une enquête auprès d'un échantillon de ménages, et applique la définition du Bureau international du travail. Est chômeur, au sens du BIT, une personne sans emploi, disponible pour travailler, et qui cherche activement un emploi. De l'autre côté, France Travail tient un fichier : il compte les personnes inscrites, selon ses propres règles d'inscription."
      - type: chiffre
        valeur: 2.7
        suffixe: {fr: " millions", en: " million"}
        texte: "de chômeurs au sens du BIT, au 2e trimestre 2026"
        note: "Insee, enquête Emploi : 2 677 000 personnes, données corrigées des variations saisonnières."
        voix_off: "Selon l'enquête de l'Insee, la France comptait deux virgule sept millions de chômeurs au sens du BIT au deuxième trimestre deux mille vingt-six."
        verifier:
          - {expression: "2677 / 1000", attendu: 2.7, libelle: "Chômeurs au sens du BIT, en millions"}
      - type: texte
        texte: "Un inscrit n'est pas forcément *chômeur au sens du BIT*, et inversement"
        voix_off: "Le nombre d'inscrits à France Travail est différent. Ce n'est pas une erreur : les deux chiffres ne mesurent pas la même chose. Une personne qui a travaillé quelques heures dans le mois peut rester inscrite, sans être chômeuse au sens du BIT. À l'inverse, une personne qui cherche un emploi sans être inscrite est comptée par l'enquête, mais pas par le fichier."
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "D'où viennent ces chiffres ? *Les naissances* de l'année. *La confiance* dans les scientifiques. *Le trafic* du périphérique à 8 h."
        pause: 6
        voix_off: "À vous. D'où viennent ces trois chiffres ? Le nombre de naissances de l'année. La part des gens qui font confiance aux scientifiques. Le nombre de voitures sur le périphérique à huit heures du matin."
      - type: correction
        etapes:
          - "Naissances : *fichier administratif*, l'état civil"
          - "Confiance : *sondage*, avec une marge d'erreur"
          - "Trafic : *capteurs*, seulement là où il y en a"
        reponse: "Un fichier, un sondage, des capteurs"
        voix_off: "Les naissances viennent d'un fichier administratif, l'état civil : chaque naissance est déclarée à la mairie. La confiance dans les scientifiques vient d'un sondage : on ne peut pas interroger tout le monde, d'où une marge d'erreur. Le trafic vient de capteurs posés sur la route : il ne compte que les endroits équipés."
      - type: etapes
        texte: "Ce qu'il faut retenir"
        etapes:
          - "Demander : *qui* a collecté, et *comment* ?"
          - "Chaque source a une *force* et une *limite*"
          - "Deux sources, deux définitions : *deux chiffres*"
        voix_off: "Récapitulons. Devant un chiffre, demandez qui l'a collecté, et comment. Chaque source a une force et une limite. Et deux sources qui comptent avec deux définitions différentes donnent deux chiffres différents, sans qu'aucune ne se trompe."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "How many unemployed? Where numbers come from"
    legende: |
      How many people are unemployed in France? The answer depends on how they're counted: a household survey and a register of jobseekers don't measure the same thing. We look at the four main sources of data, censuses, surveys, administrative records, sensors and platforms, with one strength and one limitation for each. Source: Insee, Informations Rapides no. 192 (ILO unemployment, Q2 2026). Series "Reading numbers without being fooled".
    hashtags: [statistics, data, unemployment]
    scenes:
      - type: accroche
        texte: "How many unemployed people in France? *It depends who's counting.*"
        voix_off: "How many people are unemployed in France? The answer depends on who is counting, and how."
      - type: titre
        numero: 1
        texte: "Four ways to collect data"
        voix_off: "There are four main ways to produce data."
      - type: etapes
        texte: "The four main sources"
        disposition: cartes
        etapes:
          - "*Census*: ask everyone"
          - "*Survey*: ask a sample"
          - "*Administrative records*: record to manage"
          - "*Sensors and platforms*: keep traces"
        voix_off: "A census asks the whole population. A sample survey asks only a sample, chosen to represent it. Administrative records register people in order to run a service: taxes, births and deaths, registrations. Finally, sensors and platforms keep traces: cars going by, purchases, log-ins."
      - type: etapes
        texte: "One strength, one limitation"
        etapes:
          - "Census: *complete*, but heavy and costly"
          - "Survey: *fast*, but margin of error and non-response"
          - "Records: *huge*, but defined by administrative rules"
          - "Sensors: *continuous*, but only where installed"
        voix_off: "Each source has a strength and a limitation. A census is complete, but heavy and costly to run. A survey is fast, but it has a margin of error, and some people don't answer. Administrative records are huge and already available, but they only count what their rules ask them to count. Sensors measure continuously, but only where they're installed, and only the people who use the platform."
      - type: texte
        texte: "What *isn't collected* doesn't exist in the data"
        voix_off: "Remember the general idea: every way of collecting data leaves its mark on the number. What isn't collected simply doesn't exist in the data."
      - type: titre
        numero: 2
        texte: "Unemployment: survey or register?"
        voix_off: "Back to unemployment, which is measured in two different ways."
      - type: etapes
        texte: "Two ways of counting"
        etapes:
          - "Insee: a *survey*, ILO definition"
          - "No job, *available*, *actively* looking"
          - "France Travail: a *register* of jobseekers"
        voix_off: "On one side, Insee, the French statistics office, surveys a sample of households and applies the definition of the International Labour Organization. Under that definition, a person is unemployed if they have no job, are available to work, and are actively looking for one. On the other side, France Travail, the public employment service, keeps a register: it counts the people who have signed up, under its own rules."
      - type: chiffre
        valeur: 2.7
        suffixe: {fr: " millions", en: " million"}
        texte: "unemployed people under the ILO definition, Q2 2026"
        note: "Insee, Labour Force Survey: 2,677,000 people, seasonally adjusted."
        voix_off: "According to Insee's survey, France had two point seven million unemployed people under the ILO definition in the second quarter of twenty twenty-six."
        verifier:
          - {expression: "2677 / 1000", attendu: 2.7, libelle: "ILO unemployed, millions"}
      - type: texte
        texte: "A registered jobseeker isn't always *ILO-unemployed*, and vice versa"
        voix_off: "The number of people registered with France Travail is different. That's not a mistake: the two figures don't measure the same thing. Someone who worked a few hours in the month can stay registered without being unemployed under the ILO definition. And someone looking for work without registering is counted by the survey, but not by the register."
      - type: exercice
        texte: "Where do these numbers come from? *Births* this year. *Trust* in scientists. *Traffic* on the ring road at 8 a.m."
        pause: 6
        voix_off: "Your turn. Where do these three numbers come from? The number of births this year. The share of people who trust scientists. The number of cars on the ring road at eight in the morning."
      - type: correction
        etapes:
          - "Births: *administrative records*, the civil register"
          - "Trust: a *survey*, with a margin of error"
          - "Traffic: *sensors*, only where there are some"
        reponse: "A register, a survey, sensors"
        voix_off: "Births come from administrative records, the civil register: every birth is declared at the town hall. Trust in scientists comes from a survey: you can't ask everyone, hence a margin of error. Traffic comes from sensors on the road: it only counts the places that are equipped."
      - type: etapes
        texte: "What to remember"
        etapes:
          - "Ask: *who* collected it, and *how*?"
          - "Each source has a *strength* and a *limitation*"
          - "Two sources, two definitions: *two numbers*"
        voix_off: "Let's recap. When you see a number, ask who collected it, and how. Each source has a strength and a limitation. And two sources that count with two different definitions give two different numbers, without either of them being wrong."
      - type: fin
        texte: "Follow to learn to read the numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
