# Niveau 1, vague 1, lot 4 : S4.06 « Le paradoxe des anniversaires » (EDUCATIONAL, paradoxe)
# Variante leçon du paradoxe déjà produit en vidéo de lancement (sortie séparée, décision JG).
# Hypothèses classiques : 365 jours équiprobables, pas d'années bissextiles, pas de jumeaux.
# Statut : brouillon. En attente de relecture ChatGPT et de validation JG.
id: 2026-11-n1-s4-06-paradoxe-des-anniversaires
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S4.06 · Le paradoxe des anniversaires"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Compter les paires d'un groupe par la formule n(n−1)/2"
      - "Calculer la probabilité que tous les anniversaires soient différents, puis passer par le complément"
      - "Expliquer pourquoi l'intuition se trompe"
    en:
      - "Count the pairs in a group with n(n-1)/2"
      - "Compute the probability that all birthdays differ, then use the complement"
      - "Explain why intuition fails"
  prerequis:
    fr: ["S4.04 : combinaisons", "S4.05 : complément et union"]
    en: ["S4.04: combinations", "S4.05: complement and union"]
