# Niveau 1, vague 1, lot 2 : S1.10 « Données, éthique et vie privée » (EDUCATIONAL)
# Fiche de conception : contenus/conception/S1.10.yaml
# Source lue le 2026-11-08 : L. Sweeney, « Simple Demographics Often Identify People Uniquely »,
# Carnegie Mellon University, Data Privacy Working Paper 3, Pittsburgh 2000,
# https://dataprivacylab.org/projects/identifiability/paper1.pdf : résumé, « 87% (216 million of
# 248 million) of the population in the United States » probablement uniques d'après {code postal à
# 5 chiffres, sexe, date de naissance}, données du recensement américain de 1990.
# Le reste (commune fictive, fichier de salariés) est fictif. Aucune règle juridique n'est citée.
# Statut : brouillon, script à valider avant tout rendu (règle de JG, 2026-11-07).
# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s1-10-donnees-ethique-et-vie-privee
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S1.10 · Données, éthique et vie privée"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Expliquer la différence entre anonymisation et pseudonymisation"
      - "Citer un risque de réidentification et une bonne pratique pour le limiter"
    en:
      - "Explain the difference between anonymisation and pseudonymisation"
      - "Name one re-identification risk and one good practice to limit it"
  prerequis:
    fr: ["S1.04 : d'où viennent les données"]
    en: ["S1.04: where data come from"]
  hypotheses:
    fr: "Commune de 2 000 habitants et fichier de salariés fictifs ; 365 jours, 2 sexes, 80 années de naissance possibles"
    en: "Town of 2,000 people and staff file are fictional; 365 days, 2 sexes, 80 possible birth years"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

sources:
  - nom:
      fr: "L. Sweeney, Simple Demographics Often Identify People Uniquely, Carnegie Mellon University, 2000"
      en: "L. Sweeney, Simple Demographics Often Identify People Uniquely, Carnegie Mellon University, 2000"
    url: "https://dataprivacylab.org/projects/identifiability/paper1.pdf"
    date_consultation: "2026-11-08"

editions:
  fr:
    titre: "Des données « anonymes » peuvent-elles vous trahir ?"
    legende: |
      Enlever le nom d'un fichier ne suffit pas à le rendre anonyme. Date de naissance, sexe et code postal : croisées, ces trois colonnes rendent la plupart des gens uniques. On voit la différence entre pseudonymiser et anonymiser, on calcule pourquoi chaque colonne ajoutée isole davantage chaque ligne, et on découvre trois bonnes pratiques pour publier des données sans exposer personne. Source : L. Sweeney, Carnegie Mellon University, 2000. Série « Lire un chiffre sans se faire avoir ».
    hashtags: [statistiques, vieprivee, donnees]
    scenes:
      - type: accroche
        texte: "Sans nom, sans adresse… et pourtant *reconnaissable*"
        voix_off: "Un fichier sans nom et sans adresse. Pourtant, on peut parfois y retrouver une personne précise. Comment ?"
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Pseudonyme ou anonyme ?"
        voix_off: "D'abord, deux mots qu'on confond souvent."
      - type: etapes
        texte: "Deux opérations *différentes*"
        etapes:
          - "*Pseudonymiser* : remplacer le nom par un code"
          - "*Anonymiser* : qu'on ne puisse plus *raisonnablement* retrouver la personne"
        voix_off: "Il y a deux opérations différentes. Pseudonymiser, c'est remplacer le nom par un code : Marie Dupont devient le numéro quatre mille douze, mais le reste de la ligne ne change pas. Anonymiser, c'est transformer les données de façon qu'on ne puisse plus raisonnablement retrouver la personne, même en les croisant avec d'autres informations disponibles."
      - type: texte
        texte: "Enlever le nom *ne suffit pas*"
        voix_off: "Enlever le nom ne suffit donc pas. Tout dépend de ce qui reste dans les autres colonnes."
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Croiser les colonnes"
        voix_off: "Faisons le calcul dans une commune fictive de deux mille habitants."
      - type: formule
        texte: "Jour de naissance *et* sexe"
        formule:
          - '365\times 2=730\ \mathrm{combinaisons}'
          - '2\,000\div 730\approx 2{,}7'
        voix_off: "Prenons le jour de naissance et le sexe. Trois cent soixante-cinq jours, fois deux : sept cent trente combinaisons possibles. Pour deux mille habitants, cela fait environ deux virgule sept personnes par combinaison, en moyenne. Moins de trois personnes par case en moyenne : certaines cases risquent de ne contenir qu'une ou deux personnes."
        verifier:
          - {expression: "365 * 2", attendu: 730, libelle: "Combinaisons jour × sexe"}
          - {expression: "2000 / 730", attendu: 2.7, libelle: "Habitants par combinaison"}
      - type: formule
        texte: "Ajoutons *l'année* de naissance"
        formule:
          - '365\times 2\times 80=58\,400'
        voix_off: "Ajoutons l'année de naissance, avec quatre-vingts années possibles. On passe à cinquante-huit mille quatre cents combinaisons, pour seulement deux mille habitants. Avec autant de combinaisons pour si peu d'habitants, beaucoup de personnes peuvent se retrouver dans une case très peu peuplée, souvent seules : elles deviennent identifiables."
        verifier:
          - {expression: "365 * 2 * 80", attendu: 58400, libelle: "Combinaisons date complète × sexe"}
      - type: chiffre
        valeur: 87
        suffixe: {fr: " %", en: "%"}
        texte: "des Américains probablement uniques avec *code postal*, *sexe* et *date de naissance* (estimation de 2000)"
        note: "L. Sweeney, 2000, d'après le recensement américain de 1990 : 216 millions de personnes sur 248 millions."
        voix_off: "Ce n'est pas qu'une hypothèse. En deux mille, la chercheuse Latanya Sweeney a estimé, à partir du recensement américain de mille neuf cent quatre-vingt-dix, que quatre-vingt-sept pour cent des habitants des États-Unis étaient probablement uniques avec seulement trois informations : leur code postal, leur sexe et leur date de naissance."
        verifier:
          - {expression: "216 / 248 * 100", attendu: 87, libelle: "216 millions sur 248 millions, en %"}
      - type: texte
        texte: "Plus on croise de colonnes, plus chaque ligne devient *unique*"
        voix_off: "Retenez le mécanisme : plus on croise de colonnes, plus chaque ligne devient unique. Et une ligne unique, il suffit d'un voisin, d'un article ou d'un réseau social pour la relier à un nom."
      # ---------------------------------------------------------------- 3
      - type: titre
        numero: 3
        texte: "Protéger sans tout cacher"
        voix_off: "Comment publier des données utiles sans exposer personne ?"
      - type: etapes
        texte: "Trois bonnes pratiques"
        etapes:
          - "*Agréger* : publier des totaux, pas des lignes"
          - "*Généraliser* : l'année plutôt que la date"
          - "*Masquer* les cases avec trop peu de personnes"
        voix_off: "Trois bonnes pratiques. Agréger : publier des totaux par groupe, plutôt que les lignes individuelles. Généraliser : donner l'année plutôt que la date exacte, le département plutôt que la commune. Masquer les cases qui contiennent trop peu de personnes, parce qu'une case de une personne, c'est une personne."
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "Fichier « anonyme » de *500* salariés : *mois* de naissance, *sexe*, *service* (10 services). Risqué ?"
        pause: 8
        voix_off: "À vous. Un fichier dit anonyme décrit cinq cents salariés, avec leur mois de naissance, leur sexe et leur service, parmi dix services. Combien de combinaisons possibles ? Le fichier est-il sans risque ?"
      - type: correction
        etapes:
          - "12 mois × 2 sexes × 10 services = 240 combinaisons"
          - "500 ÷ 240 ≈ 2,1 personnes par case en moyenne"
        reponse: "Risque : certaines cases très peu peuplées"
        voix_off: "Voici le calcul. Douze mois, fois deux sexes, fois dix services : deux cent quarante combinaisons. Cinq cents divisé par deux cent quarante, environ deux virgule une personnes par case, en moyenne. C'est un signal de risque : certaines combinaisons peuvent ne concerner qu'une ou deux personnes, faciles à reconnaître pour un collègue."
        verifier:
          - {expression: "12 * 2 * 10", attendu: 240, libelle: "Combinaisons mois × sexe × service"}
          - {expression: "500 / 240", attendu: 2.1, libelle: "Salariés par combinaison"}
      - type: animation
        texte: "*240 cases*, *500 salariés* répartis au hasard"
        animation:
          modele: grille
          n: 240
          personnes: 500
          colonnes: 20
          graine: 3
        etapes:
          - "12 mois × 2 sexes × 10 services"
          - "Chaque salarié tombe dans une case"
          - "*61 cases* à une seule personne, *27* vides"
        note: "Simulation : 500 salariés répartis au hasard, uniformément, dans les 240 cases."
        voix_off: "Pour le voir, simulons la répartition. Voici les deux cent quarante combinaisons : douze mois, fois deux sexes, fois dix services. On place les cinq cents salariés au hasard, chacun dans sa case. Résultat : soixante et une cases ne contiennent qu'une seule personne, et vingt-sept sont vides."
        verifier:
          - {expression: "12 * 2 * 10", attendu: 240, libelle: "Cases de la grille"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "Pseudonymiser *n'est pas* anonymiser"
          - "Chaque colonne croisée *isole* davantage"
          - "Agréger, généraliser, *masquer les petits effectifs*"
        voix_off: "À retenir. Pseudonymiser n'est pas anonymiser. Chaque colonne que l'on croise isole un peu plus chaque personne. Et pour protéger, on agrège, on généralise, et on masque les petits effectifs."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "Can “anonymous” data give you away?"
    legende: |
      Removing the name from a file isn't enough to make it anonymous. Date of birth, sex and postcode: combined, these three columns make most people unique. We see the difference between pseudonymising and anonymising, work out why every extra column isolates each row a bit more, and learn three good practices for publishing data without exposing anyone. Source: L. Sweeney, Carnegie Mellon University, 2000. Series "Reading numbers without being fooled".
    hashtags: [statistics, privacy, data]
    scenes:
      - type: accroche
        texte: "No name, no address… and yet *recognisable*"
        voix_off: "A file with no names and no addresses. And yet, you can sometimes find a specific person in it. How?"
      - type: titre
        numero: 1
        texte: "Pseudonymous or anonymous?"
        voix_off: "First, two words that people often mix up."
      - type: etapes
        texte: "Two *different* operations"
        etapes:
          - "*Pseudonymise*: replace the name with a code"
          - "*Anonymise*: so the person can no longer *reasonably* be found"
        voix_off: "There are two different operations. Pseudonymising means replacing the name with a code: Mary Smith becomes number four thousand and twelve, but the rest of the row stays the same. Anonymising means transforming the data so the person can no longer reasonably be found, even by combining it with other available information."
      - type: texte
        texte: "Removing the name *isn't enough*"
        voix_off: "So removing the name isn't enough. It all depends on what is left in the other columns."
      - type: titre
        numero: 2
        texte: "Combining columns"
        voix_off: "Let's do the maths in a fictional town of two thousand people."
      - type: formule
        texte: "Day of birth *and* sex"
        formule:
          - '365\times 2=730\ \mathrm{combinations}'
          - '2{,}000\div 730\approx 2.7'
        voix_off: "Take the day of birth and sex. Three hundred and sixty-five days, times two: seven hundred and thirty possible combinations. For two thousand residents, that's about two point seven people per combination, on average. Fewer than three people per box on average: some boxes may hold only one or two people."
        verifier:
          - {expression: "365 * 2", attendu: 730, libelle: "Day × sex combinations"}
          - {expression: "2000 / 730", attendu: 2.7, libelle: "Residents per combination"}
      - type: formule
        texte: "Now add the *year* of birth"
        formule:
          - '365\times 2\times 80=58{,}400'
        voix_off: "Now add the year of birth, with eighty possible years. That makes fifty-eight thousand four hundred combinations, for only two thousand residents. With so many combinations for so few residents, many people can end up in a box with very few others, often alone: they become identifiable."
        verifier:
          - {expression: "365 * 2 * 80", attendu: 58400, libelle: "Full date × sex combinations"}
      - type: chiffre
        valeur: 87
        suffixe: {fr: " %", en: "%"}
        texte: "of Americans likely unique with *ZIP code*, *sex* and *date of birth* (2000 estimate)"
        note: "L. Sweeney, 2000, based on the 1990 US census: 216 million people out of 248 million."
        voix_off: "This isn't just a hypothesis. In two thousand, the researcher Latanya Sweeney estimated, from the nineteen ninety US census, that eighty-seven percent of people in the United States were likely unique with just three pieces of information: their ZIP code, their sex and their date of birth."
        verifier:
          - {expression: "216 / 248 * 100", attendu: 87, libelle: "216 million out of 248 million, %"}
      - type: texte
        texte: "The more columns you combine, the more each row becomes *unique*"
        voix_off: "Remember the mechanism: the more columns you combine, the more each row becomes unique. And a unique row only needs a neighbour, an article or a social network to be linked to a name."
      - type: titre
        numero: 3
        texte: "Protecting without hiding everything"
        voix_off: "How can you publish useful data without exposing anyone?"
      - type: etapes
        texte: "Three good practices"
        etapes:
          - "*Aggregate*: publish totals, not rows"
          - "*Generalise*: the year rather than the date"
          - "*Suppress* boxes with too few people"
        voix_off: "Three good practices. Aggregate: publish totals by group, rather than individual rows. Generalise: give the year rather than the exact date, the region rather than the town. Suppress the boxes that contain too few people, because a box of one person is a person."
      - type: exercice
        texte: "An “anonymous” file of *500* staff: birth *month*, *sex*, *department* (10 departments). Risky?"
        pause: 8
        voix_off: "Your turn. A so-called anonymous file describes five hundred employees, with their month of birth, their sex and their department, out of ten departments. How many possible combinations are there? Is the file risk-free?"
      - type: correction
        etapes:
          - "12 months × 2 sexes × 10 departments = 240 combinations"
          - "500 ÷ 240 ≈ 2.1 people per box on average"
        reponse: "Risk: some boxes may hold very few people"
        voix_off: "Here's the calculation. Twelve months, times two sexes, times ten departments: two hundred and forty combinations. Five hundred divided by two hundred and forty, about two point one people per box, on average. That's a warning sign: some combinations may cover only one or two people, easy for a colleague to recognise."
        verifier:
          - {expression: "12 * 2 * 10", attendu: 240, libelle: "Month × sex × department combinations"}
          - {expression: "500 / 240", attendu: 2.1, libelle: "Employees per combination"}
      - type: animation
        texte: "*240 boxes*, *500 staff* placed at random"
        animation:
          modele: grille
          n: 240
          personnes: 500
          colonnes: 20
          graine: 3
        etapes:
          - "12 months × 2 sexes × 10 departments"
          - "Each employee lands in a box"
          - "*61 boxes* with one person, *27* empty"
        note: "Simulation: 500 staff placed at random, uniformly, in the 240 boxes."
        voix_off: "To see it, let's simulate how they spread out. Here are the two hundred and forty combinations: twelve months, times two sexes, times ten departments. We place the five hundred employees at random, each in a box. The result: sixty-one boxes hold just one person, and twenty-seven are empty."
        verifier:
          - {expression: "12 * 2 * 10", attendu: 240, libelle: "Boxes in the grid"}
      - type: etapes
        texte: "Key takeaways"
        etapes:
          - "Pseudonymising *isn't* anonymising"
          - "Each combined column *isolates* more"
          - "Aggregate, generalise, *suppress small counts*"
        voix_off: "Key takeaways. Pseudonymising isn't anonymising. Every column you combine isolates each person a little more. And to protect people, you aggregate, you generalise, and you suppress small counts."
      - type: fin
        texte: "Follow to learn how to read numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
