# Niveau 1, vague 1, lot 4 : S3.08 « Évolutions dans le temps : indices et moyennes mobiles » (EDUCATIONAL, leçon)
# Nombres fictifs : prix du pain et du loyer sur 7 années imaginaires (2000-2006), série saisonnière inventée.
# L'indice base 100 et la moyenne mobile sur 3 points sont calculés explicitement et vérifiés.
# Statut : brouillon. En attente de relecture ChatGPT et de validation JG.
id: 2026-11-n1-s3-08-evolutions-indices-moyennes-mobiles
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S3.08 · Évolutions dans le temps : indices et moyennes mobiles"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Calculer un indice base 100 pour comparer deux séries"
      - "Lisser une série par une moyenne mobile"
      - "Distinguer les fluctuations d'une série de sa tendance"
    en:
      - "Compute a base-100 index to compare two series"
      - "Smooth a series with a moving average"
      - "Tell the short-term fluctuations of a series apart from its trend"
  prerequis:
    fr: ["S1.08 : pourcentages et points", "S2.04 : ce que dit vraiment la moyenne"]
    en: ["S1.08: percentages and points", "S2.04: what the mean really says"]
  hypotheses:
    fr: "Prix du pain et du loyer imaginaires, série mensuelle qui fluctue ; aucune donnée réelle citée. Une seule année ne démontre pas une saisonnalité : le lissage sert ici à faire ressortir la tendance, pas à conclure sur un cycle."
    en: "Fictional bread and rent prices; a monthly series that fluctuates; no real data cited. A single year does not prove seasonality: smoothing here reveals the trend, not a cycle."

validation:
  statut: brouillon

sources: []

editions:
  fr:
    titre: "Indices et moyennes mobiles : lire une évolution"
    legende: |
      Comment comparer l'évolution du pain et du loyer depuis 2000 ? Avec deux séries imaginaires, on découvre l'indice base 100 : on ramène tout le monde au même point de départ pour comparer les trajectoires. Puis, avec une autre série qui fluctue de mois en mois, on lisse par une moyenne mobile pour faire ressortir la tendance. Exercice corrigé à la fin. Données fictives. Série « Lire un chiffre sans se faire avoir ».
    hashtags: [statistiques, indices, moyennemobile]
    scenes:
      - type: accroche
        texte: "Depuis 2000, le *pain* ou le *loyer* ont-ils plus augmenté ?"
        voix_off: "Imaginons deux prix qu'on suit depuis l'an 2000 : le pain et le loyer. Comment savoir lequel des deux a le plus augmenté ?"
      - type: titre
        numero: 1
        texte: "Deux séries aux niveaux très différents"
        voix_off: "Le problème, c'est que les deux séries ne vivent pas dans le même monde."
      - type: etapes
        texte: "Pain et loyer, *7 années imaginaires*"
        etapes:
          - "2000 · 2,50 · 500"
          - "2001 · 2,60 · 560"
          - "2002 · 2,80 · 620"
          - "2003 · 3,00 · 680"
          - "2004 · 3,20 · 730"
          - "2005 · 3,30 · 800"
          - "2006 · 3,50 · 850"
        voix_off: "Sept années, un prix du pain qui monte de deux euros cinquante à trois euros cinquante, et un loyer qui passe de cinq cents à huit cent cinquante euros. Mais mettre ces deux colonnes sur le même graphique, c'est impossible : les ordres de grandeur sont trop différents."
      - type: titre
        numero: 2
        texte: "L'indice base 100 : repartir du même point"
        voix_off: "L'astuce, c'est de ramener les deux séries au même point de départ."
      - type: formule
        texte: "*indice = valeur / valeur de base × 100*"
        formule: "indice_t = (valeur_t / valeur_base) × 100"
        voix_off: "L'indice à l'instant t, c'est la valeur à l'instant t divisée par la valeur de base, multipliée par cent. On choisit une année de référence — ici 2000 — et on lui donne la valeur cent."
      - type: etapes
        texte: "Les mêmes séries, *en base 100*"
        etapes:
          - "2000 · 100 · 100"
          - "2001 · 104 · 112"
          - "2002 · 112 · 124"
          - "2003 · 120 · 136"
          - "2004 · 128 · 146"
          - "2005 · 132 · 160"
          - "2006 · 140 · 170"
        voix_off: "Et voilà. En 2000, les deux séries valent cent. En 2006, le pain est à cent quarante — plus quarante pour cent — et le loyer à cent soixante-dix — plus soixante-dix pour cent. Le loyer a nettement plus augmenté, dans notre exemple imaginaire."
        verifier:
          - {expression: "round(3.50 / 2.50 * 100, 1)", attendu: 140.0, libelle: "Indice du pain en 2006"}
          - {expression: "round(850 / 500 * 100, 1)", attendu: 170.0, libelle: "Indice du loyer en 2006"}
      - type: titre
        numero: 3
        texte: "Une série qui fait des vagues"
        voix_off: "Maintenant, changeons d'exemple."
      - type: courbe
        texte: "Nombre de pains vendus par mois, *une boulangerie imaginaire*"
        courbe:
          style: barres
          points: [[1, 10], [2, 12], [3, 11], [4, 14], [5, 16], [6, 15], [7, 18], [8, 20], [9, 19]]
          x_min: 0
          x_max: 10
          y_min: 0
          y_max: 25
          axe_x: "Mois"
          axe_y: "Pains vendus (centaines)"
        note: "Boulangerie imaginaire : chiffres inventés."
        voix_off: "Neuf mois de ventes d'une boulangerie imaginaire. La série monte globalement, mais fluctue d'un mois à l'autre. Avec neuf mois seulement, on ne peut pas conclure à une saisonnalité : il faudrait plusieurs années pour voir si ce motif se répète. En revanche, on peut faire ressortir la tendance en lissant les fluctuations."
      - type: titre
        numero: 4
        texte: "La moyenne mobile : lisser la série"
        voix_off: "La moyenne mobile remplace chaque mois par la moyenne de ses voisins."
      - type: etapes
        texte: "Moyenne mobile *sur 3 points*"
        etapes:
          - "Prendre *trois valeurs* consécutives"
          - "En faire *la moyenne*"
          - "Placer cette moyenne *au centre* des trois"
          - "Décaler d'un pas, et recommencer"
        voix_off: "On prend trois valeurs consécutives, on en fait la moyenne, et on place cette moyenne au centre. Puis on décale d'un pas, et on recommence. Pour nos neuf mois, on obtient sept valeurs lissées."
      - type: etapes
        texte: "Série brute et *moyenne mobile sur 3 mois*"
        etapes:
          - "1 · 10 · —"
          - "2 · 12 · 11,00"
          - "3 · 11 · 12,33"
          - "4 · 14 · 13,67"
          - "5 · 16 · 15,00"
          - "6 · 15 · 16,33"
          - "7 · 18 · 17,67"
          - "8 · 20 · 19,00"
          - "9 · 19 · —"
        voix_off: "Les premiers et derniers mois n'ont pas de moyenne : il faut des voisins. Pour le reste, la série lissée monte régulièrement : de onze à dix-neuf. Les fluctuations mensuelles sont atténuées, la tendance ressort."
        verifier:
          - {expression: "round((10 + 12 + 11) / 3, 2)", attendu: 11.0, libelle: "MM3 au mois 2"}
          - {expression: "round((14 + 16 + 15) / 3, 2)", attendu: 15.0, libelle: "MM3 au mois 5"}
          - {expression: "round((18 + 20 + 19) / 3, 2)", attendu: 19.0, libelle: "MM3 au mois 8"}
      - type: titre
        numero: 5
        texte: "Deux erreurs classiques"
        voix_off: "Deux pièges à éviter."
      - type: etapes
        texte: "Les deux pièges"
        etapes:
          - "Comparer des *niveaux* au lieu d'évolutions"
          - "Prendre une *fluctuation* pour une tendance (et vice-versa)"
        voix_off: "Un, comparer un prix en euros à un autre prix en euros : ça ne dit rien si les niveaux sont très différents. Il faut passer par un indice base cent, qui ramène tout à la même échelle. Deux, prendre une fluctuation ponctuelle pour une tendance, ou inversement : la moyenne mobile sert précisément à distinguer les deux, à condition d'avoir assez de données. Une saisonnalité ne s'affirme qu'après plusieurs cycles complets."
      - type: titre
        numero: 6
        texte: "À vous"
        voix_off: "À vous."
      - type: exercice
        texte: "Série *50, 55, 60*. Convertissez en indice base 100 sur la première valeur."
        pause: 10
        voix_off: "Cinquante, cinquante-cinq, soixante. Ramenez cette série à un indice base cent, en prenant la première valeur comme base. Pause."
      - type: correction
        etapes:
          - "Base : *50 → 100*"
          - "*55 / 50 × 100 = 110*"
          - "*60 / 50 × 100 = 120*"
        reponse: "Indices : 100, 110, 120"
        voix_off: "La base, cinquante, prend la valeur cent. Cinquante-cinq divisé par cinquante fois cent : cent dix. Soixante divisé par cinquante fois cent : cent vingt. La série indicée est donc cent, cent dix, cent vingt."
        verifier:
          - {expression: "round(50 / 50 * 100, 1)", attendu: 100.0, libelle: "Indice de la valeur 50"}
          - {expression: "round(55 / 50 * 100, 1)", attendu: 110.0, libelle: "Indice de la valeur 55"}
          - {expression: "round(60 / 50 * 100, 1)", attendu: 120.0, libelle: "Indice de la valeur 60"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "*Indice base 100* : ramener tout le monde au même point de départ"
          - "*Moyenne mobile* : lisser pour voir la tendance"
          - "*Comparer des évolutions*, pas des niveaux"
        voix_off: "À retenir. L'indice base cent ramène toutes les séries au même point de départ, et permet de comparer leurs évolutions. La moyenne mobile remplace chaque valeur par la moyenne de ses voisins, et fait ressortir la tendance en atténuant les fluctuations. Et on compare toujours des évolutions, pas des niveaux."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "Indices and moving averages: reading change over time"
    legende: |
      How can we compare the change in bread prices and rent since 2000? With two imaginary series, we meet the base-100 index: bring everyone back to the same starting point, then compare paths. Then, with another series that fluctuates from month to month, we smooth with a moving average to reveal the trend. Worked exercise at the end. Fictional data. Series "Reading numbers without being fooled".
    hashtags: [statistics, indices, movingaverage]
    scenes:
      - type: accroche
        texte: "Since 2000, has *bread* or *rent* gone up more?"
        voix_off: "Imagine two prices tracked since the year 2000: bread and rent. How do we tell which one has gone up more?"
      - type: titre
        numero: 1
        texte: "Two series at very different levels"
        voix_off: "The problem is that the two series do not live in the same world."
      - type: etapes
        texte: "Bread and rent, *7 imaginary years*"
        etapes:
          - "2000 · 2.50 · 500"
          - "2001 · 2.60 · 560"
          - "2002 · 2.80 · 620"
          - "2003 · 3.00 · 680"
          - "2004 · 3.20 · 730"
          - "2005 · 3.30 · 800"
          - "2006 · 3.50 · 850"
        voix_off: "Seven years. Bread goes from two dollars fifty to three dollars fifty; rent, from five hundred to eight hundred and fifty dollars. Putting both columns on the same chart is impossible: the orders of magnitude are too different."
      - type: titre
        numero: 2
        texte: "The base-100 index: back to the same start"
        voix_off: "The trick is to bring both series back to the same starting point."
      - type: formule
        texte: "*index = value / base value × 100*"
        formule: "index_t = (value_t / value_base) × 100"
        voix_off: "The index at time t is the value at time t divided by the base value, times one hundred. We pick a reference year — here 2000 — and give it the value one hundred."
      - type: etapes
        texte: "The same series, *in base 100*"
        etapes:
          - "2000 · 100 · 100"
          - "2001 · 104 · 112"
          - "2002 · 112 · 124"
          - "2003 · 120 · 136"
          - "2004 · 128 · 146"
          - "2005 · 132 · 160"
          - "2006 · 140 · 170"
        voix_off: "There we are. In 2000, both series are at one hundred. In 2006, bread is at one hundred and forty — up forty percent — and rent at one hundred and seventy — up seventy percent. Rent has clearly gone up more, in our imaginary example."
        verifier:
          - {expression: "round(3.50 / 2.50 * 100, 1)", attendu: 140.0, libelle: "Bread index in 2006"}
          - {expression: "round(850 / 500 * 100, 1)", attendu: 170.0, libelle: "Rent index in 2006"}
      - type: titre
        numero: 3
        texte: "A wavy series"
        voix_off: "Now, a new example."
      - type: courbe
        texte: "Loaves sold per month, *one imaginary bakery*"
        courbe:
          style: barres
          points: [[1, 10], [2, 12], [3, 11], [4, 14], [5, 16], [6, 15], [7, 18], [8, 20], [9, 19]]
          x_min: 0
          x_max: 10
          y_min: 0
          y_max: 25
          axe_x: "Month"
          axe_y: "Loaves sold (hundreds)"
        note: "Imaginary bakery: numbers made up."
        voix_off: "Nine months of sales from an imaginary bakery. The series goes up overall, but fluctuates from month to month. Nine months are too few to claim a seasonality: you would need several years to see whether the pattern repeats. What we can do is reveal the trend by smoothing the fluctuations."
      - type: titre
        numero: 4
        texte: "The moving average: smoothing the series"
        voix_off: "A moving average replaces each month with the average of its neighbours."
      - type: etapes
        texte: "Moving average *over 3 points*"
        etapes:
          - "Take *three consecutive values*"
          - "*Average them*"
          - "Place the average *at the centre* of the three"
          - "Move by one step, and repeat"
        voix_off: "Take three consecutive values, average them, and place the average at the centre. Then move by one step, and repeat. For our nine months, we get seven smoothed values."
      - type: etapes
        texte: "Raw series and *3-month moving average*"
        etapes:
          - "1 · 10 · —"
          - "2 · 12 · 11.00"
          - "3 · 11 · 12.33"
          - "4 · 14 · 13.67"
          - "5 · 16 · 15.00"
          - "6 · 15 · 16.33"
          - "7 · 18 · 17.67"
          - "8 · 20 · 19.00"
          - "9 · 19 · —"
        voix_off: "The first and last months have no average: you need neighbours. For the rest, the smoothed series climbs steadily: from eleven to nineteen. The monthly fluctuations are dampened, the trend comes through."
        verifier:
          - {expression: "round((10 + 12 + 11) / 3, 2)", attendu: 11.0, libelle: "MA3 at month 2"}
          - {expression: "round((14 + 16 + 15) / 3, 2)", attendu: 15.0, libelle: "MA3 at month 5"}
          - {expression: "round((18 + 20 + 19) / 3, 2)", attendu: 19.0, libelle: "MA3 at month 8"}
      - type: titre
        numero: 5
        texte: "Two classic mistakes"
        voix_off: "Two traps to avoid."
      - type: etapes
        texte: "The two traps"
        etapes:
          - "Comparing *levels* instead of changes"
          - "Mistaking a *fluctuation* for a trend (and vice-versa)"
        voix_off: "One: comparing a price in dollars to another price in dollars tells you nothing if the levels are very different. Use a base-100 index, which brings everything to the same scale. Two: mistaking a short-term fluctuation for a trend, or vice versa. The moving average separates the two — provided you have enough data. Seasonality is only confirmed after several complete cycles."
      - type: titre
        numero: 6
        texte: "Your turn"
        voix_off: "Your turn."
      - type: exercice
        texte: "Series *50, 55, 60*. Convert to a base-100 index on the first value."
        pause: 10
        voix_off: "Fifty, fifty-five, sixty. Convert this series to a base-100 index, using the first value as the base. Pause."
      - type: correction
        etapes:
          - "Base: *50 → 100*"
          - "*55 / 50 × 100 = 110*"
          - "*60 / 50 × 100 = 120*"
        reponse: "Indices: 100, 110, 120"
        voix_off: "The base, fifty, takes the value one hundred. Fifty-five divided by fifty times one hundred: one hundred and ten. Sixty divided by fifty times one hundred: one hundred and twenty. The indexed series is therefore one hundred, one hundred and ten, one hundred and twenty."
        verifier:
          - {expression: "round(50 / 50 * 100, 1)", attendu: 100.0, libelle: "Index of value 50"}
          - {expression: "round(55 / 50 * 100, 1)", attendu: 110.0, libelle: "Index of value 55"}
          - {expression: "round(60 / 50 * 100, 1)", attendu: 120.0, libelle: "Index of value 60"}
      - type: etapes
        texte: "Key points"
        etapes:
          - "*Base-100 index*: bring everyone to the same starting point"
          - "*Moving average*: smooth to see the trend"
          - "*Compare changes*, not levels"
        voix_off: "Key points. The base-100 index brings all series to the same starting point and lets you compare their paths. A moving average replaces each value with the average of its neighbours, and lets the trend show by dampening the fluctuations. And always compare changes, not levels."
      - type: fin
        texte: "Follow to learn how to read numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
