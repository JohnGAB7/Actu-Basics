pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Reproduire un paradoxe de Simpson à partir d'un tableau"
      - "Expliquer le rôle d'une variable de confusion quand on additionne des groupes"
      - "Savoir que ni le total ni le détail ne suffisent sans comprendre comment les groupes ont été constitués"
    en:
      - "Reproduce a Simpson's paradox from a table"
      - "Explain the role of a confounding variable when groups are pooled"
      - "Know that neither the total nor the detail is enough without understanding how the groups were formed"
