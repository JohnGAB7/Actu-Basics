# Niveau 1, vague 1, lot 3 : S3.03 « Le paradoxe de Simpson » (EDUCATIONAL, paradoxe)
# Fiche de conception : contenus/conception/S3.03.yaml
# Source : C. R. Charig, D. R. Webb, S. R. Payne et J. E. A. Wickham, « Comparison of treatment of renal
# calculi by open surgery, percutaneous nephrolithotomy, and extracorporeal shockwave lithotripsy »,
# British Medical Journal 292 (6524), 29 mars 1986, p. 879-882, doi:10.1136/bmj.292.6524.879 ; notice PubMed
# 3083922. Chiffres repris du catalogue du programme (vérifiés sur Crossref lors de la version 1.8 du
# programme) : A = chirurgie ouverte, B = néphrolithotomie percutanée ; petits calculs < 2 cm. Le texte
# complet n'a pas été relu par Claude ; relecture ChatGPT du 2026-11-09 : sous-groupes et totaux conformes à
# l'article. Étude d'observation (patients traités successivement, sans tirage au sort), présentée comme telle.
# « Succès » au sens de l'article.
# Exercice : deux hôpitaux fictifs.
# Statut : validé par JG le 2026-11-09 (carte de décision), après la relecture ChatGPT du 2026-11-09.
