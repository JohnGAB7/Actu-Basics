# Niveau 1, vague 1, lot 4 : S4.05 « Événements : complément, union, intersection » (EDUCATIONAL, leçon)
# Repère historique : la correspondance Pascal-Fermat (1654) sur le problème du chevalier de Méré.
# Exemples fictifs (dé supposé équilibré, cartes supposées équiprobables).
# Statut : brouillon. En attente de relecture ChatGPT et de validation JG.
id: 2026-11-n1-s4-05-evenements-union-intersection
