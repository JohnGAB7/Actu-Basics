# Parcours Actuariat (pilier A), pilote : A2.01 « Pooling and the pure premium » (YOUTUBE_LESSON, FR et EN)
# Plan validé par JG le 2026-11-11 : docs/actuariat/PARCOURS-ACTUARIAT.md (v2, relecture ChatGPT intégrée).
# Point bloquant de la relecture : la mutualisation rend les pertes plus PRÉVISIBLES sous hypothèses
# (indépendance, risques semblables, nombre suffisant) ; elle ne garantit pas un bénéfice.
# Modèle : vols indépendants, probabilité 2 % par téléphone et par an, coût fixe 500 $ (au plus un vol).
# Le nombre de vols suit alors une loi binomiale ; les probabilités de perte sont calculées exactement.
# Statut : validé par JG le 2026-11-11 (carte de décision), après la relecture ChatGPT du 2026-11-11. Claude structure, ChatGPT relit, JG valide.
id: 2026-11-act-a2-01-pooling-and-the-pure-premium
