# Niveau 1, vague 1, lot 1 : S1.06 « Observer ou expérimenter » (EDUCATIONAL)
# Fiche de conception : contenus/conception/S1.06.yaml
# Étude sur le café présentée comme hypothétique (« supposons ») : aucune étude réelle citée tant
# qu'elle n'a pas été lue. Tirage au sort simulé : probabilités hypergéométriques recalculées
# (20 personnes dont 7 fumeurs, deux groupes de 10).
# Statut : brouillon, script à valider avant tout rendu (décision de JG, 2026-11-07).
# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s1-06-observer-ou-experimenter
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S1.06 · Observer ou expérimenter"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Distinguer une étude observationnelle d'une expérience"
      - "Expliquer le rôle du tirage au sort et du groupe témoin"
      - "Expliquer pourquoi un déséquilibre fortuit reste possible dans un essai donné, et pourquoi on compare quand même les groupes au départ"
    en:
      - "Tell an observational study from an experiment"
      - "Explain the role of random assignment and of the control group"
      - "Explain why a chance imbalance is still possible in any given trial, and why the groups are still compared at the start"
  prerequis:
