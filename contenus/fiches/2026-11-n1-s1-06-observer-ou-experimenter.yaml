    fr: "Étude sur le café hypothétique ; tirage au sort de 20 personnes simulé, dont 7 fumeurs, en deux groupes de 10"
    en: "Coffee study hypothetical; simulated random assignment of 20 people, 7 of them smokers, into two groups of 10"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

