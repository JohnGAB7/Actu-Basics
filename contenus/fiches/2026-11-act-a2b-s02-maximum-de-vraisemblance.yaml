# Faits réels : Fisher (1922) via D. J. Hand (2015), expérience de Kerrich (UiO). Échantillons : fictifs.
id: 2026-11-act-a2b-s02-maximum-de-vraisemblance
type_fiche: pedagogique
famille: statistiques_en_pratique
format: youtube_lesson
habillage_sonore: true
theme: "A2b · Le maximum de vraisemblance"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Écrire la vraisemblance et la log-vraisemblance d'un échantillon"
      - "Trouver l'estimateur du maximum de vraisemblance en annulant le score"
      - "Estimer une Poisson, une exponentielle et une Pareto à seuil connu"
      - "Calculer une erreur type par l'information de Fisher"
      - "Utiliser l'invariance pour estimer une probabilité de dépassement"
    en:
      - "Write the likelihood and the log-likelihood of a sample"
      - "Find the maximum likelihood estimator by setting the score to zero"
      - "Estimate a Poisson, an exponential and a Pareto with a known scale"
      - "Compute a standard error from the Fisher information"
      - "Use invariance to estimate an exceedance probability"
  prerequis:
    fr: ["Séance A2b.01 : estimateurs, méthode des moments", "Logarithme et dérivée"]
    en: ["Session A2b.01: estimators, method of moments", "Logarithm and derivative"]
  hypotheses:
    fr: "Observations indépendantes et de même loi ; échantillons et décès observés fictifs ; faits historiques tels que publiés"
    en: "Independent, identically distributed observations; made-up samples and observed deaths; historical facts as published"

validation:
  statut: brouillon

sources:
  - nom: {fr: "D. J. Hand, « From evidence to understanding: a commentary on Fisher (1922) », Philosophical Transactions of the Royal Society A (2015)", en: "D. J. Hand, “From evidence to understanding: a commentary on Fisher (1922)”, Philosophical Transactions of the Royal Society A (2015)"}
