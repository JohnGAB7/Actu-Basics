# Niveau 1, vague 1, lot 4 : S4.07 « La probabilité conditionnelle » (EDUCATIONAL, leçon)
# Tableau croisé fictif : 100 jours imaginaires, 4 cases (pluie × bouchon). Statut : brouillon.
id: 2026-11-n1-s4-07-probabilite-conditionnelle
