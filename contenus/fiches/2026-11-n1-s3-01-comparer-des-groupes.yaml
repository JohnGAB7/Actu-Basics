# Niveau 1, vague 1, lot 3 : S3.01 « Comparer des groupes » (EDUCATIONAL, démonstration)
# Fiche de conception : contenus/conception/S3.01.yaml
# Calcul pur, nombres fictifs : retards de deux lignes de train sur dix jours (même moyenne, 5 min), puis
# boîtes de quatre jours de la semaine pour l'exercice. Quartiles par la méthode des demi-séries ;
# moustaches jusqu'à la plus grande valeur non atypique (règle des 1,5 × écart interquartile, vue en S2.09).
# Statut : à relire (ChatGPT), puis à valider par JG. Aucun rendu avant validation.
# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s3-01-comparer-des-groupes
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S3.01 · Comparer des groupes"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Comparer des distributions avec des boîtes à moustaches côte à côte"
      - "Décrire une différence à la fois en centre et en dispersion"
      - "Ne pas conclure sur deux moyennes seules"
    en:
      - "Compare distributions with side-by-side box plots"
      - "Describe a difference in both centre and spread"
      - "Avoid drawing conclusions from two means alone"
  prerequis:
    fr: ["S2.06 : quartiles et boîte à moustaches"]
    en: ["S2.06: quartiles and box plots"]
  hypotheses:
    fr: "Retards fictifs ; quartiles par la méthode des demi-séries"
    en: "Made-up delays; quartiles by the half-series method"

validation:
  statut: brouillon

sources: []

editions:
  fr:
    titre: "Même retard moyen, trajets opposés : comparer des groupes"
    legende: |
      Deux lignes de train ont le même retard moyen : 5 minutes. Pourtant, sur l'une, on arrive presque toujours avec 4 à 6 minutes de retard ; sur l'autre, souvent à l'heure, et parfois avec 25 minutes de retard. On apprend à comparer des groupes entiers avec des boîtes à moustaches côte à côte, en regardant le centre et la dispersion. Exercice corrigé à la fin. Exemples fictifs, calculs vérifiés. Série « Lire un chiffre sans se faire avoir ».
    hashtags: [statistiques, boiteamoustaches, comparaison]
    scenes:
      - type: accroche
        texte: "Même retard moyen : *même ligne* ?"
        voix_off: "Deux lignes de train ont exactement le même retard moyen : cinq minutes. Peut-on dire qu'elles se valent ?"
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Deux moyennes ne suffisent pas"
        voix_off: "Regardons les dix derniers jours de chaque ligne."
      - type: etapes
        texte: "Retards sur dix jours (en minutes)"
        etapes:
          - "Ligne A : 3, 4, 4, 5, 5, 5, 6, 6, 6, 6"
          - "Ligne B : 0, 0, 1, 1, 2, 2, 3, 5, 11, 25"
          - "Moyenne : *5 min* pour les deux"
        voix_off: "Voici les retards, jour après jour. Sur la ligne A, ils vont de trois à six minutes. Sur la ligne B, on part souvent presque à l'heure, mais un jour on attend onze minutes, et un autre vingt-cinq. Sur dix jours, les deux lignes ont le même retard moyen : cinq minutes."
        verifier:
          - {expression: "(3 + 4 + 4 + 5 + 5 + 5 + 6 + 6 + 6 + 6) / 10", attendu: 5, libelle: "Retard moyen, ligne A"}
          - {expression: "(0 + 0 + 1 + 1 + 2 + 2 + 3 + 5 + 11 + 25) / 10", attendu: 5, libelle: "Retard moyen, ligne B"}
      - type: courbe
        texte: "Côte à côte, *la différence saute aux yeux*"
        courbe:
          style: boites
          boites:
            - {etiquette: "Ligne A", valeurs: [3, 4, 5, 6, 6]}
            - {etiquette: "Ligne B", valeurs: [0, 1, 2, 5, 11], atypiques: [25]}
          y_min: 0
          y_max: 28
          axe_y: "Retard (min)"
        note: "Ligne B : Q3 + 1,5 × écart interquartile = 5 + 1,5 × 4 = 11. Le retard de 25 min est atypique."
        voix_off: "Dessinons les deux boîtes côte à côte, avec la même échelle. La boîte de la ligne A est petite et ramassée autour de cinq minutes. Celle de la ligne B est plus basse et plus étirée : la médiane n'est que de deux minutes, et un retard de vingt-cinq minutes ressort comme une valeur atypique. La moyenne est la même, l'expérience des voyageurs ne l'est pas du tout."
        verifier:
          - {expression: "5 + 1.5 * (5 - 1)", attendu: 11, libelle: "Frontière haute, ligne B"}
          - {expression: "(2 + 2) / 2", attendu: 2, libelle: "Médiane, ligne B (5e et 6e valeurs)"}
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Comparer centre et dispersion"
        voix_off: "Pour comparer deux groupes, on se pose toujours deux questions."
      - type: etapes
        texte: "Deux questions *à chaque comparaison*"
        etapes:
          - "Le centre : *les médianes* sont-elles au même niveau ?"
          - "La dispersion : les boîtes ont-elles *la même hauteur* ?"
          - "Les extrêmes : y a-t-il des *valeurs atypiques* ?"
        voix_off: "Voici les points à regarder. D'abord le centre : les médianes sont-elles au même niveau ? Ensuite la dispersion : les boîtes et les moustaches ont-elles la même hauteur ? Enfin les extrêmes : un groupe a-t-il des valeurs atypiques ?"
      - type: texte
        texte: "Deux moyennes proches *ne prouvent pas* que deux groupes se ressemblent"
        voix_off: "Retenez le piège : deux moyennes très proches ne prouvent pas que deux groupes se ressemblent. Et une petite différence de moyennes, sur peu de jours, peut n'être qu'un hasard."
      # ---------------------------------------------------------------- exercice
      - type: courbe
        texte: "Retards selon *le jour de la semaine*"
        courbe:
          style: boites
          boites:
            - {etiquette: "Lundi", valeurs: [0, 3, 6, 10, 16]}
            - {etiquette: "Mardi", valeurs: [0, 2, 4, 6, 9]}
            - {etiquette: "Mercredi", valeurs: [0, 1, 3, 5, 8]}
            - {etiquette: "Vendredi", valeurs: [1, 4, 7, 12, 20]}
          y_min: 0
          y_max: 20
          axe_y: "Retard (min)"
        note: "Données fictives : retards d'une ligne sur plusieurs mois, regroupés par jour de la semaine."
        voix_off: "Voici maintenant les retards d'une même ligne sur plusieurs mois, regroupés par jour de la semaine. Gardez cette image en tête pour l'exercice."
      - type: exercice
        texte: "Médianes : lundi *6*, mardi *4*, mercredi *3*, vendredi *7*. Quel jour a le retard typique le plus élevé ? Lequel est le plus irrégulier ?"
        pause: 9
        voix_off: "À vous. Les médianes sont de six minutes le lundi, quatre le mardi, trois le mercredi et sept le vendredi. Quel jour a le retard typique le plus élevé ? Et quel jour est le plus irrégulier, d'après la hauteur des boîtes ?"
      - type: correction
        etapes:
          - "Retard typique : *vendredi* (médiane 7), puis lundi"
          - "Écarts interquartiles : lundi 7, mardi 4, mercredi 4, vendredi *8*"
          - "Le plus irrégulier : *vendredi*"
        reponse: "Vendredi, les deux fois"
        voix_off: "Voyons. Le retard typique le plus élevé est celui du vendredi, avec une médiane de sept minutes, juste devant le lundi. Pour l'irrégularité, comparons les écarts interquartiles : sept le lundi, quatre le mardi et le mercredi, huit le vendredi. Le vendredi est donc aussi le jour le plus irrégulier. Réponse : vendredi, les deux fois."
        verifier:
          - {expression: "10 - 3", attendu: 7, libelle: "Écart interquartile, lundi"}
          - {expression: "6 - 2", attendu: 4, libelle: "Écart interquartile, mardi"}
          - {expression: "5 - 1", attendu: 4, libelle: "Écart interquartile, mercredi"}
          - {expression: "12 - 4", attendu: 8, libelle: "Écart interquartile, vendredi"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "Comparer *des distributions*, pas seulement deux moyennes"
          - "Boîtes côte à côte, *même échelle*"
          - "Regarder *le centre, la dispersion et les extrêmes*"
        voix_off: "À retenir. On compare des distributions entières, pas seulement deux moyennes. On place les boîtes côte à côte, sur la même échelle. Et on regarde le centre, la dispersion et les extrêmes."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "Same average delay, opposite journeys: comparing groups"
    legende: |
      Two train lines have the same average delay: 5 minutes. Yet on one, you almost always arrive 4 to 6 minutes late; on the other, you're often on time, and sometimes 25 minutes late. We learn to compare whole groups with side-by-side box plots, looking at both the centre and the spread. Worked exercise at the end. Fictional examples, checked calculations. Series "Reading numbers without being fooled".
    hashtags: [statistics, boxplot, comparison]
    scenes:
      - type: accroche
        texte: "Same average delay: *same line*?"
        voix_off: "Two train lines have exactly the same average delay: five minutes. Can we say they are just as good?"
      - type: titre
        numero: 1
        texte: "Two means aren't enough"
        voix_off: "Let's look at the last ten days on each line."
      - type: etapes
        texte: "Delays over ten days (in minutes)"
        etapes:
          - "Line A: 3, 4, 4, 5, 5, 5, 6, 6, 6, 6"
          - "Line B: 0, 0, 1, 1, 2, 2, 3, 5, 11, 25"
          - "Mean: *5 min* for both"
        voix_off: "Here are the delays, day by day. On line A, they range from three to six minutes. On line B, trains often leave almost on time, but one day you wait eleven minutes, and another day twenty-five. Over ten days, both lines have the same average delay: five minutes."
        verifier:
          - {expression: "(3 + 4 + 4 + 5 + 5 + 5 + 6 + 6 + 6 + 6) / 10", attendu: 5, libelle: "Mean delay, line A"}
          - {expression: "(0 + 0 + 1 + 1 + 2 + 2 + 3 + 5 + 11 + 25) / 10", attendu: 5, libelle: "Mean delay, line B"}
      - type: courbe
        texte: "Side by side, *the difference jumps out*"
        courbe:
          style: boites
          boites:
            - {etiquette: "Line A", valeurs: [3, 4, 5, 6, 6]}
            - {etiquette: "Line B", valeurs: [0, 1, 2, 5, 11], atypiques: [25]}
          y_min: 0
          y_max: 28
          axe_y: "Delay (min)"
        note: "Line B: Q3 + 1.5 × interquartile range = 5 + 1.5 × 4 = 11. The 25-minute delay is an outlier."
        voix_off: "Let's draw the two boxes side by side, on the same scale. Line A's box is small and tight around five minutes. Line B's box sits lower and is more stretched: the median is only two minutes, and a twenty-five-minute delay stands out as an outlier. The mean is the same; what passengers experience is not the same at all."
        verifier:
          - {expression: "5 + 1.5 * (5 - 1)", attendu: 11, libelle: "Upper fence, line B"}
          - {expression: "(2 + 2) / 2", attendu: 2, libelle: "Median, line B (5th and 6th values)"}
      - type: titre
        numero: 2
        texte: "Compare centre and spread"
        voix_off: "To compare two groups, always ask two questions."
      - type: etapes
        texte: "Two questions *for every comparison*"
        etapes:
          - "The centre: are *the medians* at the same level?"
          - "The spread: are the boxes *the same height*?"
          - "The extremes: are there *outliers*?"
        voix_off: "Here is what to look at. First the centre: are the medians at the same level? Then the spread: are the boxes and whiskers the same height? Finally the extremes: does one group have outliers?"
      - type: texte
        texte: "Two close means *don't prove* two groups are alike"
        voix_off: "Remember the trap: two very close means don't prove that two groups are alike. And a small difference in means, over a few days, may be nothing more than chance."
      - type: courbe
        texte: "Delays by *day of the week*"
        courbe:
          style: boites
          boites:
            - {etiquette: "Monday", valeurs: [0, 3, 6, 10, 16]}
            - {etiquette: "Tuesday", valeurs: [0, 2, 4, 6, 9]}
            - {etiquette: "Wednesday", valeurs: [0, 1, 3, 5, 8]}
            - {etiquette: "Friday", valeurs: [1, 4, 7, 12, 20]}
          y_min: 0
          y_max: 20
          axe_y: "Delay (min)"
        note: "Made-up data: one line's delays over several months, grouped by day of the week."
        voix_off: "Now here are the delays on a single line over several months, grouped by day of the week. Keep this picture in mind for the exercise."
      - type: exercice
        texte: "Medians: Monday *6*, Tuesday *4*, Wednesday *3*, Friday *7*. Which day has the highest typical delay? Which is the most irregular?"
        pause: 9
        voix_off: "Your turn. The medians are six minutes on Monday, four on Tuesday, three on Wednesday and seven on Friday. Which day has the highest typical delay? And which day is the most irregular, judging by the height of the boxes?"
      - type: correction
        etapes:
          - "Typical delay: *Friday* (median 7), then Monday"
          - "Interquartile ranges: Monday 7, Tuesday 4, Wednesday 4, Friday *8*"
          - "Most irregular: *Friday*"
        reponse: "Friday, both times"
        voix_off: "Let's see. The highest typical delay is on Friday, with a median of seven minutes, just ahead of Monday. For irregularity, compare the interquartile ranges: seven on Monday, four on Tuesday and Wednesday, eight on Friday. So Friday is also the most irregular day. Answer: Friday, both times."
        verifier:
          - {expression: "10 - 3", attendu: 7, libelle: "Interquartile range, Monday"}
          - {expression: "6 - 2", attendu: 4, libelle: "Interquartile range, Tuesday"}
          - {expression: "5 - 1", attendu: 4, libelle: "Interquartile range, Wednesday"}
          - {expression: "12 - 4", attendu: 8, libelle: "Interquartile range, Friday"}
      - type: etapes
        texte: "Key points"
        etapes:
          - "Compare *distributions*, not just two means"
          - "Boxes side by side, *same scale*"
          - "Look at *the centre, the spread and the extremes*"
        voix_off: "Key points. Compare whole distributions, not just two means. Put the boxes side by side, on the same scale. And look at the centre, the spread and the extremes."
      - type: fin
        texte: "Follow to learn how to read numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
