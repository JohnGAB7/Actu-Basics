      - "Tell a nominal rate i⁽ᵐ⁾ from an annual effective rate i, and convert between them"
      - "Compute the nominal rate of discount d⁽ᵐ⁾ and rank all equivalent rates"
      - "Understand the force of interest δ as a limit, and where the number e comes from"
      - "Value an annuity payable m times a year, immediate and due, and the continuous annuity"
