      - "Calculer le taux d'escompte nominal d⁽ᵐ⁾ et ranger tous les taux équivalents"
      - "Comprendre le taux continu δ comme limite, et l'origine du nombre e"
      - "Calculer une annuité payable m fois par an, immédiate et due, et l'annuité continue"
      - "Évaluer les primes mensuelles d'un contrat d'épargne-pension"
