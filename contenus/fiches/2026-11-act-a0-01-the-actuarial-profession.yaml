editions:
  fr:
    titre: "Actuaire : comment les maths aident à décider face au risque"
    legende: |
      Personne ne sait si votre téléphone sera volé cette année. Pourtant, un assureur doit fixer un prix aujourd'hui. C'est le métier de l'actuaire : mettre des chiffres sur un avenir incertain. Dans ce premier épisode de notre série sur l'actuariat, on voit où travaillent les actuaires, ce que contient un contrat d'assurance, et on calcule ensemble une première prime pure, avec un assureur fictif, JG's Holding. Exercice corrigé à la fin. Chiffres fictifs, calculs vérifiés.
    hashtags: [actuariat, actuaire, assurance, probabilites]
    scenes:
      - type: accroche
        texte: "Les maths peuvent-elles *mettre un prix* sur le risque ?"
        voix_off: "Votre téléphone sera-t-il volé cette année ? Personne ne le sait. Pourtant, un assureur peut vous dire aujourd'hui combien devrait coûter sa protection. Derrière ce chiffre, il y a un actuaire."
      - type: texte
        texte: "Cette série : *l'actuariat de A à Z*"
        voix_off: "Bienvenue dans le premier épisode de notre série sur l'actuariat. Pas à pas, nous allons construire les outils des actuaires, de la valeur de l'argent dans le temps jusqu'à la solvabilité d'un assureur. Dans cet épisode : ce que font les actuaires, ce qu'est un contrat d'assurance, et votre tout premier calcul actuariel."
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Ce que font les actuaires"
        voix_off: "Commençons par le métier lui-même."
      - type: texte
        texte: "Un métier : *mettre des chiffres sur un avenir incertain*"
        voix_off: "Un actuaire utilise les probabilités, les statistiques et la finance pour mesurer des risques encore à venir. Combien d'accidents l'an prochain ? Combien de temps vivra un retraité ? Combien faut-il mettre de côté aujourd'hui pour payer ces coûts futurs ? L'actuaire ne prédit pas l'avenir d'une personne en particulier : il travaille sur des groupes, des moyennes, et l'incertitude qui les entoure."
      - type: etapes
        texte: "Où *travaillent* les actuaires"
        disposition: cartes
        etapes:
          - "Assurance-vie et retraite"
          - "Assurance non-vie : auto, habitation, entreprises"
          - "Assurance santé"
          - "Banques, conseil, gestion des risques"
        voix_off: "Les actuaires travaillent dans plusieurs domaines. En assurance-vie et en retraite, ils s'occupent de la durée de vie, de l'épargne et des pensions. En assurance non-vie, ils tarifent et provisionnent les contrats auto, habitation et entreprises. En assurance santé, ils modélisent les dépenses de soins. Et dans les banques, les cabinets de conseil et les équipes de gestion des risques, ils mesurent et pilotent des risques financiers."
      - type: texte
        texte: "Leurs questions : *quelle probabilité, quel montant, et quand ?*"
        voix_off: "Dans tous ces domaines, les trois mêmes questions reviennent. Quelle est la probabilité de l'événement ? Combien coûtera-t-il s'il se produit ? Et quand faudra-t-il payer ? Toute la série est construite autour de ces trois questions."
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Qu'est-ce qu'un contrat d'assurance ?"
        voix_off: "Avant toute formule, il faut savoir ce que l'on tarife."
      - type: texte
        texte: "Voici *JG's Holding*, notre assureur"
        note: "JG's Holding est un assureur fictif. Tous ses chiffres dans cette série sont inventés."
        voix_off: "Tout au long de cette série, nous suivrons un assureur appelé JG's Holding. C'est une entreprise fictive, et tous ses chiffres sont inventés. Son premier produit est simple : une assurance contre le vol de téléphone."
      - type: etapes
        texte: "Dans un contrat d'assurance *contre le vol d'un téléphone*"
        note: "Exemples tirés de notre contrat fictif. Garanties et exclusions dépendent des conditions de chaque contrat."
        etapes:
          - "Garantie : le vol du téléphone"
          - "Exclusions (exemples) : perte, casse, vol non déclaré"
          - "Prime : ce que paie l'assuré"
          - "Prestation : ce que verse l'assureur après un vol"
          - "Franchise : la part qui reste à l'assuré"
          - "Durée : un an, puis renouvellement"
        voix_off: "Tout contrat d'assurance répond aux mêmes questions. La garantie dit quel événement est couvert : ici, le vol du téléphone. Les exclusions listent ce qui n'est pas couvert : dans notre contrat fictif, par exemple, un téléphone perdu, une casse accidentelle, ou un vol jamais déclaré. Elles dépendent des conditions de chaque contrat. La prime est le montant que paie l'assuré. La prestation est ce que verse l'assureur si l'événement se produit. La franchise est la part de la perte qui reste à la charge de l'assuré. Et la durée est la période couverte : ici, un an, puis le contrat peut être renouvelé."
      - type: texte
        texte: "Le prix est fixé *avant* de connaître le coût"
        voix_off: "Voici ce qui rend l'assurance si particulière. Un boulanger connaît le prix de la farine avant de fixer celui du pain. Un assureur doit fixer son prix en début d'année, avant de savoir combien de téléphones seront volés. C'est exactement pour cela qu'il a besoin d'actuaires : pour estimer un coût encore à venir."
      # ---------------------------------------------------------------- 3
      - type: titre
        numero: 3
        texte: "Votre premier calcul actuariel"
        voix_off: "Mettons un premier chiffre sur ce risque."
      - type: etapes
        texte: "JG's Holding assure *1 000 téléphones* pendant un an"
        etapes:
          - "Probabilité de vol : *2 %* par téléphone et par an"
          - "Coût d'un téléphone volé : *500 €*"
          - "Vols attendus : 1 000 × 2 % = *20*"
          - "Coût attendu : 20 × 500 € = *10 000 €*"
          - "Par téléphone : 10 000 € ÷ 1 000 = *10 €*"
        note: "Chiffres fictifs. Modèle simplifié : au plus un vol par téléphone et par an."
        voix_off: "JG's Holding assure mille téléphones pendant un an. Supposons que chaque téléphone ait deux pour cent de chances d'être volé dans l'année. Un téléphone volé coûte cinq cents euros à remplacer. En moyenne, on attend donc mille fois deux pour cent, soit vingt vols. Vingt vols à cinq cents euros chacun, c'est un coût attendu de dix mille euros. Réparti entre les mille téléphones assurés, cela représente dix euros par téléphone."
        verifier:
          - {expression: "1000 * 0.02", attendu: 20, libelle: "Nombre de vols attendu"}
          - {expression: "1000 * 0.02 * 500", attendu: 10000, libelle: "Coût attendu, en euros"}
          - {expression: "1000 * 0.02 * 500 / 1000", attendu: 10, libelle: "Coût attendu par téléphone"}
      - type: formule
        texte: "La *prime pure*"
        note: "Modèle simplifié : au plus un vol par téléphone, coût fixe. En général : le coût attendu des sinistres par contrat."
        formule:
          - '\mathrm{Prime\ pure}=p\times C'
          - '=0{,}02\times 500=10\ \text{€}'
        voix_off: "Ces dix euros s'appellent la prime pure. Dans cet exemple simplifié, c'est la probabilité d'un vol, p, multipliée par ce que verse l'assureur s'il se produit, C : zéro virgule zéro deux fois cinq cents, soit dix euros. En général, la prime pure est le coût attendu des sinistres par contrat, sans rien ajouter."
        verifier:
          - {expression: "0.02 * 500", attendu: 10, libelle: "Prime pure, en euros"}
      - type: etapes
        texte: "Pourquoi le prix est *plus élevé* que 10 €"
        etapes:
          - "Frais : personnel, informatique, gestion des sinistres"
          - "Commissions versées aux vendeurs"
          - "Une marge pour l'incertitude : 20 n'est qu'une moyenne"
          - "Du capital pour survivre à une mauvaise année"
        voix_off: "Mais JG's Holding ne peut pas vendre cette garantie au prix de dix euros. L'assureur doit couvrir ses frais : du personnel, des systèmes informatiques et le coût de gestion de chaque sinistre. Il peut verser des commissions aux boutiques ou aux courtiers qui vendent le contrat. Il lui faut une marge pour l'incertitude, car vingt vols n'est qu'une moyenne : une année il y en aura douze, une autre trente. Il doit aussi détenir suffisamment de capital pour pouvoir absorber une mauvaise année."
      - type: texte
        texte: "Prime pure + chargements = *prime commerciale*"
        voix_off: "Le prix que paie réellement le client s'appelle la prime commerciale. Elle part de la prime pure et peut inclure des chargements pour les frais, les commissions, le risque et le coût du capital. Que l'assureur gagne ou perde de l'argent dépend de toutes ces pièces, pas seulement de la probabilité de vol. Nous y reviendrons en détail dans le module A2."
      # ---------------------------------------------------------------- 4
      - type: titre
        numero: 4
        texte: "Comment devenir actuaire"
        voix_off: "Alors, comment le devient-on ?"
      - type: etapes
        texte: "Les parcours *dépendent du pays*"
        disposition: cartes
        etapes:
          - "États-Unis et Canada : examens de la SOA et de la CAS"
          - "Royaume-Uni et au-delà : examens de l'IFoA"
          - "Certains pays européens : un diplôme accrédité est une des voies"
          - "Partout : maths, statistiques, finance, puis expérience"
        note: "Les exigences évoluent : vérifiez toujours le site officiel de chaque association d'actuaires."
        voix_off: "Le chemin pour devenir actuaire qualifié dépend de l'endroit où vous travaillez. Aux États-Unis et au Canada, la Society of Actuaries et la Casualty Actuarial Society organisent des séries d'examens professionnels. L'Institute and Faculty of Actuaries, basé au Royaume-Uni, organise ses propres examens, passés dans de nombreux pays. Dans certains pays européens, une formation universitaire accréditée est une des voies d'accès au métier. Les exigences varient selon le pays : vérifiez toujours auprès de l'association nationale d'actuaires. Partout, les fondations sont les mêmes : mathématiques, statistiques et finance, puis des années d'expérience pratique."
      - type: etapes
        texte: "Les compétences que vous construirez *dans cette série*"
        etapes:
          - "Probabilités et statistiques"
          - "Mathématiques financières"
          - "Tableur, puis R ou Python"
          - "Expliquer des chiffres à ceux qui décident"
        voix_off: "Voici les compétences que cette série vous aidera à construire. Les probabilités et les statistiques, pour décrire des événements incertains. Les mathématiques financières, pour comparer des sommes payées à des dates différentes. Le tableur d'abord, puis R ou Python, pour faire les calculs à grande échelle. Et une compétence souvent oubliée : expliquer clairement vos chiffres aux personnes qui doivent décider."
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "JG's Holding ajoute une *franchise de 100 €*. Quelle est la nouvelle prime pure par téléphone ?"
        pause: 12
        voix_off: "À vous. JG's Holding ajoute une franchise de cent euros : après un vol, l'assuré paie les cent premiers euros. Mêmes mille téléphones, mêmes deux pour cent de probabilité de vol. Quelle est la nouvelle prime pure par téléphone ?"
      - type: correction
        etapes:
          - "Après un vol, JG's Holding verse 500 € − 100 € = *400 €*"
          - "Vols attendus : toujours *20*"
          - "Coût attendu : 20 × 400 € = *8 000 €*"
        reponse: "Prime pure : 8 000 € ÷ 1 000 = 8 € par téléphone"
        voix_off: "Faisons le calcul. Après un vol, JG's Holding verse désormais cinq cents moins cent, soit quatre cents euros. Le nombre de vols attendu ne change pas : toujours vingt. Le coût attendu devient vingt fois quatre cents, soit huit mille euros. Réparti entre mille téléphones, la prime pure descend à huit euros par téléphone."
        verifier:
          - {expression: "500 - 100", attendu: 400, libelle: "Prestation après franchise"}
          - {expression: "1000 * 0.02 * (500 - 100)", attendu: 8000, libelle: "Coût attendu avec franchise"}
          - {expression: "1000 * 0.02 * (500 - 100) / 1000", attendu: 8, libelle: "Prime pure avec franchise"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "L'actuaire met des chiffres sur des *coûts futurs incertains*"
          - "Un contrat définit garantie, exclusions, prime, prestation, franchise, durée"
          - "Prime pure = *probabilité × coût*"
          - "Le prix payé ajoute des *chargements*"
        voix_off: "À retenir. L'actuaire met des chiffres sur des coûts futurs encore incertains. Un contrat d'assurance définit la garantie, les exclusions, la prime, la prestation, la franchise et la durée. La prime pure est la probabilité de l'événement multipliée par son coût. Et le prix que paie le client ajoute des chargements par-dessus."
      - type: texte
        texte: "La suite : *1 000 € aujourd'hui ou dans 30 ans*"
        voix_off: "Les assureurs paient souvent des années après avoir encaissé. Dans le prochain épisode, nous répondons donc à une question que tout actuaire doit maîtriser : mille euros aujourd'hui valent-ils vraiment la même chose que mille euros dans trente ans ?"
      - type: fin
        texte: "Abonnez-vous pour le prochain épisode."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."
  en:
    titre: "Actuaries: how maths helps make decisions under risk"
    legende: |
      Nobody knows whether your phone will be stolen this year. Yet an insurer has to set a price today. That is the actuary's job: putting numbers on uncertain futures. In this first episode of our actuarial science series, we see where actuaries work, what is inside an insurance contract, and we compute a first pure premium together, with a fictional insurer, JG's Holding. Worked exercise at the end. Fictional figures, checked calculations.
    hashtags: [actuarialscience, actuary, insurance, probability]
    scenes:
      - type: accroche
        texte: "Can maths *put a price* on risk?"
        voix_off: "Will your phone be stolen this year? Nobody knows. Yet an insurer can tell you today what covering it should cost. The person behind that number is an actuary."
      - type: texte
        texte: "This series: *actuarial science from A to Z*"
        voix_off: "Welcome to the first episode of our actuarial science series. Step by step, we will build the tools actuaries use, from the value of money over time to the solvency of an insurer. In this episode: what actuaries do, what an insurance contract is, and your very first actuarial calculation."
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "What actuaries do"
        voix_off: "Let's start with the job itself."
      - type: texte
        texte: "One job: *putting numbers on uncertain futures*"
        voix_off: "An actuary uses probability, statistics and finance to measure risks that lie in the future. How many accidents will happen next year? How long will a pensioner live? How much money must be set aside today to pay those future costs? Actuaries do not predict the future for a single person: they work with groups, with averages and with the uncertainty around them."
      - type: etapes
        texte: "Where actuaries *work*"
        disposition: cartes
        etapes:
          - "Life insurance and pensions"
          - "Non-life insurance: car, home, business"
          - "Health insurance"
          - "Banks, consulting, risk management"
        voix_off: "Actuaries work in several fields. In life insurance and pensions, they deal with how long people live, and with savings and retirement income. In non-life insurance, they price and reserve for cars, homes and businesses. In health insurance, they model medical costs. And in banks, consulting firms and risk teams, they measure and manage financial risks."
      - type: texte
        texte: "Their questions: *how likely, how much, and when?*"
        voix_off: "Across all these fields, the same three questions come back. How likely is the event? How much will it cost if it happens? And when will the money have to be paid? The whole series is built around these three questions."
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "What is an insurance contract?"
        voix_off: "Before any formula, we need to know what is being priced."
      - type: texte
        texte: "Meet *JG's Holding*, our insurer"
        note: "JG's Holding is a fictional insurer. All its figures in this series are made up."
        voix_off: "Throughout this series, we will follow an insurer called JG's Holding. It is a fictional company, and all of its figures are made up. Its first product is simple: insurance against phone theft."
      - type: etapes
        texte: "Inside a *phone theft* contract"
        note: "Examples from our fictional contract. Cover and exclusions depend on each contract's terms."
        etapes:
          - "Cover: theft of the phone"
          - "Exclusions (examples): loss, damage, theft left unreported"
          - "Premium: what the policyholder pays"
          - "Benefit: what the insurer pays after a theft"
          - "Deductible: the part the policyholder keeps"
          - "Term: one year, then renewal"
        voix_off: "Every insurance contract answers the same questions. The cover says which event is insured: here, the theft of the phone. The exclusions list what is not covered: in our fictional contract, for example, a lost phone, accidental damage, or a theft that was never reported. They depend on the terms of each contract. The premium is the amount the policyholder pays. The benefit is what the insurer pays if the event happens. The deductible is the part of the loss the policyholder keeps. And the term is how long the contract lasts: here, one year, then it can be renewed."
      - type: texte
        texte: "The price is set *before* the cost is known"
        voix_off: "Here is what makes insurance unusual. A baker knows the cost of flour before setting the price of bread. An insurer must set its price at the start of the year, before it knows how many phones will be stolen. That is exactly why it needs actuaries: to estimate a cost that is still in the future."
      # ---------------------------------------------------------------- 3
      - type: titre
        numero: 3
        texte: "Your first actuarial calculation"
        voix_off: "Let's put a first number on this risk."
      - type: etapes
        texte: "JG's Holding insures *1,000 phones* for a year"
        etapes:
          - "Probability of theft: *2%* per phone per year"
          - "Cost of a stolen phone: *$500*"
          - "Expected thefts: 1,000 × 2% = *20*"
          - "Expected cost: 20 × $500 = *$10,000*"
          - "Per phone: $10,000 ÷ 1,000 = *$10*"
        note: "Fictional figures. Simplified model: at most one theft per phone per year."
        voix_off: "JG's Holding insures one thousand phones for one year. Suppose each phone has a two percent chance of being stolen during the year. A stolen phone costs five hundred dollars to replace. On average, we then expect one thousand times two percent, that is twenty thefts. Twenty thefts at five hundred dollars each is an expected cost of ten thousand dollars. Shared among one thousand policyholders, that is ten dollars per phone."
        verifier:
          - {expression: "1000 * 0.02", attendu: 20, libelle: "Expected number of thefts"}
          - {expression: "1000 * 0.02 * 500", attendu: 10000, libelle: "Expected cost, in dollars"}
          - {expression: "1000 * 0.02 * 500 / 1000", attendu: 10, libelle: "Expected cost per phone"}
      - type: formule
        texte: "The *pure premium*"
        note: "Simplified model: at most one theft per phone, fixed cost. In general: the expected claim cost per policy."
        formule:
          - '\mathrm{pure\ premium}=p\times C'
          - '=0.02\times 500=10\ \mathrm{dollars}'
        voix_off: "This ten dollars is called the pure premium. In this simplified example, it is the probability of a theft, p, times what the insurer pays if it happens, C: zero point zero two times five hundred, which gives ten dollars. In general, the pure premium is the expected claim cost per policy, with nothing added."
        verifier:
          - {expression: "0.02 * 500", attendu: 10, libelle: "Pure premium, in dollars"}
      - type: etapes
        texte: "Why the price is *higher* than $10"
        etapes:
          - "Expenses: staff, systems, claims handling"
          - "Commissions paid to sellers"
          - "A margin for uncertainty: 20 is only an average"
          - "Capital to survive a bad year"
        voix_off: "But JG's Holding cannot sell this cover for ten dollars. It has expenses: staff, computer systems and the cost of handling each claim. It may pay commissions to the shops or brokers that sell the contract. It needs a margin for uncertainty, because twenty thefts is only an average: one year there may be twelve, another year thirty. And it must hold capital, so that a bad year does not ruin it."
      - type: texte
        texte: "Pure premium + loadings = *commercial premium*"
        voix_off: "The price the customer actually pays is called the commercial premium. It starts from the pure premium and may include loadings for expenses, commissions, risk and the cost of capital. Whether the insurer makes a profit or a loss depends on all of these pieces, not only on the probability of theft. We will come back to this in detail in module A2."
      # ---------------------------------------------------------------- 4
      - type: titre
        numero: 4
        texte: "How to become an actuary"
        voix_off: "So how do you become one?"
      - type: etapes
        texte: "Routes to qualification *depend on the country*"
        disposition: cartes
        etapes:
          - "United States and Canada: SOA and CAS exams"
          - "United Kingdom and beyond: IFoA exams"
          - "Some European countries: an accredited degree is one route"
          - "Everywhere: maths, statistics, finance, then experience"
        note: "Requirements change over time: always check the official website of each actuarial body."
        voix_off: "The route to becoming a qualified actuary depends on where you work. In the United States and Canada, the Society of Actuaries and the Casualty Actuarial Society run series of professional exams. The Institute and Faculty of Actuaries, based in the United Kingdom, runs its own exams, taken in many countries. In some European countries, an accredited university programme is one route into the profession. Requirements vary by country, so always check the relevant national actuarial association. Everywhere, the foundations are the same: mathematics, statistics and finance, followed by years of practical experience."
      - type: etapes
        texte: "The skills you will build *in this series*"
        etapes:
          - "Probability and statistics"
          - "Financial mathematics"
          - "Spreadsheets, then R or Python"
          - "Explaining numbers to people who decide"
        voix_off: "Here are the skills this series will help you build. Probability and statistics, to describe uncertain events. Financial mathematics, to compare money paid at different dates. Spreadsheets first, then R or Python, to do the calculations at scale. And one skill that is often forgotten: explaining your numbers clearly to the people who have to make decisions."
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "JG's Holding adds a *$100 deductible*. What is the new pure premium per phone?"
        pause: 12
        voix_off: "Your turn. JG's Holding adds a one hundred dollar deductible: after a theft, the policyholder pays the first hundred dollars. Same thousand phones, same two percent chance of theft. What is the new pure premium per phone?"
      - type: correction
        etapes:
          - "After a theft, JG's Holding pays $500 − $100 = *$400*"
          - "Expected thefts: still *20*"
          - "Expected cost: 20 × $400 = *$8,000*"
        reponse: "Pure premium: $8,000 ÷ 1,000 = $8 per phone"
        voix_off: "Let's work it out. After a theft, JG's Holding now pays five hundred minus one hundred, that is four hundred dollars. The expected number of thefts does not change: still twenty. The expected cost becomes twenty times four hundred, that is eight thousand dollars. Shared among one thousand phones, the pure premium drops to eight dollars per phone."
        verifier:
          - {expression: "500 - 100", attendu: 400, libelle: "Benefit after the deductible"}
          - {expression: "1000 * 0.02 * (500 - 100)", attendu: 8000, libelle: "Expected cost with the deductible"}
          - {expression: "1000 * 0.02 * (500 - 100) / 1000", attendu: 8, libelle: "Pure premium with the deductible"}
