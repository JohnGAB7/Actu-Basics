        voix_off: "Key takeaways. Actuaries put numbers on future costs that are still uncertain. An insurance contract defines the cover, the exclusions, the premium, the benefit, the deductible and the term. The pure premium is the probability of the event times its cost. And the price the customer pays adds loadings on top of it."
