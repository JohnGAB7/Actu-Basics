    - type: texte
      texte: 'One number to sum it up: *the mean*?'
      voix_off: 'We can see the shape. Now let''s put it into a single number. The first that comes to mind: the mean.'
    - type: titre
      numero: '4'
      texte: What the mean really says
      voix_off: “On average.” You read it in every article. But what exactly does it mean?
    - type: titre
      numero: '4.1'
      texte: The mean, an equal share
      voix_off: 'Let''s start with a simple picture: sharing.'
    - type: etapes
      texte: Four friends, *one shared pot*
      etapes:
      - They have €5, €10, €15 and €30
      - 'All in the pot: *€60*'
      - 'Split four ways: *€15 each*'
      voix_off: 'Four friends pool their money. They have five, ten, fifteen and thirty euros. In the pot, that makes sixty euros. Shared equally between the four, that is fifteen euros each: that''s the mean.'
      verifier:
      - expression: 5 + 10 + 15 + 30
        attendu: 60
        libelle: Total in the pot
      - expression: 60 / 4
        attendu: 15
        libelle: Each person's share
    - type: formule
      texte: Mean = *sum ÷ count*
      formule:
      - \text{mean}=\dfrac{\text{sum of the values}}{\text{number of values}}
      - \dfrac{5+10+15+30}{4}=\dfrac{60}{4}=15
      voix_off: 'Hence the formula: the mean is the sum of the values divided by how many there are. Here, sixty divided by four: fifteen.'
      verifier:
      - expression: (5 + 10 + 15 + 30) / 4
        attendu: 15
        libelle: Mean of the pot
    - type: titre
      numero: '4.2'
      texte: The Σ notation, step by step
      voix_off: In textbooks, this formula is written with a scary-looking symbol. There is nothing complicated about it.
    - type: formule
      texte: Σ means *“add up”*
      formule:
      - \bar{x}=\dfrac{x_1+x_2+x_3+x_4}{4}
      - \bar{x}=\dfrac{1}{n}\times\sum_{i=1}^{n}x_i
      voix_off: We call the values x one, x two, x three, x four, and the mean x bar. The sigma symbol tells you to add up all the values, from the first to the n-th. Then divide that sum by n, the number of values. It is exactly the shared pot calculation.
    - type: titre
      numero: '4.3'
      texte: The balance point
      voix_off: 'A second way to see the mean: a balance point.'
    - type: animation
      texte: The mean, a *balance point*
      animation:
        modele: equilibre
        valeurs:
        - 5
        - 10
        - 15
        - 30
        unite: €
      etapes:
      - 'Four friends: *€5, €10, €15 and €30*'
      - 'Pivot at *€15*: the plank balances'
      - 'The deviations *cancel out*: they sum to 0'
      voix_off: 'Let''s put the four amounts from the kitty on a plank: five, ten, fifteen and thirty euros. For the plank to stay level, the pivot must sit exactly at the mean, fifteen euros. There, the deviations cancel out: minus ten and minus five on one side, plus fifteen on the other, zero in total; that''s always true for the mean, and a single value far away is enough to shift the balance.'
      verifier:
      - expression: (5 + 10 + 15 + 30) / 4
        attendu: 15
        libelle: Moyenne de la cagnotte
      - expression: (5 - 15) + (10 - 15) + (15 - 15) + (30 - 15)
        attendu: 0
        libelle: Somme des écarts à la moyenne
    - type: titre
      numero: '4.4'
      texte: The weighted mean
      voix_off: And what if the values don't all count the same?
    - type: formule
      texte: 14 in maths, *weight 3*; 10 in French, *weight 1*
      formule:
      - \dfrac{14\times 3+10\times 1}{3+1}
      - =\dfrac{52}{4}=13
      voix_off: 'A pupil gets fourteen in maths, with a weight of three, and ten in French, with a weight of one. Multiply each mark by its weight, add them up, then divide by the sum of the weights. Fourteen times three plus ten, fifty-two, divided by four: thirteen.'
      verifier:
      - expression: (14 * 3 + 10 * 1) / (3 + 1)
        attendu: 13
        libelle: Weighted mean
    - type: texte
      texte: 'Without weights: 12. With them: *13*'
      voix_off: 'Without the weights, we would have found twelve. The weighted mean gives more weight to what matters most: here, maths.'
      verifier:
      - expression: (14 + 10) / 2
        attendu: 12
        libelle: Simple mean of the two marks
    - type: exercice
      texte: 'Class of *10 pupils*: mean 12. Class of *30 pupils*: mean 8. Overall mean?'
      pause: 8
      voix_off: Your turn. A class of ten pupils has a mean mark of twelve. A class of thirty pupils has a mean of eight. What is the overall mean of the forty pupils?
    - type: correction
      etapes:
      - 10 × 12 = 120 points and 30 × 8 = 240 points
      - (120 + 240) ÷ 40 = *9*
      reponse: 9, not 10
      voix_off: 'Let''s work it out. The first class has ten times twelve, one hundred and twenty points; the second, thirty times eight, two hundred and forty points. Three hundred and sixty points for forty pupils: a mean of nine. Not ten, which would be the mean of the two means: the big class weighs three times as much.'
      verifier:
      - expression: (10 * 12 + 30 * 8) / 40
        attendu: 9
        libelle: Overall mean
      - expression: (12 + 8) / 2
        attendu: 10
        libelle: Mean of the means (wrong)
    - type: chiffre
      valeur: 170
      suffixe:
        fr: ' cm'
        en: ' cm'
      texte: the mean falls *in the dip*, between the two peaks
      note: 'Approximate mean from bin midpoints: about 169.8 cm.'
      voix_off: 'Remember the two-peaked heights. We only know the bins, so we take the middle of each bin, for example a hundred and fifty-two and a half for the bin from a hundred and fifty to a hundred and fifty-five, as the value of its adults. That gives an approximate mean of about a hundred and seventy centimetres. It falls in the dip, where there are few people: a mean can describe no one.'
      verifier:
      - expression: (152.5*2 + 157.5*6 + 162.5*9 + 167.5*5 + 172.5*6 + 177.5*9 + 182.5*5 + 187.5*2) / 44
        attendu: 170
        libelle: Approximate mean, in cm
    - type: chiffre
      texte: the mean trip of our *20 employees*
      valeur: 21.25
      decimales: 2
      suffixe:
        fr: ' min'
        en: ' min'
      note: 'Total of the 20 trips: 425 minutes; 425 ÷ 20 = 21.25.'
      verifier:
      - expression: 4 + 7 + 9 + 11 + 12 + 14 + 15 + 16 + 18 + 19 + 21 + 23 + 25 + 26 + 27 + 29 + 32 + 35 + 38 + 44
        attendu: 425
        libelle: Somme des 20 trajets
      - expression: 425 / 20
        attendu: 21.25
        libelle: Trajet moyen
      voix_off: 'And our twenty employees? Their trips add up to 425 minutes. Divided by twenty, that''s twenty-one and a quarter minutes. It''s what each would have if the total of individual durations were shared equally. That total adds up separate trips: it isn''t time spent together.'
    - type: texte
      texte: '21.25 min: a *typical* employee''s trip?'
      voix_off: 21.25 minutes. Is that a typical employee's trip? Not necessarily.
    - type: titre
      numero: '5'
      texte: Mean or median?
      voix_off: Why do most people earn less than the average salary? It sounds impossible. And yet it happens all the time.
    - type: exercice
      texte: In a group, what share of people earn *less than the mean*?
      etiquette: CHALLENGE
      pause: 4
      voix_off: Here's a question to start. In a group of workers, what share earn less than the average salary? Less than half, exactly half, or more than half? Hold on to your answer.
    - type: titre
      numero: '5.1'
      texte: The mean
      voix_off: Let's start with the mean.
    - type: texte
      texte: Nine customers in a café earn between *€1,600* and *€2,800* a month
      note: €1,600 · 1,800 · 1,900 · 2,000 · 2,200 · 2,300 · 2,500 · 2,700 · 2,800
      voix_off: Nine customers are sitting in a café. They earn between one thousand six hundred and two thousand eight hundred euros a month.
    - type: formule
      texte: Their *mean* salary
      formule:
      - \mathrm{mean}=\dfrac{\mathrm{total}}{\mathrm{count}}
      - =\dfrac{19{,}800}{9}=2{,}200
      voix_off: The mean is the total divided by the number of people. Together they earn nineteen thousand eight hundred euros. Divide by nine, and you get two thousand two hundred euros.
      note: In euros per month.
      verifier:
      - expression: 1600 + 1800 + 1900 + 2000 + 2200 + 2300 + 2500 + 2700 + 2800
        attendu: 19800
        libelle: Total of the 9 salaries
      - expression: 19800 / 9
        attendu: 2200
        libelle: Mean of the 9 salaries
    - type: texte
      texte: A tenth customer walks in. He earns *€200,000* a month.
      voix_off: The door opens. A tenth customer walks in, and he earns two hundred thousand euros a month.
    - type: formule
      texte: The mean *shoots up*
      formule:
      - \dfrac{19{,}800+200{,}000}{10}
      - =21{,}980
      voix_off: Let's do the sum again. Nineteen thousand eight hundred plus two hundred thousand, divided by ten. The café's mean salary jumps to twenty-one thousand nine hundred eighty euros.
      verifier:
      - expression: (19800 + 200000) / 10
        attendu: 21980
        libelle: Mean of the 10 salaries
    - type: chiffre
      valeur: 90
      suffixe:
        fr: ' %'
        en: '%'
      texte: of the customers now earn *less than the mean*
      note: 9 customers out of 10.
      voix_off: Nine customers out of ten now earn less than the mean. Nobody's pay has changed. One extreme value has dragged the mean upward.
      verifier:
      - expression: 100 * 9 / 10
        attendu: 90
        libelle: Share of customers below the mean, %
    - type: titre
      numero: '5.2'
      texte: The median
      voix_off: 'There''s another summary that holds up much better: the median.'
    - type: etapes
      texte: Finding the median
      etapes:
      - Put the values *in order*
      - 'Odd number of values: take *the middle one*'
      - 'Even number: average *the two in the middle*'
      voix_off: Finding the median takes three steps. First, put the values in order, from smallest to largest. With an odd number of values, the median is the one in the middle. With an even number, you take the average of the two middle values.
    - type: animation
      texte: The median *by elimination*
      animation:
        modele: elimination
        valeurs: *id002
        ajout: 200000
        unite: €
      etapes:
      - Nine salaries, *sorted*
      - Cross out the *lowest* and the *highest*
      - 'The *middle* is left: the 5th value'
      - The *€200,000* customer walks in
      - 'Ten values: the mean of the *two middle ones*'
      voix_off: 'Back to the café: let''s sort its first nine salaries, from lowest to highest. Cross out the lowest and the highest, then again, two by two. The fifth value is left, two thousand two hundred euros: that''s the median, at position n plus one over two. The rich customer walks in, with two hundred thousand euros: there are now ten salaries. Cross out two by two again, and two are left, the fifth and the sixth: the median is their mean, two thousand two hundred and fifty euros.'
      verifier:
      - expression: (9 + 1) / 2
        attendu: 5
        libelle: Position du milieu, 9 valeurs
      - expression: (10 + 1) / 2
        attendu: 5.5
        libelle: Position du milieu, 10 valeurs
      - expression: (2200 + 2300) / 2
        attendu: 2250
        libelle: Médiane des 10 salaires
    - type: etapes
      texte: One extreme value
      etapes:
      - 'Mean: from €2,200 to *€21,980*'
      - 'Median: from €2,200 to *€2,250*'
      voix_off: Compare the two. One extreme value pushes the mean from two thousand two hundred to almost twenty-two thousand euros. The median goes up by just fifty euros.
      verifier:
      - expression: 2250 - 2200
        attendu: 50
        libelle: Rise in the median, euros
    - type: courbe
      texte: The ten salaries, *lowest to highest*
