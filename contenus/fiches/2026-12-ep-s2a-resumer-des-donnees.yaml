    - type: titre
      numero: '4'
      texte: Ce que dit vraiment la moyenne
      voix_off: « En moyenne. » On le lit dans tous les articles. Mais que veut dire ce mot, exactement ?
    - type: titre
      numero: '4.1'
      texte: La moyenne, un partage égal
      voix_off: 'Commençons par une image simple : un partage.'
    - type: etapes
      texte: Quatre amis, *une cagnotte*
      etapes:
      - Ils ont 5, 10, 15 et 30 €
      - 'Tout dans la cagnotte : *60 €*'
      - 'Partagé en quatre : *15 € chacun*'
      voix_off: 'Quatre amis mettent leur argent en commun. Ils ont cinq, dix, quinze et trente euros. Dans la cagnotte, cela fait soixante euros. Partagés à parts égales entre les quatre, cela fait quinze euros chacun : c''est la moyenne.'
      verifier:
      - expression: 5 + 10 + 15 + 30
        attendu: 60
        libelle: Total de la cagnotte
      - expression: 60 / 4
        attendu: 15
        libelle: Part de chacun
    - type: formule
      texte: Moyenne = *somme ÷ nombre*
      formule:
      - \text{moyenne}=\dfrac{\text{somme des valeurs}}{\text{nombre de valeurs}}
      - \dfrac{5+10+15+30}{4}=\dfrac{60}{4}=15
      voix_off: 'D''où la formule : la moyenne, c''est la somme des valeurs divisée par leur nombre. Ici, soixante divisé par quatre : quinze.'
      verifier:
      - expression: (5 + 10 + 15 + 30) / 4
        attendu: 15
        libelle: Moyenne de la cagnotte
    - type: titre
      numero: '4.2'
      texte: La notation Σ, pas à pas
      voix_off: Dans les livres, cette formule s'écrit avec un symbole qui fait peur. Il n'a rien de compliqué.
    - type: formule
      texte: Σ veut dire *« additionner »*
      formule:
      - \bar{x}=\dfrac{x_1+x_2+x_3+x_4}{4}
      - \bar{x}=\dfrac{1}{n}\times\sum_{i=1}^{n}x_i
      voix_off: On appelle les valeurs x un, x deux, x trois, x quatre, et la moyenne x barre. Le symbole sigma indique qu'on additionne toutes les valeurs, de la première à la n-ième. Puis on divise cette somme par n, le nombre de valeurs. C'est exactement le calcul de la cagnotte.
    - type: titre
      numero: '4.3'
      texte: Le point d'équilibre
      voix_off: 'Deuxième façon de voir la moyenne : un point d''équilibre.'
    - type: animation
      texte: La moyenne, *point d'équilibre*
      animation:
        modele: equilibre
        valeurs:
        - 5
        - 10
        - 15
        - 30
        unite: €
      etapes:
      - 'Quatre amis : *5, 10, 15 et 30 €*'
      - 'L''appui à *15 €* : la planche s''équilibre'
      - 'Les écarts se *compensent* : leur somme vaut 0'
      voix_off: 'Posons les quatre montants de la cagnotte sur une planche : cinq, dix, quinze et trente euros. Pour que la planche tienne à l''horizontale, l''appui doit se placer exactement à la moyenne, quinze euros. Là, les écarts se compensent : moins dix et moins cinq d''un côté, plus quinze de l''autre, zéro au total ; c''est toujours vrai pour la moyenne, et une seule valeur très loin suffit à déplacer l''équilibre.'
      verifier:
      - expression: (5 + 10 + 15 + 30) / 4
        attendu: 15
        libelle: Moyenne de la cagnotte
      - expression: (5 - 15) + (10 - 15) + (15 - 15) + (30 - 15)
        attendu: 0
        libelle: Somme des écarts à la moyenne
    - type: titre
      numero: '4.4'
      texte: La moyenne pondérée
      voix_off: Et quand toutes les valeurs ne comptent pas autant ?
    - type: formule
      texte: 14 en maths, *coefficient 3* ; 10 en français, *coefficient 1*
      formule:
      - \dfrac{14\times 3+10\times 1}{3+1}
      - =\dfrac{52}{4}=13
      voix_off: 'Une élève a quatorze en mathématiques, avec un coefficient trois, et dix en français, avec un coefficient un. On multiplie chaque note par son coefficient, on additionne, puis on divise par la somme des coefficients. Quatorze fois trois plus dix, cinquante-deux, divisé par quatre : treize.'
      verifier:
      - expression: (14 * 3 + 10 * 1) / (3 + 1)
        attendu: 13
        libelle: Moyenne pondérée
    - type: texte
      texte: 'Sans coefficients : 12. Avec : *13*'
      voix_off: 'Sans les coefficients, on aurait trouvé douze. La moyenne pondérée donne plus de poids à ce qui compte le plus : ici, les mathématiques.'
      verifier:
      - expression: (14 + 10) / 2
        attendu: 12
        libelle: Moyenne simple des deux notes
    - type: exercice
      texte: 'Classe de *10 élèves* : 12 de moyenne. Classe de *30 élèves* : 8. Moyenne générale ?'
      pause: 8
      voix_off: À vous. Une classe de dix élèves a douze de moyenne. Une classe de trente élèves a huit de moyenne. Quelle est la moyenne générale des quarante élèves ?
    - type: correction
      etapes:
      - 10 × 12 = 120 points et 30 × 8 = 240 points
      - (120 + 240) ÷ 40 = *9*
      reponse: 9, et non 10
      voix_off: 'Faisons le calcul. La première classe totalise dix fois douze, cent vingt points ; la seconde, trente fois huit, deux cent quarante points. Trois cent soixante points pour quarante élèves : neuf de moyenne. Pas dix, qui serait la moyenne des deux moyennes : la grande classe pèse trois fois plus.'
      verifier:
      - expression: (10 * 12 + 30 * 8) / 40
        attendu: 9
        libelle: Moyenne générale
      - expression: (12 + 8) / 2
        attendu: 10
        libelle: Moyenne des moyennes (fausse)
