      etiquette: DÉFI
      pause: 4
      voix_off: Une question pour commencer. Dans un groupe de salariés, quelle part gagne moins que le salaire moyen ? Moins de la moitié, la moitié, ou plus de la moitié ? Gardez votre réponse en tête.
