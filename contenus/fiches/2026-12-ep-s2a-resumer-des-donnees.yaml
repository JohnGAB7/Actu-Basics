    - type: etapes
      texte: Key takeaways
      etapes:
      - Compare *frequencies*, not counts
      - 'Unequal bins: *area* counts'
      - Look at the *shape* before any calculation
      - 'Mean: an *equal share* of the total'
      - 'Median: splits in *two*; right tail, mean above'
      voix_off: 'What to remember. One: count, then divide by the total; compare frequencies, not counts. Two: separate bars for categories, a histogram for numbers, and when bins are unequal, area is what counts. Three: look at the shape before any calculation; two peaks may mean two groups. Four: the mean is the total divided by the count, what each would get with an equal share; one extreme value moves it. Five: the median splits the data in half; with a right tail, the mean sits above the median. Pick the one that answers your question.'
    - type: exercice
      texte: '10 trips: 5, 8, 12, 15, 15, 18, 22, 25, 30, *90* min. Share under 20 min, shape, mean, median?'
      pause: 15
      voix_off: 'Your turn. Ten employees at a fictional branch take, in minutes: 5, 8, 12, 15, 15, 18, 22, 25, 30 and 90. One: what share takes under 20 minutes? Two: what shape is this distribution? Three: compute the mean and the median. Four: how many employees are below the mean, and which number would you report as the ''typical trip''? Pause the video.'
    - type: correction
      etapes:
      - 'Under 20 min: 6 out of 10, *60%*'
      - 'Shape: *right tail* (the 90-minute trip)'
      - 'Mean: 240 ÷ 10 = *24 min*'
      - 'Median: (15 + 18) ÷ 2 = *16.5 min*'
      voix_off: 'One: 6 out of 10, so 60% (5, 8, 12, 15, 15 and 18). Two: a right tail, caused by the 90-minute trip. Three: total 240, mean 240 ÷ 10 = 24 minutes; ten values, so the median is the average of the 5th and 6th: (15 + 18) ÷ 2 = 16.5 minutes.'
      verifier:
      - expression: 5+8+12+15+15+18+22+25+30+90
        attendu: 240
        libelle: Somme
      - expression: 240 / 10
        attendu: 24
        libelle: Moyenne
      - expression: (15 + 18) / 2
        attendu: 16.5
        libelle: Médiane
      - expression: 6 / 10 * 100
        attendu: 60
        libelle: Part sous 20 min
    - type: etapes
      texte: Answer (continued)
      etapes:
      - '7 out of 10 below the mean: typical trip *16.5 min*'
      - 'If 90 were a typo for 35: mean *18.5 min*, median unchanged'
      verifier:
      - expression: (240 - 90 + 35) / 10
        attendu: 18.5
        libelle: Moyenne si 90 était 35
      voix_off: 'Four: 7 employees out of 10 are below the mean; the typical trip is the median, 16.5 minutes. Going further: if the 90 minutes were a typo for 35, the mean would drop to 18.5 minutes and the median would not move.'
