# Épisode long EP-S2A « Résumer des données : tableaux, histogrammes, moyenne et médiane » (YOUTUBE_LESSON).
# Assemblé le 22/11/2026 à partir des cinq fiches de chapitre validées (S2.01 à S2.05) et de la fiche de
# conception contenus/conception/EP-S2A.yaml (validée par JG le 22/11/2026, PR #50), changements compris.
# Données fictives, aucun chiffre réel. Statut : brouillon, en attente de relecture et de validation par JG.
id: 2026-12-ep-s2a-resumer-des-donnees
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: youtube_lesson
habillage_sonore: true
theme: EP-S2A · Résumer des données
pedagogie:
  niveau: decouverte
  objectifs:
    fr:
    - Construire un tableau d'effectifs, de fréquences et de fréquences cumulées
    - Choisir entre diagramme en barres et histogramme selon le type de variable
    - Expliquer comment la largeur des classes change un histogramme, et lire une densité quand les classes sont inégales
    - 'Décrire la forme d''une distribution : symétrie, queue, une ou deux bosses'
    - Calculer une moyenne simple et pondérée, et une médiane (nombre pair ou impair de valeurs)
    - Choisir entre moyenne et médiane d'après la forme de la distribution et la question posée
    en:
    - Build a table of counts, relative frequencies and cumulative frequencies
    - Choose between a bar chart and a histogram from the type of variable
    - Explain how bin width changes a histogram, and read a density when bins are unequal
    - 'Describe the shape of a distribution: symmetry, tail, one or two peaks'
    - Compute a simple and a weighted mean, and a median (odd or even number of values)
    - Choose between mean and median from the shape of the distribution and the question asked
  prerequis:
    fr:
    - 'S1.03 : types de variables (épisode EP-S1A)'
    - Pourcentages (épisode EP-M01)
    en:
    - 'S1.03: types of variables (episode EP-S1A)'
    - Percentages (episode EP-M01)
  hypotheses:
    fr: 'Données fictives : 20 salariés d''une entreprise imaginaire, une classe, un café, des visiteurs. Aucun chiffre réel.'
    en: 'Made-up data: 20 employees of an imaginary company, a class, a café, visitors. No real numbers.'
validation:
  statut: brouillon
  valide_par: ''
  date: ''
sources: []
editions:
  fr:
    titre: 'Moyenne, médiane, histogramme : résumer des données sans se faire avoir'
    legende: 'Comment résumer des données sans les trahir ? Un tableau garde les proportions, un histogramme la silhouette, la moyenne le total, la médiane le milieu. Cinq chapitres, deux laboratoires en direct, un exercice de synthèse corrigé. Données fictives, calculs vérifiés. Sources de méthode : OpenStax, Introductory Statistics 2e, « Measures of the Center of the Data » ; NIST/SEMATECH e-Handbook of Statistical Methods, « Histogram ». Un exercice vous bloque ? Posez votre question en commentaire.

      '
    hashtags:
    - statistiques
    - moyenne
    - mediane
    - histogramme
    scenes:
    - type: accroche
      texte: 'Vingt salariés. *Qui dit vrai* : la moyenne ou la médiane ?'
      voix_off: 'Vingt salariés. Une seule question : combien de temps mettent-ils pour venir travailler ? La moyenne dit un peu plus de 21 minutes. Pourtant, la moitié d''entre eux met 20 minutes ou moins. Et si un seul salarié déménage loin, la moyenne bondit… alors que presque rien n''a changé pour les autres. Qui dit vrai ?'
    - type: accueil
      texte: Bonjour, et *bienvenue* !
      voix_off: 'Bonjour, et bienvenue ! Merci d''être là. Salaires, notes, temps de trajet : on résume tout avec une moyenne. Dans cet épisode, on voit quand elle dit vrai, quand elle trompe, et par quoi la remplacer.'
    - type: animation
      texte: Ce que vous allez *apprendre*
      animation:
        modele: apercu
        cartes:
        - icone: tableau
          texte: Construire un *tableau* de fréquences
        - icone: histogramme
          texte: Choisir et lire un *histogramme*
        - icone: forme
          texte: Reconnaître la *forme* d'une distribution
        - icone: equilibre
          texte: Calculer une *moyenne*
        - icone: mediane
          texte: Trouver la *médiane*
        - icone: laboratoire
          texte: Tester en *laboratoire*, puis s'exercer
      voix_off: 'Voici ce que vous saurez faire à la fin de cet épisode : construire un tableau de fréquences ; choisir et lire un histogramme ; reconnaître la forme d''une distribution ; calculer une moyenne, et voir pourquoi c''est un point d''équilibre ; trouver une médiane ; et tout vérifier vous-même, avec deux laboratoires et un exercice corrigé.'
    - type: titre
      numero: '1'
      texte: 'Compter : effectifs, fréquences, cumul'
      voix_off: 'Mille réponses à un questionnaire : personne ne va les lire une par une. Pour comprendre la méthode, partons d''une petite classe de vingt-cinq élèves. Comment résumer leurs réponses ?'
    - type: titre
      numero: '1.1'
      texte: 'Compter : les effectifs'
      voix_off: 'Première étape, toute simple : compter.'
    - type: courbe
      texte: Combien de *frères et sœurs* ? Classe de 25 élèves
      courbe:
        style: barres
        points:
        - - 0
          - 5
        - - 1
          - 10
        - - 2
          - 6
        - - 3
          - 4
        etiquettes:
        - '0'
        - '1'
        - '2'
        - '3'
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Nombre de frères et sœurs
        axe_y: Effectif (élèves)
      note: Classe fictive de 25 élèves.
      voix_off: On demande à vingt-cinq élèves combien ils ont de frères et sœurs. Cinq n'en ont aucun, dix en ont un, six en ont deux et quatre en ont trois. Ces nombres s'appellent des effectifs.
      verifier:
      - expression: 5 + 10 + 6 + 4
        attendu: 25
        libelle: Total des effectifs
    - type: texte
      texte: 'Toujours vérifier le *total* : 5 + 10 + 6 + 4 = 25'
      voix_off: 'Premier réflexe : vérifier le total. Cinq plus dix plus six plus quatre, cela fait bien vingt-cinq. Sans total, un effectif ne veut pas dire grand-chose.'
    - type: titre
      numero: '1.2'
      texte: 'Rapporter au total : les fréquences'
      voix_off: 'Deuxième étape : rapporter chaque effectif au total.'
    - type: formule
      texte: Fréquence = effectif ÷ total
      formule:
      - \text{fréquence}=\dfrac{\text{effectif}}{\text{effectif total}}
      - \dfrac{10}{25}=0{,}40=40\ \%
      voix_off: 'La fréquence, c''est l''effectif divisé par le total. Pour les élèves qui ont un frère ou une sœur : dix divisé par vingt-cinq, cela fait zéro virgule quarante, soit quarante pour cent.'
      verifier:
      - expression: 10 / 25 * 100
        attendu: 40
        libelle: Fréquence de « 1 », en %
    - type: etapes
      texte: Le tableau complet
      etapes:
      - '0 : 5 élèves, soit *20 %*'
      - '1 : 10 élèves, soit *40 %*'
      - '2 : 6 élèves, soit *24 %*'
      - '3 : 4 élèves, soit *16 %*'
      voix_off: 'Voici le tableau complet. Aucun frère ou sœur : cinq élèves, soit vingt pour cent. Un : dix élèves, soit quarante pour cent. Deux : six élèves, soit vingt-quatre pour cent. Trois : quatre élèves, soit seize pour cent.'
      verifier:
      - expression: 5 / 25 * 100
        attendu: 20
        libelle: Fréquence de « 0 », en %
      - expression: 6 / 25 * 100
        attendu: 24
        libelle: Fréquence de « 2 », en %
      - expression: 4 / 25 * 100
        attendu: 16
        libelle: Fréquence de « 3 », en %
      - expression: 20 + 40 + 24 + 16
        attendu: 100
        libelle: Total des fréquences, en %
    - type: texte
      texte: Les fréquences font toujours *100 %*
      voix_off: Les fréquences s'additionnent toujours pour faire cent pour cent. Si ce n'est pas le cas, il manque quelqu'un, ou un arrondi est passé par là.
    - type: titre
      numero: '1.3'
      texte: 'Additionner : les fréquences cumulées'
      voix_off: 'Troisième étape : les fréquences cumulées.'
    - type: etapes
      texte: '*Au plus* tant de frères et sœurs'
      etapes:
      - 'Au plus 0 : *20 %*'
      - 'Au plus 1 : 20 + 40 = *60 %*'
      - 'Au plus 2 : 60 + 24 = *84 %*'
      - 'Au plus 3 : 84 + 16 = *100 %*'
      voix_off: 'On additionne les fréquences au fur et à mesure. Au plus zéro frère ou sœur : vingt pour cent. Au plus un : vingt plus quarante, soit soixante pour cent. Au plus deux : soixante plus vingt-quatre, soit quatre-vingt-quatre pour cent. Au plus trois : cent pour cent, toute la classe.'
      verifier:
      - expression: 20 + 40
        attendu: 60
        libelle: Cumul jusqu'à 1
      - expression: 20 + 40 + 24
        attendu: 84
        libelle: Cumul jusqu'à 2
    - type: chiffre
      valeur: 84
      suffixe:
        fr: ' %'
        en: '%'
      texte: des élèves ont *au plus deux* frères et sœurs
      note: 'Le cumul suit l''ordre des valeurs : il a un sens ici parce que 0, 1, 2, 3 sont rangés.'
      voix_off: 'Une seule phrase résume alors la classe : quatre-vingt-quatre pour cent des élèves ont au plus deux frères et sœurs. Le cumul a un sens ici parce que les valeurs sont rangées dans l''ordre.'
    - type: titre
      numero: '1.4'
      texte: 'Le piège : comparer des effectifs'
      voix_off: Dernier point, et c'est le piège le plus courant.
    - type: etapes
      texte: Deux classes, *deux tailles*
      etapes:
      - 'Classe A, 25 élèves : 10 ont un frère ou une sœur, *40 %*'
      - 'Classe B, 40 élèves : 12 en ont un, *30 %*'
      voix_off: Comparons deux classes. Dans la classe A, de vingt-cinq élèves, dix ont exactement un frère ou une sœur, soit quarante pour cent. Dans la classe B, de quarante élèves, ils sont douze, soit trente pour cent seulement.
      verifier:
      - expression: 12 / 40 * 100
        attendu: 30
        libelle: Classe B, en %
    - type: texte
      texte: 12 est plus grand que 10, mais *30 % est plus petit que 40 %*
      voix_off: Douze est plus grand que dix. Mais rapporté à la taille de la classe, c'est moins. Pour comparer deux groupes de tailles différentes, on compare des fréquences, pas des effectifs.
    - type: exercice
      texte: '20 salariés : *8 voiture*, *6 transports en commun*, *4 vélo*, *2 marche*. Fréquences et cumul ?'
      pause: 8
      voix_off: 'À vous. Vingt salariés indiquent leur mode de transport : huit en voiture, six en transports en commun, quatre à vélo et deux à pied. Calculez les fréquences, puis les fréquences cumulées.'
    - type: correction
      etapes:
      - Voiture 8 ÷ 20 = *40 %*, transports 6 ÷ 20 = *30 %*
      - Vélo 4 ÷ 20 = *20 %*, marche 2 ÷ 20 = *10 %*
      - 'Cumul, de la voiture à la marche : 40, 70, 90, 100 %'
      reponse: Total 100 %, cumul dans l'ordre choisi
      voix_off: 'Correction. Voiture : huit divisé par vingt, quarante pour cent ; transports en commun : trente pour cent. Vélo : vingt pour cent ; marche : dix pour cent. En cumulant dans cet ordre : quarante, soixante-dix, quatre-vingt-dix, puis cent pour cent. Attention : les modes de transport n''ont pas d''ordre naturel. Le cumul dépend de l''ordre choisi, ici du plus fréquent au moins fréquent.'
      verifier:
      - expression: 8 / 20 * 100
        attendu: 40
        libelle: Voiture, en %
      - expression: 6 / 20 * 100
        attendu: 30
        libelle: Transports en commun, en %
      - expression: 4 / 20 * 100
        attendu: 20
        libelle: Vélo, en %
      - expression: 2 / 20 * 100
        attendu: 10
        libelle: Marche, en %
      - expression: 40 + 30 + 20
        attendu: 90
        libelle: Cumul jusqu'au vélo
    - type: texte
      texte: Gardez ces *20 salariés* en tête
      voix_off: 'Gardez ces vingt salariés en tête : nous allons les suivre jusqu''à la fin de l''épisode. D''abord, dessinons leurs réponses.'
    - type: titre
      numero: '2'
      texte: 'Dessiner : barres ou histogramme'
      voix_off: Deux graphiques faits de barres. Sur l'un, elles se touchent ; sur l'autre, non. Ce détail change toute la façon de les lire.
    - type: titre
      numero: '2.1'
      texte: 'Le diagramme en barres : des catégories'
      voix_off: Commençons par le diagramme en barres.
    - type: courbe
      texte: Mode de transport de *20 salariés*
      courbe:
        style: barres
        points:
        - - 0
          - 8
        - - 1
          - 6
        - - 2
          - 4
        - - 3
          - 2
        etiquettes:
        - Voiture
        - Transports
        - Vélo
        - Marche
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Mode de transport
        axe_y: Effectif (salariés)
      note: Entreprise fictive de 20 salariés (exercice du chapitre 1).
      voix_off: 'Voici les vingt salariés de l''exercice du chapitre 1. Une barre par mode de transport : voiture, transports en commun, vélo, marche. Les barres sont séparées, parce que ce sont des catégories distinctes. On pourrait les ranger dans un autre ordre sans rien changer au sens.'
      verifier:
      - expression: 8 + 6 + 4 + 2
        attendu: 20
        libelle: Total des salariés
    - type: titre
      numero: '2.2'
      texte: 'L''histogramme : des nombres en classes'
      voix_off: 'Passons maintenant à une variable numérique : le temps de trajet, en minutes.'
    - type: courbe
      texte: Temps de trajet, *classes de 10 minutes*
      courbe:
        style: histogramme
        points:
        - - 0
          - 3
        - - 10
          - 7
        - - 20
          - 6
        - - 30
          - 3
        - - 40
          - 1
        largeur_classe: 10
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Temps de trajet (minutes)
        axe_y: Effectif (salariés)
      note: Temps de trajet fictifs des 20 mêmes salariés.
      voix_off: 'On range les temps de trajet en classes de dix minutes. Trois salariés mettent moins de dix minutes, sept entre dix et vingt, six entre vingt et trente, trois entre trente et quarante, un seul entre quarante et cinquante. Cette fois, les barres se touchent : les minutes forment une suite continue, sans trou entre les classes. Chaque classe contient sa borne gauche, pas sa borne droite : un trajet de vingt minutes compte dans la classe de vingt à trente.'
      verifier:
      - expression: 3 + 7 + 6 + 3 + 1
        attendu: 20
        libelle: Total, classes de 10 minutes
    - type: courbe
      texte: Les mêmes temps, *classes de 20 minutes*
      courbe:
        style: histogramme
        points:
        - - 0
          - 10
        - - 20
          - 9
        - - 40
          - 1
        largeur_classe: 20
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Temps de trajet (minutes)
        axe_y: Effectif (salariés)
      voix_off: Ce sont exactement les mêmes données, regroupées en classes de vingt minutes. Dix salariés mettent moins de vingt minutes, neuf entre vingt et quarante, un seul plus de quarante. Le sommet, entre dix et vingt minutes, a disparu.
      verifier:
      - expression: 3 + 7
        attendu: 10
        libelle: Classe 0 à 20 minutes
      - expression: 6 + 3
        attendu: 9
        libelle: Classe 20 à 40 minutes
    - type: texte
      texte: Le choix des classes *change la silhouette*
      voix_off: Le choix des classes change la silhouette. Trop larges, elles cachent les détails. Trop étroites, elles font apparaître des bosses dues au hasard. Devant un histogramme, regardez toujours la largeur des classes.
    - type: titre
      numero: '2.3'
      texte: 'Classes inégales : la surface compte'
      voix_off: 'Dernier piège : les classes de largeurs différentes.'
    - type: courbe
      texte: '*Construction trompeuse* : hauteur = effectif, classes inégales'
      courbe:
        style: histogramme
        points:
        - - 0
          - 3
        - - 10
          - 7
        - - 20
          - 10
        largeur_classe: 30
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Temps de trajet (minutes)
        axe_y: Effectif (salariés)
      voix_off: 'Regroupons maintenant tout ce qui dépasse vingt minutes dans une seule classe, de vingt à cinquante. Elle contient dix salariés. Si l''on prend l''effectif comme hauteur, cette grande barre écrase tout : on croirait que les trajets longs dominent.'
      verifier:
      - expression: 6 + 3 + 1
        attendu: 10
        libelle: Classe 20 à 50 minutes
    - type: formule
      texte: 'La bonne hauteur : la *densité*'
      formule:
      - \text{densité}=\dfrac{\text{effectif}}{\text{largeur de la classe}}
      - \dfrac{10}{30}\approx 0{,}33\ \text{salarié par minute}
      voix_off: 'Dans un histogramme, c''est la surface qui représente l''effectif. La hauteur doit donc être une densité : l''effectif divisé par la largeur de la classe. Pour la classe de vingt à cinquante minutes : dix divisé par trente, environ zéro virgule trente-trois salarié par minute.'
      verifier:
      - expression: 10 / 30
        attendu: 0.33
        libelle: Densité de la classe 20 à 50 minutes
      - expression: 3 / 10
        attendu: 0.3
        libelle: Densité de la classe 0 à 10 minutes
      - expression: 7 / 10
        attendu: 0.7
        libelle: Densité de la classe 10 à 20 minutes
    - type: animation
      texte: 'Hauteur = *densité* : l''image redevient juste'
      animation:
        modele: densite
        bornes:
        - 0
        - 10
        - 20
        - 50
        effectifs:
        - 3
        - 7
        - 10
        unite: minutes
      etapes:
      - 'Hauteur = effectif : la grande classe *écrase tout*'
      - 'Hauteur = *densité* : le même espacement partout'
      - Surface = densité × largeur = *effectif*
      voix_off: 'Reprenons la construction trompeuse : avec l''effectif comme hauteur, la grande classe de vingt à cinquante minutes écrase tout. Passons à la densité : les barres montent ou descendent, et les pastilles, une par salarié, prennent le même espacement partout ; la classe de dix à vingt minutes redevient la plus dense. La surface de chaque barre redonne son effectif : zéro virgule trois fois dix, trois ; zéro virgule sept fois dix, sept ; un tiers fois trente, dix.'
      verifier:
      - expression: 0.7 * 10
        attendu: 7
        libelle: Surface de la classe 10 à 20 minutes
      - expression: 10 / 30 * 30
        attendu: 10
        libelle: Surface de la classe 20 à 50 minutes
    - type: exercice
      texte: '40 visiteurs : *0–20 ans : 8*, *20–30 ans : 12*, *30–60 ans : 20*. Quelle classe est la plus dense ?'
      pause: 8
      voix_off: 'À vous. Quarante visiteurs d''un musée fictif : huit ont entre zéro et vingt ans, douze entre vingt et trente ans, vingt entre trente et soixante ans. Un histogramme qui prend l''effectif comme hauteur met en avant les trente à soixante ans. A-t-il raison ? Quelle classe est la plus dense ?'
    - type: correction
      etapes:
      - '0–20 ans : 8 ÷ 20 = *0,4* visiteur par année d''âge'
      - '20–30 ans : 12 ÷ 10 = *1,2* visiteur par année d''âge'
      - '30–60 ans : 20 ÷ 30 ≈ *0,67* visiteur par année d''âge'
      reponse: 'Les 20–30 ans : la classe la plus dense'
      voix_off: 'Divisons chaque effectif par la largeur de sa classe. De zéro à vingt ans : huit divisé par vingt, zéro virgule quatre visiteur par année d''âge. De vingt à trente ans : douze divisé par dix, un virgule deux. De trente à soixante ans : vingt divisé par trente, environ zéro virgule soixante-sept. La classe la plus dense est celle des vingt à trente ans : l''histogramme en effectifs était trompeur.'
      verifier:
      - expression: 8 / 20
        attendu: 0.4
        libelle: Densité 0 à 20 ans
      - expression: 12 / 10
        attendu: 1.2
        libelle: Densité 20 à 30 ans
      - expression: 20 / 30
        attendu: 0.67
        libelle: Densité 30 à 60 ans
    - type: texte
      texte: Et si l'on changeait *nous-mêmes* les classes ?
      voix_off: Avant de regarder la forme, essayons nous-mêmes de changer les classes.
    - type: titre
      texte: 'Laboratoire : la largeur des classes'
      numero: '2.4'
      univers: immersif
      voix_off: Laboratoire. Prenons les vingt temps de trajet et changeons nous-mêmes la largeur des classes.
    - type: animation
      texte: Classes de *20 minutes*
      univers: immersif
      animation:
        modele: pastilles
        valeurs: &id001
        - 4
        - 7
        - 9
        - 11
        - 12
        - 14
        - 15
        - 16
        - 18
        - 19
        - 21
        - 23
        - 25
        - 26
        - 27
        - 29
        - 32
        - 35
        - 38
        - 44
        largeur_classe: 20
        unite: minutes
      voix_off: 'Classes de vingt minutes : dix, neuf, un. Le sommet a disparu.'
      verifier:
      - expression: 3 + 7
        attendu: 10
        libelle: 0 à 20 minutes
    - type: animation
      texte: Classes de *10 minutes*
      univers: immersif
      animation:
        modele: pastilles
        valeurs: *id001
        largeur_classe: 10
        unite: minutes
      voix_off: 'Classes de dix minutes : trois, sept, six, trois, un. Une bosse nette.'
    - type: animation
      texte: 'Classes de *5 minutes* : deux « sommets » ?'
      univers: immersif
      animation:
        modele: pastilles
        valeurs: *id001
        largeur_classe: 5
        unite: minutes
      voix_off: 'Classes de cinq minutes. Le trajet de quinze minutes est compté dans la classe de quinze à vingt : la borne gauche est incluse. Deux sommets apparaissent, à quinze et à vingt-cinq minutes. Ils ne tiennent qu''à un ou deux salariés. Trop larges, les classes cachent ; trop étroites, elles inventent.'
      verifier:
      - expression: 1 + 2 + 3 + 4 + 2 + 4 + 1 + 2 + 1
        attendu: 20
        libelle: Classes de 5 minutes
    - type: courbe
      texte: 'Âges de 40 visiteurs : *hauteur = effectif*'
      courbe:
        style: histogramme
        points:
        - - 0
          - 8
        - - 20
          - 12
        - - 30
          - 20
        largeur_classe: 30
        valeurs: true
        y_min: 0
        y_max: 24
        axe_x: Âge (années)
        axe_y: Effectif (visiteurs)
      voix_off: 'Second réglage : les âges de quarante visiteurs, en classes inégales. Avec l''effectif comme hauteur, les trente à soixante ans dominent.'
    - type: courbe
      texte: Hauteur = *densité d'effectif*
      courbe:
        style: histogramme
        points:
        - - 0
          - 0.4
        - - 20
          - 1.2
        - - 30
          - 0.6667
        largeur_classe: 30
        valeurs: false
        y_min: 0
        y_max: 1.6
        axe_x: Âge (années)
        axe_y: Densité (visiteurs par an)
        decimales_y: 1
      note: 'Aires : 0,4 × 20 = 8 ; 1,2 × 10 = 12 ; ⅔ × 30 = 20 ; total 40 (hauteur 0,67 arrondie).'
