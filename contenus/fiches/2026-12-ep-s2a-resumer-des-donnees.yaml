      - 'Nombre pair : la moyenne des *deux du milieu*'
      voix_off: La médiane se calcule en trois temps. D'abord, on range les valeurs de la plus petite à la plus grande. Avec un nombre impair de valeurs, la médiane est celle du milieu. Avec un nombre pair, on prend la moyenne des deux valeurs du milieu.
