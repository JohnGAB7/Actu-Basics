      etapes:
      - 'Longue traîne vers le haut : moyenne *au-dessus* de la médiane'
      - 'Distribution symétrique : moyenne *proche* de la médiane'
      - 'Longue traîne vers le bas : moyenne *en dessous* de la médiane'
      voix_off: C'est une règle générale, qui dépend de la forme de la distribution. Quand quelques valeurs très grandes forment une longue traîne vers le haut, comme souvent les salaires ou les patrimoines, la moyenne passe au-dessus de la médiane. Quand la distribution est symétrique, les deux sont proches. Et quand la traîne part vers le bas, la moyenne passe en dessous.
    - type: texte
      texte: 'Moyenne au-dessus de la médiane : *au moins la moitié* des valeurs sont inférieures à la moyenne'
      voix_off: Voilà la réponse au défi. Par définition, au moins la moitié des valeurs sont inférieures ou égales à la médiane. Si la moyenne est au-dessus de la médiane, au moins la moitié des valeurs sont donc inférieures à la moyenne. Pour des salaires, cela fait au moins la moitié des salariés, et souvent bien plus.
    - type: exercice
      texte: 'Sept salaires : 1 500, 1 600, 1 700, 1 800, 1 900, 2 000, 2 100 €. Moyenne et médiane, avant puis après l''arrivée d''un salaire de *20 000 €* ?'
      pause: 8
      voix_off: 'À vous. Sept salaires mensuels : mille cinq cents, mille six cents, mille sept cents, mille huit cents, mille neuf cents, deux mille et deux mille cent euros. Calculez la moyenne et la médiane. Puis recommencez après l''arrivée d''un salaire de vingt mille euros.'
    - type: correction
      etapes:
      - 'Avant : 12 600 ÷ 7 = *1 800 €* ; médiane *1 800 €*'
      - 'Après : 32 600 ÷ 8 = *4 075 €*'
      - 'Médiane : (1 800 + 1 900) ÷ 2 = *1 850 €*'
      reponse: La moyenne fait plus que doubler, la médiane gagne 50 €
      voix_off: 'Voici la correction. Avant, la somme vaut douze mille six cents euros : divisée par sept, la moyenne est de mille huit cents euros, comme la médiane, la quatrième valeur. Après, la somme passe à trente-deux mille six cents euros, divisée par huit : quatre mille soixante-quinze euros. Avec huit valeurs, la médiane est la moyenne de la quatrième et de la cinquième : mille huit cent cinquante euros. La moyenne a plus que doublé, la médiane n''a gagné que cinquante euros.'
      verifier:
      - expression: 1500 + 1600 + 1700 + 1800 + 1900 + 2000 + 2100
        attendu: 12600
        libelle: Somme des 7 salaires
      - expression: 12600 / 7
        attendu: 1800
        libelle: Moyenne des 7 salaires
      - expression: (12600 + 20000) / 8
        attendu: 4075
        libelle: Moyenne des 8 salaires
      - expression: (1800 + 1900) / 2
        attendu: 1850
        libelle: Médiane des 8 salaires
    - type: titre
      numero: '5.3'
      texte: Laquelle choisir ?
      voix_off: 'La moyenne est sensible aux valeurs extrêmes : une seule valeur très élevée peut la tirer vers le haut. La médiane, elle, dépend de la position centrale des valeurs ordonnées. Cela ne signifie pas qu''elle est toujours meilleure : le bon indicateur dépend de la question que l''on cherche à éclairer.'
    - type: etapes
      texte: Chaque indicateur répond à *sa* question
      etapes:
      - « Que gagne un salarié typique ? » → la *médiane*
      - « Combien coûtent tous les salaires ? » → la *moyenne*, × l'effectif
      - 'Le plus honnête : donner *les deux*'
      voix_off: 'Chaque indicateur répond à sa propre question. Pour savoir ce que gagne un salarié typique, la médiane est la bonne réponse. Pour savoir combien coûtent tous les salaires ensemble, il faut la moyenne, multipliée par le nombre de salariés : la médiane ne le permet pas. Le plus honnête est souvent de donner les deux, car l''écart entre elles dit à lui seul si la distribution est asymétrique.'
    - type: texte
      texte: 'La médiane a sa limite : elle ignore *l''ampleur* des écarts'
      note: Avec un client à 2 millions € par mois, la médiane du café resterait 2 250 €.
      voix_off: 'La médiane a aussi sa limite : elle ignore l''ampleur des écarts. Que le client riche gagne deux cent mille euros ou deux millions, la médiane du café reste la même. Elle ne voit pas l''inégalité.'
    - type: titre
      texte: 'Laboratoire : une seule valeur extrême'
      numero: '5.4'
      univers: immersif
      voix_off: Deuxième laboratoire. Faisons bouger une seule valeur, et regardons qui suit.
    - type: animation
      texte: 'Le dixième client : *curseur* de 2 300 à 200 000 €'
      univers: immersif
      animation:
        modele: curseur
        valeurs:
        - 1600
        - 1800
        - 1900
        - 2000
        - 2200
        - 2300
        - 2500
        - 2700
        - 2800
        - 2300
        indice: 9
        vers: 200000
        axe_max: 3600
        unite: €
        decimales: 0
      etapes:
      - Neuf salaires, et un *dixième client* à 2 300 €
      - 'Médiane : *2 250 €*'
      - 'Moyenne : *2 210 €*'
      - 'Le dixième monte à 200 000 € : la moyenne *s''envole*, la médiane *reste*'
      voix_off: 'Les neuf salaires du café, et un dixième client dont on fait monter le salaire. À chaque position, on range à nouveau les dix salaires et on recalcule. À deux mille trois cents euros : moyenne deux mille deux cent dix, médiane deux mille deux cent cinquante. À cinquante mille : moyenne six mille neuf cent quatre-vingts, médiane toujours deux mille deux cent cinquante. À deux cent mille : moyenne vingt et un mille neuf cent quatre-vingts. La médiane ne bouge pas : dès deux mille trois cents euros, le dixième client se range après le sixième salaire, et les deux valeurs du milieu restent deux mille deux cents et deux mille trois cents.'
      verifier:
      - expression: (19800 + 2300) / 10
        attendu: 2210
        libelle: Moyenne à 2 300 €
      - expression: (19800 + 50000) / 10
        attendu: 6980
        libelle: Moyenne à 50 000 €
      - expression: (19800 + 200000) / 10
        attendu: 21980
        libelle: Moyenne à 200 000 €
      - expression: (2200 + 2300) / 2
        attendu: 2250
        libelle: Médiane dès 2 300 €
    - type: animation
      texte: 'Un salarié *déménage* : 44 → 120 minutes'
      univers: immersif
      animation:
        modele: curseur
        valeurs: *id001
        indice: 19
        vers: 120
        axe_max: 55
        unite: minutes
        decimales: 2
      etapes:
      - Les mêmes *20 salariés*
      - 'Médiane : *20 min*'
      - 'Moyenne : *21,25 min*'
      - '44 → 120 minutes : moyenne *25,05 min*, médiane *20 min*'
      voix_off: 'Retour à l''entreprise. On n''ajoute personne : le salarié qui mettait quarante-quatre minutes déménage et en met cent vingt. Ce sont toujours les mêmes vingt salariés. La moyenne passe de vingt et une minutes et quart à vingt-cinq minutes et cinq centièmes. La médiane reste à vingt minutes. Un seul individu a bougé, et seule la moyenne l''a suivi.'
      verifier:
      - expression: (425 - 44 + 120) / 20
        attendu: 25.05
        libelle: Moyenne après le déménagement
      - expression: (19 + 21) / 2
        attendu: 20
        libelle: Médiane des trajets
    - type: etapes
      texte: À retenir
      etapes:
      - Comparer des *fréquences*, pas des effectifs
      - 'Classes inégales : la *surface* compte'
      - Regarder la *forme* avant tout calcul
      - 'Moyenne : *partage égal* du total'
      - 'Médiane : coupe en *deux* ; queue à droite, moyenne au-dessus'
      voix_off: 'Ce qu''il faut retenir. Un : on compte, puis on rapporte au total ; on compare des fréquences, pas des effectifs. Deux : des barres séparées pour des catégories, un histogramme pour des nombres, et quand les classes sont inégales, c''est la surface qui compte. Trois : regardez la forme avant tout calcul ; deux bosses, c''est peut-être deux groupes. Quatre : la moyenne, c''est le total divisé par le nombre, ce qu''aurait chacun si l''on partageait également ; une seule valeur extrême la déplace. Cinq : la médiane coupe en deux ; avec une queue à droite, la moyenne est au-dessus de la médiane. Choisissez celle qui répond à votre question.'
    - type: exercice
      texte: '10 trajets : 5, 8, 12, 15, 15, 18, 22, 25, 30, *90* min. Part sous 20 min, forme, moyenne, médiane ?'
      pause: 15
      voix_off: 'À vous. Dix salariés d''une agence fictive mettent, en minutes : 5, 8, 12, 15, 15, 18, 22, 25, 30 et 90. Un : quelle part met moins de 20 minutes ? Deux : quelle forme a cette distribution ? Trois : calculez la moyenne et la médiane. Quatre : combien de salariés sont sous la moyenne, et quel nombre annonceriez-vous comme « trajet typique » ? Mettez la vidéo en pause.'
    - type: correction
      etapes:
      - 'Moins de 20 min : 6 sur 10, *60 %*'
      - 'Forme : *queue à droite* (le trajet de 90 min)'
      - 'Moyenne : 240 ÷ 10 = *24 min*'
      - 'Médiane : (15 + 18) ÷ 2 = *16,5 min*'
      voix_off: 'Un : 6 sur 10, soit 60 % (5, 8, 12, 15, 15 et 18). Deux : une queue à droite, due au trajet de 90 minutes. Trois : somme 240, moyenne 240 ÷ 10 = 24 minutes ; dix valeurs, donc la médiane est la moyenne des 5e et 6e : (15 + 18) ÷ 2 = 16,5 minutes.'
      verifier:
      - expression: 5+8+12+15+15+18+22+25+30+90
        attendu: 240
        libelle: Somme
      - expression: 240 / 10
        attendu: 24
        libelle: Moyenne
      - expression: (15 + 18) / 2
        attendu: 16.5
        libelle: Médiane
      - expression: 6 / 10 * 100
        attendu: 60
        libelle: Part sous 20 min
    - type: etapes
      texte: Correction (suite)
      etapes:
      - '7 sur 10 sous la moyenne : trajet typique *16,5 min*'
      - 'Si 90 était une erreur pour 35 : moyenne *18,5 min*, médiane inchangée'
      verifier:
      - expression: (240 - 90 + 35) / 10
        attendu: 18.5
        libelle: Moyenne si 90 était 35
      voix_off: 'Quatre : 7 salariés sur 10 sont sous la moyenne ; le trajet typique, c''est la médiane, 16,5 minutes. Pour aller plus loin : si les 90 minutes étaient une erreur de saisie pour 35, la moyenne tomberait à 18,5 minutes et la médiane ne bougerait pas.'
    - type: cloture
      texte: 'Prochain épisode : *les écarts*. Une question ? *En commentaire*'
      voix_off: 'Voilà : la prochaine fois qu''on vous annonce un salaire moyen ou un temps d''attente moyen, vous saurez quelle question poser. Mais deux équipes peuvent avoir la même médiane et des trajets très différents : c''est tout l''enjeu du prochain épisode, sur les écarts. Si cette vidéo vous a été utile, abonnez-vous, laissez un like et partagez-la avec quelqu''un à qui elle servira. Et si un exercice vous résiste, écrivez-nous en commentaire : on vous aide, gratuitement. Merci d''avoir regardé, et à très vite !'
    - type: fin
      texte: Éveiller par les chiffres.
      voix_off: ACTU-BASICS. Éveiller par les chiffres.
  en:
    titre: 'Mean, median, histogram: summarizing data without being fooled'
    legende: 'How do you summarize data without betraying it? A table keeps the proportions, a histogram the shape, the mean the total, the median the middle. Five chapters, two live labs, a worked summary exercise. Made-up data, checked calculations. Method sources: OpenStax, Introductory Statistics 2e, “Measures of the Center of the Data”; NIST/SEMATECH e-Handbook of Statistical Methods, “Histogram”. Stuck on an exercise? Ask in the comments.

      '
    hashtags:
    - statistics
    - mean
    - median
    - histogram
    scenes:
    - type: accroche
      texte: 'Twenty employees. *Which tells the truth*: the mean or the median?'
      voix_off: 'Twenty employees. One question: how long does it take them to get to work? The mean says just over 21 minutes. Yet half of them take 20 minutes or less. And if just one employee moves far away, the mean jumps… while almost nothing changes for anyone else. Which number tells the truth?'
    - type: accueil
      texte: Hi, and *welcome*!
      voix_off: 'Hi, and welcome! Thanks for being here. Salaries, grades, commuting times: we sum everything up with an average. In this episode, we''ll see when it tells the truth, when it misleads, and what to use instead.'
    - type: animation
      texte: What you'll *learn*
      animation:
        modele: apercu
        cartes:
        - icone: tableau
          texte: Build a frequency *table*
        - icone: histogramme
          texte: Choose and read a *histogram*
        - icone: forme
          texte: Recognise a distribution's *shape*
        - icone: equilibre
          texte: Compute a *mean*
        - icone: mediane
          texte: Find the *median*
        - icone: laboratoire
          texte: Test it in the *lab*, then practise
      voix_off: 'Here''s what you''ll be able to do by the end of this episode: build a frequency table; choose and read a histogram; recognise the shape of a distribution; compute a mean, and see why it''s a balance point; find a median; and check it all yourself, with two labs and a worked exercise.'
    - type: titre
      numero: '1'
      texte: 'Counting: counts, frequencies, cumulative'
      voix_off: 'A thousand answers to a survey: nobody is going to read them one by one. To learn the method, let''s start with a small class of twenty-five pupils. How do you sum up their answers?'
    - type: titre
      numero: '1.1'
      texte: 'Counting: the counts'
      voix_off: 'Step one is very simple: count.'
    - type: courbe
      texte: How many *brothers and sisters*? Class of 25
      courbe:
        style: barres
        points:
        - - 0
          - 5
        - - 1
          - 10
        - - 2
          - 6
        - - 3
          - 4
        etiquettes:
        - '0'
        - '1'
        - '2'
        - '3'
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Number of brothers and sisters
        axe_y: Count (pupils)
      note: Fictional class of 25 pupils.
      voix_off: We ask twenty-five pupils how many brothers and sisters they have. Five have none, ten have one, six have two and four have three. These numbers are called counts.
      verifier:
      - expression: 5 + 10 + 6 + 4
        attendu: 25
        libelle: Total count
    - type: texte
      texte: 'Always check the *total*: 5 + 10 + 6 + 4 = 25'
      voix_off: 'First habit: check the total. Five plus ten plus six plus four does make twenty-five. Without the total, a count doesn''t mean much.'
    - type: titre
      numero: '1.2'
      texte: 'Dividing by the total: frequencies'
      voix_off: 'Step two: divide each count by the total.'
    - type: formule
      texte: Frequency = count ÷ total
      formule:
      - \text{frequency}=\dfrac{\text{count}}{\text{total count}}
      - \dfrac{10}{25}=0.40=40\%
      voix_off: 'The frequency is the count divided by the total. For the pupils with one brother or sister: ten divided by twenty-five is zero point four zero, or forty percent.'
      verifier:
      - expression: 10 / 25 * 100
        attendu: 40
        libelle: Frequency of “1”, in %
    - type: etapes
      texte: The full table
      etapes:
      - '0: 5 pupils, or *20%*'
      - '1: 10 pupils, or *40%*'
      - '2: 6 pupils, or *24%*'
      - '3: 4 pupils, or *16%*'
      voix_off: 'Here is the full table. No brothers or sisters: five pupils, or twenty percent. One: ten pupils, or forty percent. Two: six pupils, or twenty-four percent. Three: four pupils, or sixteen percent.'
      verifier:
      - expression: 5 / 25 * 100
        attendu: 20
        libelle: Frequency of “0”, in %
      - expression: 6 / 25 * 100
        attendu: 24
        libelle: Frequency of “2”, in %
      - expression: 4 / 25 * 100
        attendu: 16
        libelle: Frequency of “3”, in %
      - expression: 20 + 40 + 24 + 16
        attendu: 100
        libelle: Total of frequencies, in %
    - type: texte
      texte: Frequencies always add up to *100%*
      voix_off: Frequencies always add up to one hundred percent. If they don't, someone is missing, or rounding got in the way.
    - type: titre
      numero: '1.3'
      texte: 'Adding up: cumulative frequencies'
      voix_off: 'Step three: cumulative frequencies.'
    - type: etapes
      texte: '*At most* so many brothers and sisters'
      etapes:
      - 'At most 0: *20%*'
      - 'At most 1: 20 + 40 = *60%*'
      - 'At most 2: 60 + 24 = *84%*'
      - 'At most 3: 84 + 16 = *100%*'
      voix_off: 'We add the frequencies as we go. At most zero brothers or sisters: twenty percent. At most one: twenty plus forty, sixty percent. At most two: sixty plus twenty-four, eighty-four percent. At most three: one hundred percent, the whole class.'
      verifier:
      - expression: 20 + 40
        attendu: 60
        libelle: Cumulative up to 1
      - expression: 20 + 40 + 24
        attendu: 84
        libelle: Cumulative up to 2
    - type: chiffre
      valeur: 84
      suffixe:
        fr: ' %'
        en: '%'
      texte: of pupils have *at most two* brothers and sisters
      note: 'Cumulating follows the order of the values: it makes sense here because 0, 1, 2, 3 are ordered.'
      voix_off: 'One sentence now sums up the class: eighty-four percent of the pupils have at most two brothers and sisters. Cumulating makes sense here because the values come in order.'
    - type: titre
      numero: '1.4'
      texte: 'The trap: comparing counts'
      voix_off: One last point, and it is the most common trap.
    - type: etapes
      texte: Two classes, *two sizes*
      etapes:
      - 'Class A, 25 pupils: 10 have one brother or sister, *40%*'
      - 'Class B, 40 pupils: 12 have one, *30%*'
      voix_off: Let's compare two classes. In class A, with twenty-five pupils, ten have exactly one brother or sister, or forty percent. In class B, with forty pupils, there are twelve, only thirty percent.
      verifier:
      - expression: 12 / 40 * 100
        attendu: 30
        libelle: Class B, in %
    - type: texte
      texte: 12 is more than 10, but *30% is less than 40%*
      voix_off: Twelve is more than ten. But relative to the size of the class, it is less. To compare groups of different sizes, compare frequencies, not counts.
    - type: exercice
      texte: '20 employees: *8 car*, *6 public transport*, *4 bike*, *2 walk*. Frequencies and cumulative?'
      pause: 8
      voix_off: 'Your turn. Twenty employees say how they get to work: eight by car, six by public transport, four by bike and two on foot. Work out the frequencies, then the cumulative frequencies.'
    - type: correction
      etapes:
      - Car 8 ÷ 20 = *40%*, public transport 6 ÷ 20 = *30%*
      - Bike 4 ÷ 20 = *20%*, walk 2 ÷ 20 = *10%*
      - 'Cumulative, from car to walking: 40, 70, 90, 100%'
      reponse: Total 100%, cumulative in the chosen order
      voix_off: 'Here''s the answer. Car: eight divided by twenty, forty percent; public transport: thirty percent. Bike: twenty percent; walking: ten percent. Adding up in this order: forty, seventy, ninety, then one hundred percent. Careful: ways of getting to work have no natural order. The cumulative figures depend on the order chosen, here from most to least common.'
      verifier:
      - expression: 8 / 20 * 100
        attendu: 40
        libelle: Car, in %
      - expression: 6 / 20 * 100
        attendu: 30
        libelle: Public transport, in %
      - expression: 4 / 20 * 100
        attendu: 20
        libelle: Bike, in %
      - expression: 2 / 20 * 100
        attendu: 10
        libelle: Walk, in %
      - expression: 40 + 30 + 20
        attendu: 90
        libelle: Cumulative up to bike
    - type: texte
      texte: Keep these *20 employees* in mind
      voix_off: 'Keep these twenty employees in mind: we''ll follow them to the end of the episode. First, let''s draw their answers.'
    - type: titre
      numero: '2'
      texte: 'Drawing: bar chart or histogram'
      voix_off: Two charts made of bars. On one, the bars touch; on the other, they don't. That detail changes how you read them.
    - type: titre
      numero: '2.1'
      texte: 'The bar chart: categories'
      voix_off: Let's start with the bar chart.
    - type: courbe
      texte: How *20 employees* get to work
      courbe:
        style: barres
        points:
        - - 0
          - 8
        - - 1
          - 6
        - - 2
          - 4
        - - 3
          - 2
        etiquettes:
        - Car
        - Public transport
        - Bike
        - Walk
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Way of getting to work
        axe_y: Count (employees)
      note: Fictional company of 20 employees (chapter 1 exercise).
      voix_off: 'Here are the twenty employees from the chapter 1 exercise. One bar for each way of getting to work: car, public transport, bike, walking. The bars are separate, because these are distinct categories. You could put them in another order without changing the meaning.'
      verifier:
      - expression: 8 + 6 + 4 + 2
        attendu: 20
        libelle: Total employees
    - type: titre
      numero: '2.2'
      texte: 'The histogram: numbers in classes'
      voix_off: 'Now let''s take a numerical variable: commuting time, in minutes.'
    - type: courbe
      texte: Commuting time, *10-minute classes*
      courbe:
        style: histogramme
        points:
        - - 0
          - 3
        - - 10
          - 7
        - - 20
          - 6
        - - 30
          - 3
        - - 40
          - 1
        largeur_classe: 10
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Commuting time (minutes)
        axe_y: Count (employees)
      note: Fictional commuting times of the same 20 employees.
      voix_off: 'We group the commuting times into ten-minute classes. Three employees take under ten minutes, seven between ten and twenty, six between twenty and thirty, three between thirty and forty, and just one between forty and fifty. This time the bars touch: minutes run on continuously, with no gap between classes. Each bin includes its left edge but not its right one: a 20-minute trip counts in the 20-to-30 bin.'
      verifier:
      - expression: 3 + 7 + 6 + 3 + 1
        attendu: 20
        libelle: Total, 10-minute classes
    - type: courbe
      texte: The same times, *20-minute classes*
      courbe:
        style: histogramme
        points:
        - - 0
          - 10
        - - 20
          - 9
        - - 40
          - 1
        largeur_classe: 20
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Commuting time (minutes)
        axe_y: Count (employees)
      voix_off: These are exactly the same data, grouped into twenty-minute classes. Ten employees take under twenty minutes, nine between twenty and forty, only one over forty. The peak between ten and twenty minutes has vanished.
      verifier:
      - expression: 3 + 7
        attendu: 10
        libelle: Class 0 to 20 minutes
      - expression: 6 + 3
        attendu: 9
        libelle: Class 20 to 40 minutes
    - type: texte
      texte: The choice of classes *changes the shape*
      voix_off: The choice of classes changes the shape. Too wide, and they hide the details. Too narrow, and they show bumps that are just chance. When you see a histogram, always check the width of the classes.
    - type: titre
      numero: '2.3'
      texte: 'Unequal widths: area = count'
      voix_off: 'One last trap: classes of different widths.'
    - type: courbe
      texte: '*Misleading build*: height = count, unequal classes'
      courbe:
        style: histogramme
        points:
        - - 0
          - 3
        - - 10
          - 7
        - - 20
          - 10
        largeur_classe: 30
        valeurs: true
        y_min: 0
        y_max: 12
        axe_x: Commuting time (minutes)
        axe_y: Count (employees)
      voix_off: 'Now let''s put everything over twenty minutes into a single class, from twenty to fifty. It holds ten employees. If we use the count as the height, this big bar dwarfs the rest: long commutes seem to dominate.'
      verifier:
      - expression: 6 + 3 + 1
        attendu: 10
        libelle: Class 20 to 50 minutes
    - type: formule
      texte: 'The right height: *density*'
      formule:
      - \text{density}=\dfrac{\text{count}}{\text{class width}}
      - \dfrac{10}{30}\approx 0.33\ \text{employee per minute}
      voix_off: 'In a histogram, the area stands for the count. So the height must be a density: the count divided by the width of the class. For the class from twenty to fifty minutes: ten divided by thirty, about zero point three three employee per minute.'
      verifier:
      - expression: 10 / 30
        attendu: 0.33
        libelle: Density of class 20 to 50 minutes
      - expression: 3 / 10
        attendu: 0.3
        libelle: Density of class 0 to 10 minutes
