# Phase pilote ACTU-BASICS, vidéo 4 sur 5 : Q3.01 « Pourquoi votre bus arrive toujours en retard »
# Fiche de conception : contenus/conception/Q3.01.yaml
# Calcul pur (paradoxe de l'inspection). Hypothèse : le voyageur arrive à un instant au hasard,
# sans consulter les horaires. Aucun fait extérieur chiffré.
# Statut : brouillon. Relecture de ChatGPT, puis validation de JG. Rien n'est publié.
id: 2026-11-pilote-q3-01-paradoxe-du-bus
type_fiche: pedagogique
famille: comprendre_les_probabilites
format: educational
habillage_sonore: true
theme: "Q3.01 · Le paradoxe du bus"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Expliquer le paradoxe de l'inspection : on tombe plus souvent dans les longs intervalles"
      - "Calculer l'attente moyenne quand les intervalles entre bus valent 5 et 15 minutes"
      - "Repérer d'autres situations où ce biais apparaît"
    en:
      - "Explain the inspection paradox: you are more likely to land in a long gap"
      - "Work out the average wait when the gaps between buses are 5 and 15 minutes"
      - "Spot other situations where the same bias shows up"
  prerequis:
    fr: ["S2.04 : la moyenne", "Lire une fraction"]
    en: ["S2.04: the mean", "Reading a fraction"]
  hypotheses:
    fr: "Le voyageur arrive à un instant pris au hasard, sans regarder les horaires ; les bus alternent des intervalles de 5 et de 15 minutes"
    en: "The rider turns up at a random moment, without checking the timetable; buses alternate gaps of 5 and 15 minutes"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

editions:
  fr:
    titre: "Pourquoi votre bus semble toujours en retard"
    legende: |
      Un bus toutes les 10 minutes en moyenne : on devrait attendre 5 minutes en moyenne. Pourtant, si les bus sont irréguliers, l'attente moyenne dépasse 6 minutes. La raison : on a plus de chances d'arriver pendant un long intervalle que pendant un court. C'est le paradoxe de l'inspection, qu'on retrouve aussi dans la taille des classes ou les files d'attente. Calculs vérifiés ; hypothèse : on arrive à l'arrêt à un instant pris au hasard.
    hashtags: [probabilites, paradoxe, statistiques]
    scenes:
      - type: accroche
        texte: "Un bus toutes les *10 minutes* en moyenne. Pourquoi attend-on *plus de 5 minutes* ?"
        voix_off: "Un bus passe toutes les dix minutes en moyenne. On devrait donc attendre cinq minutes en moyenne. Alors pourquoi a-t-on si souvent l'impression d'attendre plus longtemps ?"
      - type: texte
        texte: "Si les bus sont *parfaitement réguliers*, l'attente moyenne est bien de *5 minutes*"
        note: "Hypothèse : on arrive à l'arrêt à un instant pris au hasard, sans regarder les horaires."
        voix_off: "Commençons par le cas simple. Si un bus passe exactement toutes les dix minutes, et que vous arrivez à un moment pris au hasard, vous attendez entre zéro et dix minutes. En moyenne, cinq minutes : la moitié de l'intervalle."
        verifier:
          - {expression: "10 / 2", attendu: 5, libelle: "Attente moyenne, bus réguliers, en min"}
      - type: etapes
        texte: "Mais les bus *ne sont pas réguliers*"
        etapes:
          - "Un intervalle de *5 minutes*"
          - "Puis un intervalle de *15 minutes*"
          - "Et ainsi de suite : en moyenne, toujours *10 minutes*"
        voix_off: "Dans la réalité, les bus se rattrapent et se suivent de près. Imaginons qu'ils alternent : d'abord un intervalle de cinq minutes. Puis un intervalle de quinze minutes. Et ainsi de suite. L'intervalle moyen vaut toujours dix minutes."
        verifier:
          - {expression: "(5 + 15) / 2", attendu: 10, libelle: "Intervalle moyen, en min"}
      - type: exercice
        texte: "Bus toutes les 5 puis 15 minutes. L'attente moyenne est-elle *plus courte*, *égale* ou *plus longue* que 5 minutes ?"
        etiquette: "DÉFI"
        pause: 5
        voix_off: "À votre avis, avec ces bus irréguliers, l'attente moyenne est-elle plus courte, égale, ou plus longue que cinq minutes ?"
      - type: titre
        numero: 1
        texte: "Où tombe-t-on ?"
        voix_off: "Pour répondre, il faut se demander dans quel intervalle on a des chances d'arriver."
      - type: etapes
        texte: "Sur 20 minutes, le long intervalle occupe *15 minutes*"
        etapes:
          - "Court intervalle : 5 min sur 20, soit *25 %* des chances"
          - "Long intervalle : 15 min sur 20, soit *75 %* des chances"
        voix_off: "Regardons une période de vingt minutes : un court intervalle, puis un long. Si vous arrivez au hasard, vous tombez dans le court intervalle avec une probabilité de cinq sur vingt, soit vingt-cinq pour cent. Et dans le long intervalle avec une probabilité de quinze sur vingt, soit soixante-quinze pour cent."
        verifier:
          - {expression: "100 * 5 / 20", attendu: 25, libelle: "Chances de tomber dans le court intervalle, en %"}
          - {expression: "100 * 15 / 20", attendu: 75, libelle: "Chances de tomber dans le long intervalle, en %"}
      - type: texte
        texte: "Les longs intervalles *durent plus longtemps* : on a donc plus de chances d'y arriver"
        voix_off: "C'est tout le paradoxe. Il y a autant de longs intervalles que de courts. Mais les longs durent plus longtemps, donc on a beaucoup plus de chances d'arriver pendant l'un d'eux."
      - type: titre
        numero: 2
        texte: "L'attente moyenne"
        voix_off: "Calculons maintenant l'attente moyenne."
      - type: etapes
        texte: "Dans chaque intervalle, on attend *la moitié* en moyenne"
        etapes:
          - "Court intervalle : *2,5 minutes* d'attente"
          - "Long intervalle : *7,5 minutes* d'attente"
        voix_off: "Une fois dans un intervalle, on attend en moyenne la moitié de sa durée. Dans un intervalle de cinq minutes, deux minutes et demie. Dans un intervalle de quinze minutes, sept minutes et demie."
      - type: formule
        texte: "On pondère par les chances"
        formule:
          - '0{,}25\times 2{,}5+0{,}75\times 7{,}5'
          - '=0{,}625+5{,}625'
          - '=6{,}25\ \mathrm{min}'
        voix_off: "On combine les deux, chacun avec ses chances. Vingt-cinq pour cent de chances d'attendre deux minutes et demie, plus soixante-quinze pour cent de chances d'attendre sept minutes et demie. Cela fait zéro virgule six cent vingt-cinq, plus cinq virgule six cent vingt-cinq : six minutes et quart."
        verifier:
          - {expression: "0.25 * 2.5 + 0.75 * 7.5", attendu: 6.25, libelle: "Attente moyenne, en min"}
      - type: chiffre
        valeur: 6.25
        decimales: 2
        suffixe: {fr: " min", en: " min"}
        texte: "d'attente moyenne, au lieu de *5 minutes*"
        note: "Pour le même bus toutes les 10 minutes en moyenne."
        voix_off: "Réponse au défi : l'attente moyenne est plus longue. Six minutes et quart au lieu de cinq, pour le même nombre de bus. Rien n'a changé dans l'horaire moyen : seule la régularité a changé."
        verifier:
          - {expression: "(5 ** 2 + 15 ** 2) / 2 / (2 * 10)", attendu: 6.25, libelle: "Attente moyenne par la formule générale, en min"}
      - type: texte
        texte: "Plus les bus sont *irréguliers*, plus on attend"
        note: "Processus de Poisson (intervalles exponentiels de moyenne 10 min) : 10 min d'attente moyenne."
        voix_off: "Et plus les bus sont irréguliers, plus l'attente moyenne s'allonge. Si les passages suivaient un processus de Poisson, c'est-à-dire des intervalles exponentiels de dix minutes en moyenne, vous attendriez en moyenne dix minutes. C'est l'objet d'une autre vidéo, sur la loi exponentielle."
      - type: exercice
        texte: "Les intervalles valent maintenant *2* et *18 minutes*. Quelle est l'attente moyenne ?"
        pause: 8
        voix_off: "À vous. Les bus alternent maintenant des intervalles de deux minutes et de dix-huit minutes. L'intervalle moyen vaut toujours dix minutes. Quelle est l'attente moyenne ?"
        verifier:
          - {expression: "(2 + 18) / 2", attendu: 10, libelle: "Intervalle moyen de l'exercice, en min"}
      - type: correction
        etapes:
          - "Chances : 2 sur 20 = 10 % ; 18 sur 20 = 90 %"
          - "Attentes : 1 min et 9 min"
          - "0,1 × 1 + 0,9 × 9 = 8,2"
        reponse: "8,2 minutes en moyenne"
        voix_off: "On tombe dans le court intervalle avec dix pour cent de chances, dans le long avec quatre-vingt-dix pour cent. On y attend en moyenne une minute, et neuf minutes. Zéro virgule un fois un, plus zéro virgule neuf fois neuf : huit virgule deux. L'attente moyenne est de huit minutes et douze secondes."
        verifier:
          - {expression: "0.1 * 1 + 0.9 * 9", attendu: 8.2, libelle: "Attente moyenne de l'exercice, en min"}
          - {expression: "0.2 * 60", attendu: 12, libelle: "0,2 min en secondes"}
      - type: titre
        numero: 3
        texte: "Ailleurs que dans le bus"
        voix_off: "Ce biais apparaît dès qu'on observe le monde à travers ce qu'on vit."
      - type: etapes
        texte: "Le *paradoxe de l'inspection*, partout"
        etapes:
          - "Un élève pris au hasard est plus souvent dans une classe *chargée*"
          - "Au hasard d'une visite, on croise surtout les *habitués*"
          - "Interrogés à un instant donné, les malades ont surtout des maladies *longues*"
        voix_off: "On retrouve le même mécanisme dans bien d'autres situations. Un élève choisi au hasard se trouve plus souvent dans une grande classe : vue par les élèves, la taille moyenne des classes dépasse donc la moyenne calculée classe par classe. Dans une salle de sport, au hasard d'une visite, on croise surtout ceux qui y vont souvent. Et si l'on interroge les malades présents un jour donné dans un hôpital, on trouve surtout des maladies longues, qui restent plus longtemps."
      - type: etapes
        texte: "Ce qu'il faut retenir"
        etapes:
          - "On tombe plus souvent dans les *longs* intervalles"
          - "Attente moyenne : chaque intervalle *pondéré par sa durée*"
          - "Irrégularité = attente *plus longue*, à moyenne égale"
        voix_off: "Récapitulons. Un : en arrivant au hasard, on tombe plus souvent dans les longs intervalles. Deux : pour l'attente moyenne, chaque intervalle compte selon sa durée. Trois : à intervalle moyen égal, plus les bus sont irréguliers, plus on attend."
      - type: fin
        texte: "Abonnez-vous pour comprendre les probabilités du quotidien."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "Why your bus always seems late"
    legende: |
      A bus every 10 minutes on average: you'd expect to wait 5 minutes on average. But if buses run irregularly, the average wait goes above 6 minutes. Why? You're more likely to turn up during a long gap than a short one. It's the inspection paradox, and it also shows up in class sizes and waiting lines. All numbers checked; assumption: you arrive at the stop at a random moment.
    hashtags: [probability, paradox, statistics]
    scenes:
      - type: accroche
        texte: "A bus every *10 minutes* on average. So why do you wait *more than 5*?"
        voix_off: "A bus comes every ten minutes on average. So you should wait five minutes on average. Why does it so often feel like longer?"
      - type: texte
        texte: "If buses are *perfectly regular*, the average wait really is *5 minutes*"
        note: "Assumption: you turn up at a random moment, without checking the timetable."
        voix_off: "Let's start with the simple case. If a bus comes exactly every ten minutes, and you turn up at a random moment, you wait anywhere from zero to ten minutes. On average, five minutes: half the gap."
        verifier:
          - {expression: "10 / 2", attendu: 5, libelle: "Average wait, regular buses, min"}
      - type: etapes
        texte: "But buses *aren't regular*"
        etapes:
          - "A gap of *5 minutes*"
          - "Then a gap of *15 minutes*"
          - "And so on: still *10 minutes* on average"
        voix_off: "In real life, buses catch up with each other and bunch together. Let's say they alternate: first a gap of five minutes. Then a gap of fifteen minutes. And so on. The average gap is still ten minutes."
        verifier:
          - {expression: "(5 + 15) / 2", attendu: 10, libelle: "Average gap, min"}
      - type: exercice
        texte: "Buses every 5, then 15 minutes. Is the average wait *shorter*, *the same* or *longer* than 5 minutes?"
        etiquette: "CHALLENGE"
        pause: 5
        voix_off: "What do you think? With these irregular buses, is the average wait shorter than five minutes, the same, or longer?"
      - type: titre
        numero: 1
        texte: "Where do you land?"
        voix_off: "To answer, ask yourself which gap you're likely to turn up in."
      - type: etapes
        texte: "Out of 20 minutes, the long gap takes up *15*"
        etapes:
          - "Short gap: 5 min out of 20, a *25%* chance"
          - "Long gap: 15 min out of 20, a *75%* chance"
        voix_off: "Look at a twenty-minute stretch: one short gap, then one long gap. If you turn up at random, you land in the short gap with a probability of five out of twenty, or twenty-five percent. And in the long gap with a probability of fifteen out of twenty, or seventy-five percent."
        verifier:
          - {expression: "100 * 5 / 20", attendu: 25, libelle: "Chance of landing in the short gap, %"}
          - {expression: "100 * 15 / 20", attendu: 75, libelle: "Chance of landing in the long gap, %"}
      - type: texte
        texte: "Long gaps *last longer*, so you're more likely to land in one"
        voix_off: "That's the whole paradox. There are as many long gaps as short ones. But the long ones last longer, so you're far more likely to turn up during one of them."
      - type: titre
        numero: 2
        texte: "The average wait"
        voix_off: "Now let's work out the average wait."
      - type: etapes
        texte: "Within a gap, you wait *half of it* on average"
        etapes:
          - "Short gap: a *2.5-minute* wait"
          - "Long gap: a *7.5-minute* wait"
        voix_off: "Once you're in a gap, you wait half of it on average. In a five-minute gap, two and a half minutes. In a fifteen-minute gap, seven and a half minutes."
      - type: formule
        texte: "Weight each by its chance"
        formule:
          - '0.25\times 2.5+0.75\times 7.5'
          - '=0.625+5.625'
          - '=6.25\ \mathrm{min}'
        voix_off: "Combine the two, each with its own chance. A twenty-five percent chance of waiting two and a half minutes, plus a seventy-five percent chance of waiting seven and a half. That's zero point six two five, plus five point six two five: six and a quarter minutes."
        verifier:
          - {expression: "0.25 * 2.5 + 0.75 * 7.5", attendu: 6.25, libelle: "Average wait, min"}
      - type: chiffre
        valeur: 6.25
        decimales: 2
        suffixe: {fr: " min", en: " min"}
        texte: "average wait, instead of *5 minutes*"
        note: "For the same bus every 10 minutes on average."
        voix_off: "So here's the answer: the average wait is longer. Six and a quarter minutes instead of five, with the same number of buses. The average timetable hasn't changed. Only the regularity has."
        verifier:
          - {expression: "(5 ** 2 + 15 ** 2) / 2 / (2 * 10)", attendu: 6.25, libelle: "Average wait from the general formula, min"}
      - type: texte
        texte: "The more *irregular* the buses, the longer you wait"
        note: "Poisson process (exponential gaps averaging 10 min): a 10-minute average wait."
        voix_off: "And the more irregular the buses, the longer the average wait. If arrivals followed a Poisson process, meaning exponential gaps that average ten minutes, you'd wait ten minutes on average. That's the subject of another video, on the exponential distribution."
      - type: exercice
        texte: "Now the gaps are *2* and *18 minutes*. What's the average wait?"
        pause: 8
        voix_off: "Your turn. The buses now alternate gaps of two minutes and eighteen minutes. The average gap is still ten minutes. What's the average wait?"
        verifier:
          - {expression: "(2 + 18) / 2", attendu: 10, libelle: "Average gap in the exercise, min"}
      - type: correction
        etapes:
          - "Chances: 2 out of 20 = 10%; 18 out of 20 = 90%"
          - "Waits: 1 min and 9 min"
          - "0.1 × 1 + 0.9 × 9 = 8.2"
        reponse: "8.2 minutes on average"
        voix_off: "You land in the short gap with a ten percent chance, and in the long gap with a ninety percent chance. The average waits there are one minute and nine minutes. Zero point one times one, plus zero point nine times nine: eight point two. The average wait is eight minutes and twelve seconds."
        verifier:
          - {expression: "0.1 * 1 + 0.9 * 9", attendu: 8.2, libelle: "Average wait in the exercise, min"}
          - {expression: "0.2 * 60", attendu: 12, libelle: "0.2 min in seconds"}
      - type: titre
        numero: 3
        texte: "Beyond the bus stop"
        voix_off: "This bias shows up whenever we see the world through what we happen to experience."
      - type: etapes
        texte: "The *inspection paradox* is everywhere"
        etapes:
          - "A student picked at random is more often in a *big* class"
          - "Drop by a gym at random: you mostly meet the *regulars*"
          - "Survey patients on a given day: you mostly find *long* illnesses"
        voix_off: "The same mechanism turns up in many other places. A student picked at random is more likely to be in a big class: seen from the students' side, the average class size is larger than the average worked out class by class. Drop by a gym at a random moment, and you'll mostly meet the people who go often. And if you survey the patients in a hospital on a given day, you'll mostly find long illnesses, because those patients stay longer."
      - type: etapes
        texte: "Key takeaways"
        etapes:
          - "You land in *long* gaps more often"
          - "Average wait: weight each gap *by its length*"
          - "Irregular = *longer* wait, for the same average"
        voix_off: "Let's recap. One: turning up at random, you land in long gaps more often. Two: for the average wait, each gap counts according to its length. Three: for the same average gap, the more irregular the buses, the longer you wait."
      - type: fin
        texte: "Follow to make sense of everyday probability."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
