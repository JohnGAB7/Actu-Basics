# Niveau 1, vague 1, lot 2 : S1.11 « Premier contact avec le hasard : chance, fréquence, risque » (EDUCATIONAL)
# Fiche de conception : contenus/conception/S1.11.yaml
# Aucun chiffre extérieur : dé équilibré, pays fictif de 60 millions d'habitants. Probabilités recalculées
# (loi binomiale pour les 60 lancers, complément pour « au moins une fois en 10 essais »).
# Statut : brouillon, script à valider avant tout rendu (règle de JG, 2026-11-07).
# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s1-11-premier-contact-avec-le-hasard
type_fiche: pedagogique
famille: comprendre_les_probabilites
format: educational
habillage_sonore: true
theme: "S1.11 · Premier contact avec le hasard"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Exprimer une chance sous forme de fraction, de fréquence et de pourcentage"
      - "Expliquer avec un exemple pourquoi deux échantillons de la même population donnent des résultats différents"
      - "Distinguer « rare » et « impossible »"
    en:
      - "Express a chance as a fraction, a frequency and a percentage"
      - "Explain with an example why two samples from the same population give different results"
      - "Tell “rare” from “impossible”"
  prerequis:
    fr: ["S1.08 : pourcentages et points"]
    en: ["S1.08: percentages and points"]
  hypotheses:
    fr: "Dé équilibré, lancers indépendants ; essais indépendants à une chance sur dix ; pays fictif de 60 millions d'habitants"
    en: "Fair die, independent throws; independent tries with a one-in-ten chance; fictional country of 60 million people"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

sources: []

editions:
  fr:
    titre: "« Une chance sur dix », ça veut dire quoi ?"
    legende: |
      Une chance sur dix, ce n'est pas « au dixième essai ». On apprend à écrire une chance de trois façons, fraction, fréquence et pourcentage, à comprendre pourquoi 60 lancers de dé ne donnent presque jamais exactement 10 six, et pourquoi un événement rare pour chacun arrive tous les jours à quelqu'un. Exemples fictifs, calculs vérifiés. Série « Lire un chiffre sans se faire avoir ».
    hashtags: [probabilites, hasard, statistiques]
    scenes:
      - type: accroche
        texte: "« Une chance sur dix » : *ça veut dire quoi* ?"
        voix_off: "Une chance sur dix. On l'entend partout. Mais qu'est-ce que ça veut dire, exactement ?"
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Une chance, trois écritures"
        voix_off: "Une même chance peut s'écrire de trois façons."
      - type: etapes
        texte: "Une chance sur dix, c'est…"
        etapes:
          - "Une *fraction* : 1 sur 10"
          - "Une *fréquence* : 100 fois sur 1 000 situations semblables"
          - "Un *pourcentage* : 10 %"
        voix_off: "Voici les trois. Une fraction : un sur dix. Une fréquence : sur mille situations semblables, cela arrive environ cent fois. Un pourcentage : dix pour cent."
        verifier:
          - {expression: "1 / 10 * 1000", attendu: 100, libelle: "1 sur 10, sur 1 000 situations"}
          - {expression: "1 / 10 * 100", attendu: 10, libelle: "1 sur 10, en %"}
      - type: texte
        texte: "La fréquence est la plus *parlante*"
        voix_off: "La fréquence est souvent la plus parlante. Imaginez mille personnes dans la même situation : combien vivront l'événement ?"
      - type: texte
        texte: "Une chance sur dix *ne veut pas dire* « au dixième essai »"
        voix_off: "Attention à un contresens fréquent : une chance sur dix ne veut pas dire que cela arrivera au dixième essai."
      - type: chiffre
        valeur: 65
        suffixe: {fr: " %", en: "%"}
        texte: "de chances de l'obtenir *au moins une fois* en 10 essais"
        note: "1 − 0,9¹⁰ ≈ 0,65 : 35 % de chances de ne jamais l'obtenir en 10 essais."
        voix_off: "En dix essais, on a environ soixante-cinq pour cent de chances de l'obtenir au moins une fois. Il reste donc trente-cinq pour cent de chances de ne jamais l'obtenir. Le hasard n'a pas de mémoire."
        verifier:
          - {expression: "100 * (1 - 0.9 ** 10)", attendu: 65, libelle: "Au moins une fois en 10 essais, en %"}
          - {expression: "100 * 0.9 ** 10", attendu: 35, libelle: "Jamais en 10 essais, en %"}
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "Le hasard dans les données"
        voix_off: "Le hasard n'est pas seulement dans les jeux. Il est aussi dans chaque chiffre tiré d'un échantillon."
      - type: etapes
        texte: "Lancer un dé *60 fois*"
        etapes:
          - "On attend *10 six* en moyenne"
          - "Mais on en obtient 8, 11, 13…"
        voix_off: "Lançons un dé soixante fois. En moyenne, on attend dix six, puisque soixante divisé par six fait dix. Mais en pratique, on en obtient huit, onze, treize : rarement dix tout pile."
        verifier:
          - {expression: "60 / 6", attendu: 10, libelle: "Nombre moyen de six en 60 lancers"}
      - type: chiffre
        valeur: 13.7
        suffixe: {fr: " %", en: "%"}
        texte: "de chances d'obtenir *exactement 10 six*"
        note: "Loi binomiale : C(60, 10) × (1/6)¹⁰ × (5/6)⁵⁰ ≈ 13,7 %."
        voix_off: "La probabilité d'obtenir exactement dix six est d'environ treize virgule sept pour cent seulement. Dans près de neuf cas sur dix, on obtient un autre nombre."
        verifier:
          - {expression: "100 * comb(60, 10) * (1/6)**10 * (5/6)**50", attendu: 13.7, libelle: "Exactement 10 six en 60 lancers, en %"}
      - type: texte
        texte: "Deux sondages le même jour : *deux résultats différents*"
        voix_off: "C'est la même chose pour un sondage. Deux instituts interrogent chacun mille personnes le même jour, dans la même population : ils obtiennent des résultats un peu différents. Ce n'est pas forcément une erreur : c'est le hasard de l'échantillon."
      # ---------------------------------------------------------------- 3
      - type: titre
        numero: 3
        texte: "Rare n'est pas impossible"
        voix_off: "Dernière idée : rare ne veut pas dire impossible."
      - type: formule
        texte: "Un risque d'*un sur un million*, dans un pays de 60 millions"
        formule:
          - '60\,000\,000\times\dfrac{1}{1\,000\,000}=60'
        voix_off: "Prenons un événement qui touche une personne sur un million par an, dans un pays fictif de soixante millions d'habitants. Soixante millions fois un millionième : on attend environ soixante cas par an. Rare pour chacun, mais presque certain pour quelqu'un."
        verifier:
          - {expression: "60e6 / 1e6", attendu: 60, libelle: "Cas attendus par an"}
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "*1 risque sur 500*, *0,2 %*, *2 pour 1 000*, *20 sur 10 000* : laquelle est différente ?"
        pause: 7
        voix_off: "À vous. Quatre phrases : un risque sur cinq cents, zéro virgule deux pour cent, deux pour mille, vingt sur dix mille. Laquelle est différente des autres ?"
      - type: correction
        etapes:
          - "1 ÷ 500 = 0,002 = 0,2 %"
          - "2 ÷ 1 000 = 20 ÷ 10 000 = 0,2 %"
        reponse: "Aucune : les quatre valent 0,2 %"
        voix_off: "Faisons le calcul. Un divisé par cinq cents, c'est zéro virgule zéro zéro deux, soit zéro virgule deux pour cent. Deux pour mille et vingt sur dix mille donnent exactement la même chose. Aucune n'est différente : les quatre écritures valent zéro virgule deux pour cent. Ne vous laissez pas impressionner par le plus grand nombre."
        verifier:
          - {expression: "1 / 500 * 100", attendu: 0.2, libelle: "1 sur 500, en %"}
          - {expression: "2 / 1000 * 100", attendu: 0.2, libelle: "2 pour 1 000, en %"}
          - {expression: "20 / 10000 * 100", attendu: 0.2, libelle: "20 sur 10 000, en %"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "Une chance se lit comme une *fréquence*"
          - "Chaque échantillon contient *une part de hasard*"
          - "*Rare* pour chacun, *fréquent* pour tous"
        voix_off: "À retenir. Une chance se lit comme une fréquence : combien de fois sur mille ? Chaque chiffre tiré d'un échantillon contient une part de hasard. Et un événement rare pour chacun arrive souvent à quelqu'un."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "“A one-in-ten chance”: what does it mean?"
    legende: |
      A one-in-ten chance doesn't mean “on the tenth try”. We learn to write a chance in three ways, fraction, frequency and percentage, to see why 60 throws of a die almost never give exactly 10 sixes, and why an event that is rare for each person happens to someone every day. Fictional examples, checked calculations. Series "Reading numbers without being fooled".
    hashtags: [probability, chance, statistics]
    scenes:
      - type: accroche
        texte: "“A one-in-ten chance”: *what does it mean*?"
        voix_off: "A one-in-ten chance. You hear it everywhere. But what does it actually mean?"
      - type: titre
        numero: 1
        texte: "One chance, three ways to write it"
        voix_off: "The same chance can be written in three ways."
      - type: etapes
        texte: "A one-in-ten chance is…"
        etapes:
          - "A *fraction*: 1 in 10"
          - "A *frequency*: 100 times out of 1,000 similar situations"
          - "A *percentage*: 10%"
        voix_off: "Here are the three. A fraction: one in ten. A frequency: out of a thousand similar situations, it happens about a hundred times. A percentage: ten percent."
        verifier:
          - {expression: "1 / 10 * 1000", attendu: 100, libelle: "1 in 10, out of 1,000 situations"}
          - {expression: "1 / 10 * 100", attendu: 10, libelle: "1 in 10, %"}
      - type: texte
        texte: "The frequency is the most *telling*"
        voix_off: "The frequency is often the most telling. Picture a thousand people in the same situation: how many of them will experience the event?"
      - type: texte
        texte: "One in ten *doesn't mean* “on the tenth try”"
        voix_off: "Watch out for a common misreading: a one-in-ten chance doesn't mean it will happen on the tenth try."
      - type: chiffre
        valeur: 65
        suffixe: {fr: " %", en: "%"}
        texte: "chance of getting it *at least once* in 10 tries"
        note: "1 − 0.9¹⁰ ≈ 0.65: a 35% chance of never getting it in 10 tries."
        voix_off: "In ten tries, you have about a sixty-five percent chance of getting it at least once. That leaves a thirty-five percent chance of never getting it. Chance has no memory."
        verifier:
          - {expression: "100 * (1 - 0.9 ** 10)", attendu: 65, libelle: "At least once in 10 tries, %"}
          - {expression: "100 * 0.9 ** 10", attendu: 35, libelle: "Never in 10 tries, %"}
      - type: titre
        numero: 2
        texte: "Chance in the data"
        voix_off: "Chance isn't only in games. It's also in every number taken from a sample."
      - type: etapes
        texte: "Throwing a die *60 times*"
        etapes:
          - "We expect *10 sixes* on average"
          - "But we get 8, 11, 13…"
        voix_off: "Let's throw a die sixty times. On average, we expect ten sixes, since sixty divided by six is ten. But in practice, we get eight, eleven, thirteen: rarely exactly ten."
        verifier:
          - {expression: "60 / 6", attendu: 10, libelle: "Average number of sixes in 60 throws"}
      - type: chiffre
        valeur: 13.7
        suffixe: {fr: " %", en: "%"}
        texte: "chance of getting *exactly 10 sixes*"
        note: "Binomial distribution: C(60, 10) × (1/6)¹⁰ × (5/6)⁵⁰ ≈ 13.7%."
        voix_off: "The probability of getting exactly ten sixes is only about thirteen point seven percent. In almost nine cases out of ten, you get a different number."
        verifier:
          - {expression: "100 * comb(60, 10) * (1/6)**10 * (5/6)**50", attendu: 13.7, libelle: "Exactly 10 sixes in 60 throws, %"}
      - type: texte
        texte: "Two polls on the same day: *two different results*"
        voix_off: "It's the same with a poll. Two polling firms each ask a thousand people on the same day, in the same population: they get slightly different results. That's not necessarily a mistake: it's the chance of the sample."
      - type: titre
        numero: 3
        texte: "Rare isn't impossible"
        voix_off: "One last idea: rare doesn't mean impossible."
      - type: formule
        texte: "A *one-in-a-million* risk, in a country of 60 million"
        formule:
          - '60{,}000{,}000\times\dfrac{1}{1{,}000{,}000}=60'
        voix_off: "Take an event that affects one person in a million each year, in a fictional country of sixty million people. Sixty million times one millionth: we expect about sixty cases a year. Rare for each person, but almost certain for someone."
        verifier:
          - {expression: "60e6 / 1e6", attendu: 60, libelle: "Expected cases per year"}
      - type: exercice
        texte: "*1 risk in 500*, *0.2%*, *2 per 1,000*, *20 in 10,000*: which one is different?"
        pause: 7
        voix_off: "Your turn. Four phrases: a one-in-five-hundred risk, zero point two percent, two per thousand, twenty in ten thousand. Which one is different from the others?"
      - type: correction
        etapes:
          - "1 ÷ 500 = 0.002 = 0.2%"
          - "2 ÷ 1,000 = 20 ÷ 10,000 = 0.2%"
        reponse: "None: all four equal 0.2%"
        voix_off: "Let's work it out. One divided by five hundred is zero point zero zero two, or zero point two percent. Two per thousand and twenty in ten thousand give exactly the same. None of them is different: all four equal zero point two percent. Don't be impressed by the biggest number."
        verifier:
          - {expression: "1 / 500 * 100", attendu: 0.2, libelle: "1 in 500, %"}
          - {expression: "2 / 1000 * 100", attendu: 0.2, libelle: "2 per 1,000, %"}
          - {expression: "20 / 10000 * 100", attendu: 0.2, libelle: "20 in 10,000, %"}
      - type: etapes
        texte: "Key takeaways"
        etapes:
          - "Read a chance as a *frequency*"
          - "Every sample contains *some chance*"
          - "*Rare* for each, *common* for all"
        voix_off: "Key takeaways. Read a chance as a frequency: how many times out of a thousand? Every number taken from a sample contains some chance. And an event that's rare for each person often happens to someone."
      - type: fin
        texte: "Follow to learn how to read numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
