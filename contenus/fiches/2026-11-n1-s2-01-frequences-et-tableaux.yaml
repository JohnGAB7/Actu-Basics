# Niveau 1, vague 1, lot 2 : S2.01 « Fréquences et tableaux » (EDUCATIONAL, démonstration)
# Fiche de conception : contenus/conception/S2.01.yaml
# Aucun chiffre extérieur : classe fictive de 25 élèves, entreprise fictive de 20 salariés (exercice du catalogue).
