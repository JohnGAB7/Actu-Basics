# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-s2-01-frequences-et-tableaux
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S2.01 · Fréquences et tableaux"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Construire un tableau d'effectifs et de fréquences"
      - "Calculer des fréquences cumulées"
      - "Comparer deux groupes de tailles différentes avec des fréquences, pas des effectifs"
    en:
      - "Build a table of counts and frequencies"
      - "Compute cumulative frequencies"
      - "Compare two groups of different sizes with frequencies, not counts"
  prerequis:
    fr: ["S1.03 : variables et types de données", "S1.08 : pourcentages et points"]
    en: ["S1.03: variables and types of data", "S1.08: percentages and points"]
  hypotheses:
