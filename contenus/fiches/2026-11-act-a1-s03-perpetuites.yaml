# Fil rouge (LMEC-DEC-020, docs/actuariat/FIL-ROUGE.md) : Léa choisit l'option d'indexation de 2 % par an de sa prime,
# puis on regarde quelle rente perpétuelle son capital pourrait financer (sans mortalité, qui arrive en A2 et A3).
# Faits réels : chiffres d'origine, devise d'origine dans les deux langues.
