pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Calculer la valeur accumulée sₙ d'une annuité, et la relier à aₙ"
      - "Évaluer une perpétuité, immédiate et due, et comprendre pourquoi elle vaut 1 ÷ i"
      - "Évaluer une annuité arithmétique croissante (Ia) et décroissante (Da), et vérifier avec (Ia) + (Da) = (n + 1) aₙ"
      - "Évaluer une annuité géométrique et une perpétuité indexée"
      - "Appliquer l'indexation aux primes d'un contrat d'épargne-pension"
    en:
      - "Compute the accumulated value sₙ of an annuity, and link it to aₙ"
      - "Value a perpetuity, immediate and due, and see why it is worth 1 ÷ i"
      - "Value an increasing (Ia) and a decreasing (Da) arithmetic annuity, and check with (Ia) + (Da) = (n + 1) aₙ"
      - "Value a geometric annuity and an indexed perpetuity"
      - "Apply indexation to the premiums of a pension savings contract"
  prerequis:
