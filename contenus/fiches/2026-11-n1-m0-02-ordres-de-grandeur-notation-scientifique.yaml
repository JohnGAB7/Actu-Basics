# Niveau 1, vague 1, lot 1 : M0.02 « Ordres de grandeur et notation scientifique » (EDUCATIONAL, rappel)
# Fiche de conception : contenus/conception/M0.02.yaml
# Aucun chiffre extérieur : conversions de durées (année de 365,25 jours) et exemples fictifs.
