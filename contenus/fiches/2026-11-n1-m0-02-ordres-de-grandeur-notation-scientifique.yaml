# Claude structure, ChatGPT relit, JG valide.
id: 2026-11-n1-m0-02-ordres-de-grandeur-notation-scientifique
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "M0.02 · Ordres de grandeur et notation scientifique"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Situer mille, un million et un milliard avec les puissances de 10"
      - "Écrire un nombre en notation scientifique"
      - "Comparer deux grandeurs par leur ordre de grandeur"
    en:
      - "Place a thousand, a million and a billion using powers of 10"
      - "Write a number in scientific notation"
      - "Compare two quantities by their order of magnitude"
  prerequis:
    fr: ["M0.01 : fractions et règle de trois"]
    en: ["M0.01: fractions and proportions"]
  hypotheses:
    fr: "Une année compte 365,25 jours en moyenne ; budgets de l'exemple fictifs"
    en: "A year has 365.25 days on average; the budgets in the example are fictional"

validation:
  statut: brouillon
  valide_par: ""
  date: ""

sources: []

editions:
  fr:
    titre: "Un milliard de secondes, c'est combien ? Ordres de grandeur"
    legende: |
      Un million de secondes, c'est environ 11,6 jours. Un milliard de secondes ? Près de 32 ans. Entre un million et un milliard, il y a un facteur mille que l'intuition écrase. On apprend à compter en puissances de 10, à écrire un nombre en notation scientifique et à comparer deux grandeurs par leur ordre de grandeur. Attention aussi au faux ami « billion ». Calculs vérifiés. Série « Lire un chiffre sans se faire avoir », boîte à outils.
    hashtags: [maths, ordresdegrandeur, chiffres]
    scenes:
      - type: accroche
        texte: "Un *million* de secondes, c'est environ *11,6 jours*"
        voix_off: "Un million de secondes, c'est environ onze jours et demi. Et un milliard de secondes ?"
        verifier:
          - {expression: "1e6 / 86400", attendu: 11.6, libelle: "Un million de secondes, en jours"}
      - type: exercice
        texte: "Un *milliard* de secondes : *12 jours*, *3 ans* ou *32 ans* ?"
        etiquette: "DÉFI"
        pause: 4
        voix_off: "Choisissez avant la suite : douze jours, trois ans, ou trente-deux ans ?"
      # ---------------------------------------------------------------- 1
      - type: titre
        numero: 1
        texte: "Compter en puissances de 10"
        voix_off: "Pour répondre, comptons les zéros."
      - type: etapes
        texte: "Chaque palier *multiplie par mille*"
        etapes:
          - "Mille = 1 000 = *10³*"
          - "Un million = 1 000 000 = *10⁶*"
          - "Un milliard = 1 000 000 000 = *10⁹*"
        voix_off: "Mille, c'est un suivi de trois zéros : dix puissance trois. Un million, six zéros : dix puissance six. Un milliard, neuf zéros : dix puissance neuf. À chaque palier, on multiplie par mille."
      - type: formule
        texte: "Un milliard = *mille millions*"
        formule:
          - '10^{9}=10^{3}\times 10^{6}'
        voix_off: "Un milliard, c'est donc mille millions. Si un million de secondes font onze jours et demi, un milliard en fait mille fois plus."
        verifier:
          - {expression: "1e9 / 1e6", attendu: 1000, libelle: "Un milliard divisé par un million"}
      - type: chiffre
        valeur: 31.7
        suffixe: {fr: " ans", en: " years"}
        texte: "pour un milliard de secondes"
        voix_off: "Réponse au défi : un milliard de secondes, c'est près de trente-deux ans. Le mot ne change que d'une lettre, mais l'écart est immense."
        note: "10⁹ s ÷ (365,25 × 86 400 s par an) ≈ 31,7 ans."
        verifier:
          - {expression: "1e9 / (365.25 * 86400)", attendu: 31.7, libelle: "Un milliard de secondes, en années"}
      # ---------------------------------------------------------------- 2
      - type: titre
        numero: 2
        texte: "La notation scientifique"
        voix_off: "Pour écrire les très grands et les très petits nombres sans compter les zéros, on utilise la notation scientifique."
      - type: formule
        texte: "Un nombre *entre 1 et 10*, fois une puissance de 10"
        formule:
          - '45\,000=4{,}5\times 10^{4}'
          - '0{,}003=3\times 10^{-3}'
        voix_off: "On écrit un nombre compris entre un et dix, multiplié par une puissance de dix. Quarante-cinq mille, c'est quatre virgule cinq fois dix puissance quatre : on a décalé la virgule de quatre rangs. Zéro virgule zéro zéro trois, c'est trois fois dix puissance moins trois : une puissance négative pour les nombres plus petits que un."
        verifier:
          - {expression: "4.5 * 10**4", attendu: 45000, libelle: "4,5 × 10⁴"}
          - {expression: "3 * 10**-3", attendu: 0.003, libelle: "3 × 10⁻³"}
      # ---------------------------------------------------------------- 3
      - type: titre
        numero: 3
        texte: "Comparer par l'ordre de grandeur"
        voix_off: "L'intérêt principal : comparer deux grandeurs d'un coup d'œil."
      - type: etapes
        texte: "Deux budgets *fictifs*"
        etapes:
          - "Projet A : 2 millions d'euros, soit *2 × 10⁶*"
          - "Projet B : 3 milliards d'euros, soit *3 × 10⁹*"
          - "Écart des puissances : 9 − 6 = *3 ordres de grandeur*"
        voix_off: "Prenons deux budgets fictifs. Le projet A coûte deux millions d'euros, deux fois dix puissance six. Le projet B coûte trois milliards, trois fois dix puissance neuf. Entre les puissances, il y a trois crans : trois ordres de grandeur, c'est-à-dire un facteur de l'ordre de mille."
      - type: chiffre
        valeur: 1500
        prefixe: "×"
        texte: "entre les deux budgets"
        voix_off: "Le calcul exact donne un facteur mille cinq cents. L'ordre de grandeur suffisait pour comprendre que ces deux projets ne jouent pas dans la même catégorie."
        note: "3 × 10⁹ ÷ (2 × 10⁶) = 1 500."
        verifier:
          - {expression: "3e9 / 2e6", attendu: 1500, libelle: "Rapport des deux budgets"}
      - type: texte
        texte: "Faux ami : *billion* en anglais = *milliard*"
        note: "En français, un billion vaut 10¹², mille milliards."
        voix_off: "Un piège classique quand on lit la presse étrangère : le mot anglais billion veut dire milliard. En français, un billion, c'est mille milliards. Une erreur de traduction, et le chiffre est multiplié par mille."
        verifier:
          - {expression: "1e12 / 1e9", attendu: 1000, libelle: "Billion français / milliard"}
      # ---------------------------------------------------------------- exercice
      - type: exercice
        texte: "Écrivez *52 millions* en notation scientifique"
        pause: 6
        voix_off: "À vous. Comment écrire cinquante-deux millions en notation scientifique ?"
      - type: correction
        etapes:
          - "52 000 000 : on place la virgule après le premier chiffre"
          - "5,2 : la virgule a reculé de 7 rangs"
        reponse: "5,2 × 10⁷"
        voix_off: "Cinquante-deux millions, c'est cinq, deux, puis six zéros. On place la virgule après le premier chiffre : cinq virgule deux. Elle a reculé de sept rangs. Réponse : cinq virgule deux fois dix puissance sept."
        verifier:
          - {expression: "5.2 * 10**7", attendu: 52000000, libelle: "5,2 × 10⁷"}
      - type: etapes
        texte: "À retenir"
        etapes:
          - "Mille, million, milliard : *×1 000* à chaque palier"
          - "Notation scientifique : un nombre *entre 1 et 10* × 10ⁿ"
          - "Comparer : regarder d'abord *les puissances*"
        voix_off: "À retenir. Mille, million, milliard : on multiplie par mille à chaque palier. En notation scientifique, un nombre entre un et dix, multiplié par une puissance de dix. Et pour comparer deux grandeurs, regardez d'abord les puissances."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "How long is a billion seconds? Orders of magnitude"
    legende: |
      A million seconds is about 11.6 days. A billion seconds? Almost 32 years. Between a million and a billion there is a factor of a thousand that intuition flattens. We learn to count in powers of 10, to write a number in scientific notation and to compare two quantities by their order of magnitude. Plus a warning about "billion" in other languages. Checked calculations. Series "Reading numbers without being fooled", toolbox.
    hashtags: [maths, ordersofmagnitude, numbers]
    scenes:
      - type: accroche
        texte: "A *million* seconds is about *11.6 days*"
        voix_off: "A million seconds is about eleven and a half days. What about a billion seconds?"
        verifier:
          - {expression: "1e6 / 86400", attendu: 11.6, libelle: "One million seconds, in days"}
      - type: exercice
        texte: "A *billion* seconds: *12 days*, *3 years* or *32 years*?"
        etiquette: "CHALLENGE"
        pause: 4
        voix_off: "Pick one before we go on: twelve days, three years, or thirty-two years?"
      - type: titre
        numero: 1
        texte: "Counting in powers of 10"
        voix_off: "To answer, let's count the zeros."
      - type: etapes
        texte: "Each step *multiplies by a thousand*"
        etapes:
          - "A thousand = 1,000 = *10³*"
          - "A million = 1,000,000 = *10⁶*"
          - "A billion = 1,000,000,000 = *10⁹*"
        voix_off: "A thousand is a one followed by three zeros: ten to the power three. A million, six zeros: ten to the six. A billion, nine zeros: ten to the nine. At each step, you multiply by a thousand."
      - type: formule
        texte: "A billion = *a thousand millions*"
        formule:
          - '10^{9}=10^{3}\times 10^{6}'
        voix_off: "So a billion is a thousand millions. If a million seconds is eleven and a half days, a billion is a thousand times longer."
        verifier:
          - {expression: "1e9 / 1e6", attendu: 1000, libelle: "A billion divided by a million"}
      - type: chiffre
        valeur: 31.7
        suffixe: {fr: " ans", en: " years"}
        texte: "for a billion seconds"
        voix_off: "The answer to the challenge: a billion seconds is almost thirty-two years. The words differ by one letter, but the gap is enormous."
        note: "10⁹ s ÷ (365.25 × 86,400 s per year) ≈ 31.7 years."
        verifier:
          - {expression: "1e9 / (365.25 * 86400)", attendu: 31.7, libelle: "One billion seconds, in years"}
      - type: titre
        numero: 2
        texte: "Scientific notation"
        voix_off: "To write very large and very small numbers without counting zeros, we use scientific notation."
      - type: formule
        texte: "A number *between 1 and 10*, times a power of 10"
        formule:
          - '45{,}000=4.5\times 10^{4}'
          - '0.003=3\times 10^{-3}'
        voix_off: "You write a number between one and ten, multiplied by a power of ten. Forty-five thousand is four point five times ten to the four: the decimal point moved four places. Zero point zero zero three is three times ten to the minus three: a negative power for numbers smaller than one."
        verifier:
          - {expression: "4.5 * 10**4", attendu: 45000, libelle: "4.5 × 10⁴"}
          - {expression: "3 * 10**-3", attendu: 0.003, libelle: "3 × 10⁻³"}
      - type: titre
        numero: 3
        texte: "Comparing by order of magnitude"
        voix_off: "The main benefit: comparing two quantities at a glance."
      - type: etapes
        texte: "Two *fictional* budgets"
        etapes:
          - "Project A: 2 million euros, or *2 × 10⁶*"
          - "Project B: 3 billion euros, or *3 × 10⁹*"
          - "Gap between the powers: 9 − 6 = *3 orders of magnitude*"
        voix_off: "Take two fictional budgets. Project A costs two million euros, two times ten to the six. Project B costs three billion, three times ten to the nine. Between the powers there are three steps: three orders of magnitude, meaning a factor of around a thousand."
      - type: chiffre
        valeur: 1500
        prefixe: "×"
        texte: "between the two budgets"
        voix_off: "The exact calculation gives a factor of fifteen hundred. The order of magnitude was enough to see that these two projects are not in the same league."
        note: "3 × 10⁹ ÷ (2 × 10⁶) = 1,500."
        verifier:
          - {expression: "3e9 / 2e6", attendu: 1500, libelle: "Ratio of the two budgets"}
      - type: texte
        texte: "False friend: in French, *billion* = *10¹²*"
        note: "In English, a billion is 10⁹; in French, a « billion » is a thousand times more."
        voix_off: "A classic trap when reading the foreign press: in French, and several other languages, the word billion means a million million, ten to the twelve. The English billion is called a milliard. One translation slip, and the figure is off by a factor of a thousand."
        verifier:
          - {expression: "1e12 / 1e9", attendu: 1000, libelle: "French billion / English billion"}
      - type: exercice
        texte: "Write *52 million* in scientific notation"
        pause: 6
        voix_off: "Your turn. How do you write fifty-two million in scientific notation?"
      - type: correction
        etapes:
          - "52,000,000: put the decimal point after the first digit"
          - "5.2: the point moved back 7 places"
        reponse: "5.2 × 10⁷"
        voix_off: "Fifty-two million is five, two, then six zeros. Put the decimal point after the first digit: five point two. It moved back seven places. The answer: five point two times ten to the seven."
        verifier:
          - {expression: "5.2 * 10**7", attendu: 52000000, libelle: "5.2 × 10⁷"}
      - type: etapes
        texte: "Key takeaways"
        etapes:
          - "Thousand, million, billion: *×1,000* at each step"
          - "Scientific notation: a number *between 1 and 10* × 10ⁿ"
          - "To compare: look at *the powers* first"
        voix_off: "Key takeaways. Thousand, million, billion: multiply by a thousand at each step. In scientific notation, a number between one and ten, times a power of ten. And to compare two quantities, look at the powers first."
      - type: fin
        texte: "Follow to learn to read the numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
