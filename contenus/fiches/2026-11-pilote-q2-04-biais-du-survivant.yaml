# Phase pilote ACTU-BASICS, vidéo 5 sur 5 : Q2.04 « Le biais du survivant » (SHORT, capsule de paradoxe)
# Fiche de conception : contenus/conception/Q2.04.yaml
# Sources lues le 2026-11-03 :
# - A. Wald, « A Method of Estimating Plane Vulnerability Based on Damage of Survivors », réédité par le CNA
#   (CRC 432, juillet 1980), https://apps.dtic.mil/sti/pdfs/ADA091073.pdf. Environ 60 % du texte lu mot à mot :
#   la méthode estime la probabilité qu'un avion soit abattu selon le NOMBRE d'impacts, à partir des avions
#   revenus (A_i) et du nombre d'avions engagés (N). Aucune zone de l'avion n'est nommée dans la partie lue.
# - M. Mangel et F. J. Samaniego, JASA 79(386), 1984, DOI 10.1080/01621459.1984.10478038 (notice Crossref).
# Script : proposition de ChatGPT (2e revue de la PR #15), intégrée telle quelle. Mécanisme général au
# conditionnel (« pouvaient », « pouvait »), sans zone précise de l'avion ni citation attribuée à Wald.
# Storyboard : les silhouettes d'avions qui s'effacent ne sont pas réalisables avec le moteur actuel
# (aucun modèle d'animation « avions ») ; remplacées par des cartes « observés / absents des données ».
# Statut : brouillon. Relecture de ChatGPT, puis validation de JG. Rien n'est publié.
