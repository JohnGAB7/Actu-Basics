theme: "Q2.04 · Le biais du survivant"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Reconnaître le biais du survivant : se demander ce qui manque dans les données"
    en:
      - "Spot survivorship bias: ask what is missing from the data"
  prerequis:
    fr: ["Aucun. Pour aller plus loin : S1.05, échantillon et biais de sélection"]
    en: ["None. To go further: S1.05, samples and selection bias"]
  hypotheses:
    fr: "Nombres fictifs (8 avions, 5 revenus ; 8 entreprises, 3 encore actives) pour illustrer le mécanisme"
    en: "Made-up numbers (8 planes, 5 returned; 8 companies, 3 still active) to illustrate the mechanism"

validation:   # Validation éditoriale de JG, commentaire du 2026-11-03 sur la PR #15 (publication non autorisée)
  statut: valide
  valide_par: "JG"
  date: "2026-11-03"

sources:
