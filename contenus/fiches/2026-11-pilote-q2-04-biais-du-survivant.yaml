editions:
  fr:
    titre: "Que disent les avions revenus ?"
    legende: |
      Pendant la Seconde Guerre mondiale, les analystes ont étudié les impacts visibles sur les avions qui revenaient de mission. Mais il manquait une information essentielle : les avions qui ne revenaient pas. C'est le biais du survivant : tirer une conclusion à partir des seuls cas qui ont passé un filtre de sélection, en oubliant ceux qui ont disparu avant d'être observés. Sources : A. Wald, « A Method of Estimating Plane Vulnerability Based on Damage of Survivors », réédition du Center for Naval Analyses (CRC 432), 1980 ; M. Mangel et F. J. Samaniego, « Abraham Wald's Work on Aircraft Survivability », Journal of the American Statistical Association, 1984. Pour aller plus loin : la leçon sur l'échantillon et le biais de sélection.
    hashtags: [statistiques, biaisdusurvivant, probabilites]
    scenes:
      - type: accroche
        texte: "Les avions revenus sont criblés d'impacts. *Que faut-il renforcer ?*"
        voix_off: "Pendant la Seconde Guerre mondiale, les analystes ont étudié les impacts visibles sur les avions qui revenaient de mission. Une première intuition semblait évidente : renforcer les zones qui présentaient le plus d'impacts."
      - type: texte
        texte: "Il manquait *les avions qui ne revenaient pas*"
        voix_off: "Mais il manquait une information essentielle : les avions qui ne revenaient pas."
      - type: etapes
        texte: "*Observés* et *absents*"
        disposition: cartes
        etapes:
          - "Observés : les avions *revenus*"
          - "Absents des données : les avions *perdus*"
        voix_off: "Les avions observés étaient précisément ceux qui avaient survécu. D'un côté, les avions revenus, que l'on pouvait examiner. De l'autre, les avions perdus, absents des données."
      - type: etapes
        texte: "Relire les *impacts*"
        etapes:
          - "Zone *très touchée* : un impact souvent supportable"
          - "Zone *peu touchée* : un impact pouvait *empêcher le retour*"
        note: "Mécanisme général : aucune zone précise de l'avion n'est avancée ici."
        voix_off: "Il fallait donc relire les impacts. Les zones très touchées sur ces appareils pouvaient être des zones où un impact était souvent supportable. À l'inverse, une zone peu touchée sur les avions revenus pouvait mériter une attention particulière : un impact à cet endroit pouvait empêcher l'avion de rentrer."
      - type: texte
        texte: "*Qui manque* dans les données, et *pourquoi* ?"
        voix_off: "La leçon n'est pas de regarder seulement les données disponibles. C'est aussi de se demander quelles données sont absentes, et pourquoi elles le sont."
      - type: texte
        texte: "Le *biais du survivant*"
        note: "Estimer la vulnérabilité à partir des survivants : méthode d'A. Wald (réédition CNA, 1980)."
        voix_off: "C'est le biais du survivant : tirer une conclusion à partir des seuls cas qui ont passé un filtre de sélection, en oubliant ceux qui ont disparu avant d'être observés."
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "What do the returning planes tell us?"
    legende: |
      During the Second World War, analysts examined the visible bullet holes on aircraft that returned from missions. But one crucial group was missing: the aircraft that never returned. This is survivorship bias: drawing conclusions from the cases that passed a selection filter while overlooking those that disappeared before they could be observed. Sources: A. Wald, "A Method of Estimating Plane Vulnerability Based on Damage of Survivors", Center for Naval Analyses reprint (CRC 432), 1980; M. Mangel and F. J. Samaniego, "Abraham Wald's Work on Aircraft Survivability", Journal of the American Statistical Association, 1984. To go further: the lesson on samples and selection bias.
    hashtags: [statistics, survivorshipbias, probability]
    scenes:
      - type: accroche
        texte: "The returning planes are riddled with holes. *What should be reinforced?*"
        voix_off: "During the Second World War, analysts examined the visible bullet holes on aircraft that returned from missions. An initial idea seemed obvious: reinforce the areas with the most damage."
      - type: texte
        texte: "Missing: *the aircraft that never returned*"
        voix_off: "But one crucial group was missing: the aircraft that never returned."
      - type: etapes
        texte: "*Observed* and *missing*"
        disposition: cartes
        etapes:
          - "Observed: the aircraft that *returned*"
          - "Missing from the data: the aircraft *lost*"
        voix_off: "The aircraft being examined were precisely the ones that had survived. On one side, the aircraft that returned, which could be examined. On the other, the aircraft that were lost, missing from the data."
      - type: etapes
        texte: "Rereading the *damage*"
        etapes:
          - "Area with *many* holes: damage often survivable"
          - "Area with *few* holes: damage there might have *prevented the return*"
        note: "General mechanism: no specific area of the aircraft is claimed here."
        voix_off: "So the damage had to be read again. Areas with many bullet holes on these aircraft could therefore be areas where damage was often survivable. By contrast, an area with few bullet holes on returning aircraft could deserve particular attention: damage there might have prevented an aircraft from making it back."
      - type: texte
        texte: "*Who is missing* from the data, and *why*?"
        voix_off: "The lesson is not to look only at the data we can see. We must also ask which data are missing, and why."
      - type: texte
        texte: "*Survivorship bias*"
        note: "Estimating vulnerability from the survivors: A. Wald's method (CNA reprint, 1980)."
        voix_off: "This is survivorship bias: drawing conclusions from the cases that passed a selection filter while overlooking those that disappeared before they could be observed."
      - type: fin
        texte: "Follow to learn to read the numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
