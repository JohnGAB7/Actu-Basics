editions:
  fr:
    titre: "Que disent les avions revenus ?"
    legende: |
      Pendant la Seconde Guerre mondiale, on observe les impacts sur les avions revenus de mission. Mais ces avions ne disent pas tout : ceux qui ont été abattus manquent aux données. Le statisticien Abraham Wald a mis au point une méthode pour estimer la vulnérabilité des avions à partir des dégâts des survivants, en tenant compte des avions perdus. C'est le biais du survivant : on ne voit que ce qui a survécu. Le même piège se cache derrière les vieux bâtiments « mieux construits » et les conseils des entreprises qui ont réussi. Sources : A. Wald, réédition du Center for Naval Analyses, 1980 ; M. Mangel et F. J. Samaniego, Journal of the American Statistical Association, 1984. Pour aller plus loin : la leçon sur l'échantillon et le biais de sélection.
    hashtags: [statistiques, biaisdusurvivant, probabilites]
    scenes:
      - type: accroche
        texte: "On compte les impacts sur les avions revenus. *Que nous apprennent-ils ?*"
        voix_off: "Seconde Guerre mondiale : on compte les impacts sur les avions qui rentrent de mission. Que nous apprennent-ils vraiment ?"
      - type: etapes
        texte: "Le *piège*"
        etapes:
          - "On n'observe que les avions *revenus*"
          - "Les avions abattus *manquent* aux données"
        voix_off: "Le piège est discret. On n'observe que les avions revenus. Ceux qui ont été abattus manquent aux données."
      - type: etapes
        texte: "La méthode d'*Abraham Wald*"
        etapes:
          - "Estimer la vulnérabilité à partir des *survivants*"
          - "En tenant compte des avions *perdus*"
        voix_off: "Le statisticien Abraham Wald a mis au point une méthode pour cela. Elle estime la vulnérabilité des avions à partir des dégâts observés sur les survivants. Et elle tient compte, par le calcul, des avions qui ne sont pas revenus."
      - type: texte
        texte: "Une zone *rarement touchée* sur les survivants ? Les avions touchés là ne sont *peut-être pas revenus*"
        note: "Illustration simplifiée du raisonnement, pas le détail de la méthode de Wald."
        voix_off: "Une illustration simple : si une zone est rarement touchée sur les avions revenus, c'est peut-être que les avions touchés là ne revenaient pas."
      - type: etapes
        texte: "Le *biais du survivant*, partout"
        etapes:
          - "Vieux bâtiments « mieux construits » ? Les *fragiles* ont été démolis"
          - "Conseils des entreprises qui ont *réussi* ? Celles qui ont fermé faisaient *peut-être pareil*"
        voix_off: "C'est le biais du survivant, et il est partout. Les vieux bâtiments semblent mieux construits, mais les plus fragiles ont été démolis. Et les conseils des entreprises qui ont réussi oublient celles qui ont fermé en faisant peut-être pareil."
      - type: texte
        texte: "Avant de conclure : *qui manque* dans les données ?"
        voix_off: "Avant de conclure, demandez-vous : qui manque dans les données ?"
      - type: fin
        texte: "Abonnez-vous pour apprendre à lire les chiffres."
        voix_off: "ACTU-BASICS. Éveiller par les chiffres."

  en:
    titre: "What do the returning planes tell us?"
    legende: |
      During the Second World War, the hits on planes returning from missions were studied. But those planes don't tell the whole story: the ones shot down are missing from the data. The statistician Abraham Wald developed a method to estimate how vulnerable planes were from the damage on the survivors, while accounting for the planes that were lost. That is survivorship bias: you only see what survived. The same trap lies behind old buildings that seem "better built" and the advice of companies that succeeded. Sources: A. Wald, Center for Naval Analyses reprint, 1980; M. Mangel and F. J. Samaniego, Journal of the American Statistical Association, 1984. To go further: the lesson on samples and selection bias.
    hashtags: [statistics, survivorshipbias, probability]
    scenes:
      - type: accroche
        texte: "We count the hits on the planes that came back. *What do they tell us?*"
        voix_off: "World War Two: the hits are counted on the planes coming back from missions. What do they really tell us?"
      - type: etapes
        texte: "The *trap*"
        etapes:
          - "We only see the planes that *came back*"
          - "The planes shot down are *missing* from the data"
        voix_off: "The trap is easy to miss. We only see the planes that came back. The ones shot down are missing from the data."
      - type: etapes
        texte: "*Abraham Wald's* method"
        etapes:
          - "Estimate vulnerability from the *survivors*"
          - "While accounting for the planes that were *lost*"
        voix_off: "The statistician Abraham Wald developed a method for exactly this. It estimates how vulnerable the planes were from the damage seen on the survivors. And it accounts, through calculation, for the planes that never came back."
      - type: texte
        texte: "An area *rarely hit* on the survivors? Planes hit there *may not have made it back*"
        note: "A simplified illustration of the reasoning, not the details of Wald's method."
        voix_off: "A simple illustration: if an area is rarely hit on the planes that returned, it may be because the planes hit there didn't make it back."
      - type: etapes
        texte: "*Survivorship bias*, everywhere"
        etapes:
          - "Old buildings \"better built\"? The *weak* ones were torn down"
          - "Advice from companies that *succeeded*? The ones that failed *may have done the same*"
        voix_off: "That's survivorship bias, and it's everywhere. Old buildings seem better built, but the weakest ones were torn down. And advice from successful companies leaves out the ones that failed, even though they may have done exactly the same things."
      - type: texte
        texte: "Before concluding: *who is missing* from the data?"
        voix_off: "Before concluding, ask yourself: who is missing from the data?"
      - type: fin
        texte: "Follow to learn to read the numbers."
        voix_off: "ACTU-BASICS. Enlightening through numbers."
