      - "Distinguer intérêt simple et intérêt composé, et calculer les deux"
      - "Capitaliser avec (1 + i)ⁿ et actualiser avec le facteur v = 1 ÷ (1 + i)"
      - "Comprendre le taux d'escompte d, l'intérêt payé d'avance, et pourquoi d < i"
      - "Passer d'un taux à un taux équivalent : mensuel, nominal, continu (δ)"
      - "Calculer une annuité certaine immédiate aₙ et due äₙ, et les relier"
    en:
      - "Tell simple from compound interest, and compute both"
      - "Accumulate with (1 + i)ⁿ and discount with the factor v = 1 ÷ (1 + i)"
      - "Understand the rate of discount d, interest paid in advance, and why d < i"
      - "Move between equivalent rates: monthly, nominal, continuous (δ)"
      - "Compute an annuity immediate aₙ and an annuity due äₙ, and link them"
  prerequis:
