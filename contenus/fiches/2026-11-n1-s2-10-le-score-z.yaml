id: 2026-11-n1-s2-10-le-score-z
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S2.10 · Le score z : comparer l'incomparable"

pedagogie:
  niveau: decouverte
  objectifs:
    fr:
      - "Calculer un score z"
      - "Comparer deux valeurs venant de distributions différentes grâce à la standardisation"
      - "Savoir que standardiser change l'échelle, pas la forme de la distribution"
    en:
      - "Compute a z-score"
      - "Compare two values from different distributions by standardising"
      - "Know that standardising changes the scale, not the shape of the distribution"
  prerequis:
    fr: ["S2.08 : variance et écart-type"]
    en: ["S2.08: variance and standard deviation"]
