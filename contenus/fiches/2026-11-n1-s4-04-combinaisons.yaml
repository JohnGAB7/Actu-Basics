# Niveau 1, vague 1, lot 4 : S4.04 « Combinaisons : choisir sans ordre » (EDUCATIONAL, leçon)
# Exemples fictifs : délégués d'une classe imaginaire, loto imaginaire à 5 numéros parmi 49.
# Statut : brouillon. En attente de relecture ChatGPT et de validation JG.
id: 2026-11-n1-s4-04-combinaisons
type_fiche: pedagogique
famille: apprendre_les_statistiques
format: educational
habillage_sonore: true
theme: "S4.04 · Combinaisons : choisir sans ordre"

pedagogie:
  niveau: decouverte
  objectifs:
