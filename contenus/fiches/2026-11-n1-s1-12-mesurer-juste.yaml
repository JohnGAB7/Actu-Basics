# Niveau 1, vague 1, lot 2 : S1.12 « Mesurer juste : fiabilité, validité et biais de mesure » (EDUCATIONAL)
# Fiche de conception : contenus/conception/S1.12.yaml
# Source lue le 2026-11-08 (résumé seulement) : D. Lazer, R. Kennedy, G. King et A. Vespignani, « The Parable
# of Google Flu: Traps in Big Data Analysis », Science 343 (6176), 14 mars 2014, p. 1203-1205,
# doi:10.1126/science.1248506 ; notice https://dash.harvard.edu/handle/1/12016836 : « In February 2013,
# Google Flu Trends (GFT) made headlines » ; « GFT was predicting more than double the proportion of doctor
# visits for influenza-like illness (ILI) » que les CDC. Le texte complet n'a pas pu être lu : aucun autre
