# Charte graphique provisoire (proposition technique, à valider par l'éditorial).
# Modifier ici les couleurs et polices : aucun changement de code nécessaire.
# Marque ACTU-BASICS (00_STRATEGY/BRAND_IDENTITY.md). Le nom est le même dans les deux langues.
marque:
  fr: "ACTU-BASICS"
  en: "ACTU-BASICS"
# Slogans officiels : à reproduire EXACTEMENT (un test le vérifie).
slogan:
  fr: "Éveiller par les chiffres."
  en: "Enlightening through numbers."

# Logo officiel (assets/brand/actu-basics/BRAND_GUIDELINES.md). Fichiers d'origine, jamais modifiés :
# seul un redimensionnement proportionnel est appliqué. S'ils manquent, rien n'est dessiné à leur place
# et le rendu final est refusé.
logo:
  actif: true
  dossier: assets/brand/actu-basics
  # Un logo par langue (chacun porte le slogan de sa langue) et par fond. Premier fichier trouvé dans l'ordre.
  fichiers:
    fr:
      clair: [logo-light.webp, logo-light.png]          # sur fond clair
      sombre: [logo-dark.webp, logo-dark.png]           # sur fond sombre (bleu nuit)
    en:
      clair: [logo-light-en.webp, logo-light-en.png]
      sombre: [logo-dark-en.webp, logo-dark-en.png]
  variante: auto          # auto (selon la luminosité du fond sous le logo) | clair | sombre
  zone_protection: 0.08   # espace libre exigé autour du logo, en part de sa largeur
  # Où et comment le logo apparaît. position : haut_gauche | haut_centre | haut_droite | centre |
  # bas_gauche | bas_centre | bas_droite. marge_px : retrait supplémentaire DANS la zone de sécurité.
  # La scène « fin » a une mise en page dédiée (texte, logo, slogan) : position ignorée.
  video:
    scenes: [fin]                 # discret : en fin de vidéo seulement
    largeur_px: 400               # ≈ 145 px sur un téléphone : nom lisible, slogan lisible (≥ 4 px)
    largeur_min_px: 320
    slogan: false                 # chaque logo porte déjà le slogan de sa langue
  carrousel:
    scenes: [fin]                 # dernière diapositive ; ajouter « accroche » pour la couverture
    largeur_px: 460
    largeur_min_px: 360
    slogan: false                 # chaque logo porte déjà le slogan de sa langue
    # Pour les scènes autres que « fin » (ex. couverture du carrousel) :
    position: haut_droite
    largeur_autres_px: 170
    marge_px: 0
  # Lisibilité sur téléphone (écran de 390 px de large). Hauteur des lettres de chaque logo, en part de
  # sa largeur, mesurée sur les fichiers officiels : à remesurer si un logo change.
  lisibilite:
    fr: {nom: 0.110, slogan: 0.036}
    en: {nom: 0.105, slogan: 0.028}
    nom_min_px: 8                 # « ACTU-BASICS » reconnaissable
    slogan_min_px: 4              # slogan du logo lisible (fin de vidéo et de carrousel)
  lecon:                          # cours YouTube 16:9 (format youtube_lesson)
    scenes: [fin]
    largeur_px: 380
    largeur_min_px: 300
    slogan: false
  couverture:                     # miniature.jpg (première image de la vidéo)
    actif: true
    position: haut_droite
    largeur_px: 260
    marge_px: 0
  # Logo mobile (décision de JG, 21/11/2026) : sur les vidéos, plus de marque FIXE à l'écran (nom
  # « ACTU-BASICS » en haut de chaque image), que les plateformes peuvent traiter comme un filigrane
  # statique. À la place, le logo officiel glisse lentement dans le bandeau du haut, aller-retour,
  # sans jamais être déformé, recoloré ni recouvert (translation seule, zone de protection libre).
  # La scène « fin » garde sa mise en page dédiée (le logo mobile s'efface pendant le fondu).
  # actif: false -> aucune marque pendant la vidéo (le logo YouTube peut alors être ajouté par
  # l'option « filigrane » de YouTube Studio).
  mobile:
    actif: true
    formats: [video, lecon]
    # Signature discrète, reconnaissable à son symbole : le nom et le slogan se lisent sur la scène de fin.
    # 150 px en vertical (≈ 54 px sur téléphone) : au-delà, le bandeau réservé fait déborder les scènes chargées.
    largeur_px: {video: 150, lecon: 170}
    periode_s: 40                 # durée d'un aller-retour complet le long du bandeau
    sauf_scenes: [fin]
couleurs:
  fond: "#0B1526"        # bleu nuit (haut de l'image)
  fond_bas: "#14284A"    # bas du dégradé
  texte: "#F5F3EE"       # blanc cassé
  accent: "#F2B134"      # jaune « chiffre »
  secondaire: "#8FA3BF"  # gris bleuté (sources, pied de page)
  barre: "#3E7CB1"
# Accroches, titres de graphique et sources en capitales (police d'affichage).
accroche_majuscules: true
polices:
  # Police d'affichage condensée et très grasse : accroches, chiffre clé, titres.
  affichage: ["Anton-Regular.ttf", "Inter-Black.otf", "DejaVuSans-Bold.ttf", "arialbd.ttf"]
  # Recherche dans l'ordre : production/polices/, puis polices système.
  # Inter (licence libre OFL) : https://rsms.me/inter/ — paquet Linux « fonts-inter ».
  regulier: ["Inter-Regular.otf", "Inter-Regular.ttf", "DejaVuSans.ttf", "Arial.ttf"]
  gras: ["Inter-Bold.otf", "Inter-Bold.ttf", "DejaVuSans-Bold.ttf", "Arial Bold.ttf", "arialbd.ttf"]
  noir: ["Inter-Black.otf", "Inter-Black.ttf", "Inter-Bold.otf", "DejaVuSans-Bold.ttf", "arialbd.ttf"]
formats:
  video: {largeur: 1080, hauteur: 1920, fps: 30}
  carrousel: {largeur: 1080, hauteur: 1350}
  lecon: {largeur: 1920, hauteur: 1080, fps: 30}   # cours YouTube horizontal (format youtube_lesson)
# Zones de sécurité vidéo (pixels) : l'interface TikTok / Reels / Shorts
# recouvre le bas et la droite de l'écran.
zones_securite_video: {haut: 250, bas: 480, gauche: 90, droite: 190}  # couvre TikTok, Reels et Shorts (plateformes.yaml)
marges_carrousel: {haut: 150, bas: 150, gauche: 100, droite: 100}
# Cours 16:9 : pas d'interface par-dessus l'image, marges de confort (titres et sous-titres YouTube).
zones_securite_lecon: {haut: 80, bas: 110, gauche: 150, droite: 150}

# Habillage sonore (prototype synthétisé, lmec/son.py) : activé par fiche avec « habillage_sonore: true ».
son:
  actif: true
  signature_debut: true      # deux notes au tout début
  signature_fin: true        # signature complète sur la scène de fin (logo)
  signature_db: -12
  nappe: true                # accord tenu très doux sous la voix
  nappe_db: -30              # niveau sans voix
  nappe_sous_voix_db: -38    # niveau quand la voix parle
  reperes: true              # tic du compte à rebours, carillon des révélations
  tic_db: -26
  revele_db: -20

# Parcours du spectateur (décision de JG, 21/11/2026). Contrôlé par lmec/qc.py (controler_parcours).
# - youtube_lesson (épisode long) : scène « accueil » parmi les 3 premières (APRÈS l'ouverture : la
#   première image reste la question de l'épisode) et scène « cloture » juste avant « fin » ; la clôture
#   doit orienter (épisode suivant ou autres vidéos) et inviter à s'abonner, aimer et partager. Bloquant.
# - educational (extrait d'un épisode) et short (bande-annonce) : pas d'accueil (il ferait fuir dès les
#   premières secondes) ; la clôture renvoie vers l'épisode complet. Avertissement.
# Les mots-clés servent au contrôle (texte affiché + voix off, sans tenir compte de la casse).
parcours_spectateur:
  accueil_rang_max: 3
  bloquant: [youtube_lesson]
  accueil: {fr: [bonjour, bienvenue, merci], en: [hello, hi, welcome, thank]}
  invitations:
    suite: {fr: [épisode suivant, prochain épisode, autres vidéos, autre vidéo, playlist, la suite],
            en: [next episode, next video, other videos, playlist, watch next, up next]}
    abonnement: {fr: [abonne], en: [subscrib]}
    like: {fr: [like, j'aime, pouce], en: [like, thumbs up]}
    partage: {fr: [partag], en: [share]}
  renvoi_episode: {fr: [épisode complet, vidéo complète, en entier], en: [full episode, full video, whole episode]}
  # Textes types (à adapter à chaque épisode, jamais lus mot pour mot d'un épisode à l'autre) :
  modeles:
    accueil:
      fr: "Bonjour, et merci d'être là. Dans cet épisode : {promesse}."
      en: "Hi, and thanks for being here. In this episode: {promesse}."
    cloture:
      fr: "Si cet épisode vous a aidé, abonnez-vous, laissez un like et partagez-le à quelqu'un que ça aidera. Un exercice vous bloque ? Posez votre question en commentaire : on vous aide gratuitement. La suite : {suivant}."
      en: "If this episode helped, subscribe, leave a like and share it with someone it will help. Stuck on an exercise? Ask in the comments and we'll help you for free. Up next: {suivant}."
    renvoi_short:
      fr: "L'épisode complet est sur la chaîne YouTube ACTU-BASICS."
      en: "The full episode is on the ACTU-BASICS YouTube channel."
