# Configuration de la voix off. Aucune clé ici : les clés vont dans .env (local) ou les secrets GitHub.
#
# Fournisseur utilisé par défaut. Peut être remplacé à la volée :
#   python production/produire.py FICHE --voix openai
#   ou variable d'environnement LMEC_TTS=elevenlabs
fournisseur: kokoro         # kokoro | piper | openai | elevenlabs | manuel | test
# Choix définitif de JG (2026-11-03, PR #15) : Kokoro pour le FR (ff_siwis) et pour l'EN. Piper reste le secours.

# Gratuité imposée (décision de JG) : aucun service payant, aucune clé, aucun crédit.
# Avec true, openai et elevenlabs sont refusés et aucune requête payante ne part.
# Passer à false est une décision de dépense, réservée à JG.
gratuit_uniquement: true

# Si le fournisseur principal est inutilisable (paquet ou modèle absent), on bascule ici,
# et le rapport le signale.
secours:
  kokoro: piper

voix:
  fr:
    kokoro:
      voix: ff_siwis                      # choisie par JG après écoute
      langue: fr-fr                       # phonémisation espeak-ng
      vitesse: 1.0
    piper:
      modele: fr-siwis-medium.onnx        # voix féminine, licence CC BY 4.0
      lenteur: 1.05                       # > 1 = plus lent (0.95 = plus vif)
      # Voix d'homme (basse qualité, monotone : voir docs/technique/voix-off.md) :
      # modele: fr-gilles-low.onnx
    openai:
      modele: gpt-4o-mini-tts
      voix: nova
      consignes: "Voix de journaliste française, posée et claire. Articule les nombres."
    elevenlabs:
      voice_id: ""                        # à choisir dans la bibliothèque ElevenLabs
      modele: eleven_multilingual_v2
      reglages: {stability: 0.5, similarity_boost: 0.75}
  en:
    kokoro:
      voix: af_heart                      # choisie par JG après écoute
      langue: en-us
      vitesse: 1.0
    piper:
      modele: en-us-libritts-high.onnx    # 904 locuteurs, licence CC BY 4.0
      locuteur: 0                         # numéro du locuteur (0 à 903) : à choisir à l'oreille
                                          # voix d'homme comparées : 117, 27, 423, 855
      lenteur: 1.0
    openai:
      modele: gpt-4o-mini-tts
      voix: onyx
      consignes: "Calm, clear news-explainer voice. Articulate numbers."
    elevenlabs:
      voice_id: ""
      modele: eleven_multilingual_v2
      reglages: {stability: 0.5, similarity_boost: 0.75}

# Lexique de prononciation : appliqué UNIQUEMENT au texte envoyé à la synthèse,
# jamais aux sous-titres ni aux images. Mot entier, sensible à la casse.
prononciation:
  fr:
    ONU: "Onu"
    DESA: "Désa"
    # Kokoro lisait « aktybazik ». Écriture phonétique pour la voix seulement (« actu bèï-siks ») ;
    # le nom de marque écrit reste ACTU-BASICS dans les images et les sous-titres. À valider à l'oreille par JG.
    ACTU-BASICS: "Actu Bèyssixe"
  en:
    UN: "U.N."
    DESA: "Desa"
    mid-2080s: "mid twenty-eighties"

# Modèle Kokoro-82M au format ONNX (publication GitHub du projet kokoro-onnx), vérifié par empreinte SHA-256.
# Licences et versions : docs/voice-licenses.md
kokoro_telechargements:
  kokoro-v1.0.onnx:
    url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
    sha256: 7d5df8ecf7d4b1878015a32686053fd0eebe2bc377234608764cc0ef3636a6c5
  voices-v1.0.bin:
    url: https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
    sha256: bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d

# Modèles Piper téléchargeables (python production/telecharger_voix.py).
piper_telechargements:
  fr-siwis-medium.onnx: https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-siwis-medium.tar.gz
  en-us-libritts-high.onnx: https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-en-us-libritts-high.tar.gz
  # Voix d'homme française (CC0), à décommenter pour l'utiliser :
  # fr-gilles-low.onnx: https://github.com/rhasspy/piper/releases/download/v0.0.2/voice-fr-gilles-low.tar.gz
