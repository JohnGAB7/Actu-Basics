# VALIDATION FINALE — lancée à la main : onglet Actions → « Validation finale » → Run workflow.
# Refuse toute fiche non validée ou avec une erreur bloquante, y compris une voix absente
# ou de test. Seuls les fichiers produits ici sont prêts à publier (publication toujours manuelle).
# Autorisation : le job attend l'approbation de l'environnement GitHub « production » (relecteur
# requis : JG). C'est cette approbation, liée à ce run donc à ce commit, qui autorise le rendu ;
# « valide_par » dans la fiche n'est qu'une métadonnée. Le manifeste (sortie/manifeste.json)
# consigne commit, empreintes et acteur. Rendu final depuis main seulement (contenu fusionné).
name: Validation finale

on:
  workflow_dispatch:
    inputs:
      fiche:
        description: "Chemin de la fiche validée (ex. contenus/fiches/2026-11-pic-population-mondiale.yaml)"
        required: true
      voix:
        description: "Fournisseur de voix"
        type: choice
        options: [kokoro, piper, openai, elevenlabs]
        default: kokoro

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    environment: production   # Settings → Environments → production → Required reviewers : JG
    timeout-minutes: 240   # vertical 9:16 puis 16:9 YouTube ; un épisode long (EP-S2A, 30 min) prend environ 2 h 30
    steps:
      - name: Rendu final depuis main seulement
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Le rendu final se lance depuis main (contenu relu et fusionné), pas depuis ${{ github.ref }}." >&2
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            production/requirements*.txt
            production/contraintes.txt

      - name: Outils système (ffmpeg, police Inter)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter

      - name: Dépendances Python
        run: pip install -r production/requirements.txt -r production/requirements-voix.txt pytest -c production/contraintes.txt

      - name: Tests
        run: python -m pytest production/tests -q

      - name: Modèles de voix (cache)
        if: github.event.inputs.voix == 'piper' || github.event.inputs.voix == 'kokoro'
        uses: actions/cache@v4
        with:
          path: production/voix
          key: voix-${{ hashFiles('production/tts.yaml') }}

      - name: Téléchargement des voix manquantes
        if: github.event.inputs.voix == 'piper' || github.event.inputs.voix == 'kokoro'
        run: python production/telecharger_voix.py

      # Cache des phrases déjà synthétisées, un par fournisseur : relancer un rendu dont le
      # texte n'a pas changé ne refacture rien. Fichiers nommés par l'empreinte
      # (fournisseur + configuration complète de la voix + texte exact envoyé).
      - name: Cache des voix déjà synthétisées (restauration)
        uses: actions/cache/restore@v4
        with:
          path: .cache-tts
          key: tts-${{ github.event.inputs.voix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: tts-${{ github.event.inputs.voix }}-

      - name: Rendu final (refuse tout ce qui n'est pas prêt)
        env:
          FICHE: ${{ github.event.inputs.fiche }}
          VOIX: ${{ github.event.inputs.voix }}
          # Secrets : Settings → Secrets and variables → Actions. Jamais dans le dépôt.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python production/produire.py "$FICHE" --mode final --voix "$VOIX"

      # Même fiche, déclinaison 16:9 pour YouTube (sortie/<id>-16x9/). Un SHORT est ignoré.
      - name: Rendu final 16:9 YouTube (même fiche)
        env:
          FICHE: ${{ github.event.inputs.fiche }}
          VOIX: ${{ github.event.inputs.voix }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python production/produire.py "$FICHE" --mode final --voix "$VOIX" --horizontal --sortie sortie-16x9
          shopt -s nullglob
          for d in sortie-16x9/*-16x9; do cp -r "$d" sortie/; done
          cat sortie-16x9/resume.md >> sortie/resume.md

      - name: Manifeste du rendu (commit, empreintes, autorisation)
        env:
          FICHE: ${{ github.event.inputs.fiche }}
          VOIX: ${{ github.event.inputs.voix }}
          ENVIRONNEMENT_GITHUB: production
        run: python production/manifeste.py "$FICHE" --sortie sortie --voix "$VOIX"

      # Sauvegardé même en cas de refus : une voix payée n'est jamais perdue.
      - name: Cache des voix déjà synthétisées (sauvegarde)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache-tts
          key: tts-${{ github.event.inputs.voix }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Résumé lisible dans GitHub
        if: always()
        run: |
          if [ -f sortie/resume.md ]; then cat sortie/resume.md >> "$GITHUB_STEP_SUMMARY"; else echo "Aucun résumé produit." >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Fichiers prêts à publier
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-${{ github.run_number }}
          path: sortie/
          retention-days: 30

      - name: Rapport de refus
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: refus-${{ github.run_number }}
          path: sortie/**/rapport-qc.md
          retention-days: 14
