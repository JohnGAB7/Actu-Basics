name: Provenance des voix Kokoro

# Vérifie que les voix ff_siwis et af_heart du fichier voices-v1.0.bin (sans licence écrite)
# sont identiques aux fichiers officiels du dépôt hexgrad/Kokoro-82M (licence Apache-2.0).
# Lecture publique sur Hugging Face, sans compte, sans clé, sans coût (hors minutes Actions).
on:
  pull_request:
    paths: ["production/tts.yaml", "production/verifier_provenance_voix.py", ".github/workflows/provenance-voix.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dépendances
        run: pip install -r production/requirements.txt
      - name: Fichier de voix utilisé (vérifié par SHA-256)
        run: |
          mkdir -p production/voix
          curl -sSL -o production/voix/voices-v1.0.bin \
            https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin
          echo "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d  production/voix/voices-v1.0.bin" | sha256sum -c
      - name: Comparaison avec les voix officielles
        run: python production/verifier_provenance_voix.py --sortie provenance-voix.md
      - name: Résumé
        if: always()
        run: cat provenance-voix.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provenance-voix
          path: provenance-voix.md
