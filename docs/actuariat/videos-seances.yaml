# Registre des vidéos Actu-Basics utilisées à l'étape 1 « Vidéo » des séances du parcours actuariel
# (https://github.com/JohnGAB7/parcours-actuariel). Voir docs/actuariat/PARCOURS-PLUS-ET-SEANCES.md.
#
# Circuit (état du 2026-11-23) : un module du parcours = un épisode long Actu-Basics ; chaque séance pointe son chapitre.
# L'entrée d'Actu-Basics est a-produire/<module>.md, déposé dans le parcours quand JG maîtrise le module.
#
# Champs d'un module :
#   module         identifiant du module dans le parcours
#   episode        épisode Actu-Basics du module
#   entree         fichier a-produire attendu dans le parcours (absent tant que le module n'est pas maîtrisé)
#   entree_recue   commit du fichier a-produire une fois déposé (null avant)
# Champs d'une séance :
#   seance         identifiant de la séance (contenus/<module>/sNN.yaml)
#   source_seance  commit de la séance dont les brouillons reprennent les chiffres
#   chapitres      leçons Actu-Basics (fiches contenus/conception/<lecon>.yaml) qui servent la séance
#   etat           a_preparer | brouillon | attend_a_produire | relue | validee_jg | rendue | site | publiee
#   provisoire     true tant que video_fr / video_en pointent vers le MP4 du site et pas encore vers YouTube
#   video_fr, video_en   URL publiques, une fois publiées (vides avant)
#   debut, fin     chapitre utile dans l'épisode, en secondes (vides avant le rendu)
# Rien n'est publié sans l'accord de JG : une URL n'apparaît ici qu'après publication.
version: 2
modules:
  - module: a1
    episode: EP-A1
    entree: a-produire/A1.md
    entree_recue: null
    seances:
      - seance: a1/s01
        titre: "Intérêt composé et annuités certaines"
        source_seance: "JohnGAB7/parcours-actuariel@ec63bf3:contenus/a1/s01.yaml"
        chapitres: [A1.01, A1.03, A1.04]
        capsule: A1-C1         # « La valeur du temps », 3 min, faite pour l'étape « Vidéo » (fiche contenus/fiches/2026-11-act-a1-c01-la-valeur-du-temps.yaml)
        etat: site             # validée par JG le 23/11/2026 : sur le site d'abord, remplacée par YouTube à la publication
        video_fr: "https://johngab7.github.io/Actu-Basics/videos/parcours-actuariel/a1-c01-la-valeur-du-temps-fr.mp4"
        video_en: "https://johngab7.github.io/Actu-Basics/videos/parcours-actuariel/a1-c01-the-value-of-time-en.mp4"
        sous_titres_fr: "https://johngab7.github.io/Actu-Basics/videos/parcours-actuariel/a1-c01-la-valeur-du-temps-fr.vtt"
        sous_titres_en: "https://johngab7.github.io/Actu-Basics/videos/parcours-actuariel/a1-c01-the-value-of-time-en.vtt"
        provisoire: true       # fichier MP4 du site ; à remplacer par l'URL YouTube dès la publication (les vues comptent alors sur YouTube)
        debut: null
        fin: null

  - module: a3
    episode: EP-A3
    entree: a-produire/A3.md
    entree_recue: null
    seances:
      - seance: a3/s01
        titre: "Force de mortalité et espérance de vie"
        source_seance: "JohnGAB7/parcours-actuariel@41bbd7e:contenus/a3/s01.yaml"
        chapitres: [A3.01]
        etat: brouillon        # option C (JG, 23/11/2026) ; sources INSEE, SSA et MK attendues (Perplexity)
        video_fr: null
        video_en: null
        debut: null
        fin: null
      - seance: a3/s02
        titre: "Valeur actuelle d'une assurance"
        source_seance: "JohnGAB7/parcours-actuariel@ec63bf3:contenus/a3/s02.yaml"
        chapitres: [A3.02, A3.03]
        etat: brouillon        # à recaler sur 2,5 %
        video_fr: null
        video_en: null
        debut: null
        fin: null
