# Fiche de CONCEPTION d'un épisode ACTU-BASICS (avant tout script).
# Elle précède la fiche de production (modeles/fiche-pedagogique.yaml), que le moteur lit.
# Programme de référence : programme/ (PDF dans programme/sortie/ après construction).
# Rubriques expliquées : programme/sections/06-fiche-type.md

id_programme: ""                # ex. S2.05 : identifiant stable du programme, ne change jamais
statut: brouillon               # brouillon | revue_claude | revue_chatgpt | valide_jg

titres:
  fr: ""
  en: ""                        # titre naturel, pas une traduction
question_centrale:
  fr: ""
  en: ""

position:
  pilier: statistiques          # statistiques | econometrie | quotidien | actualite | boite_a_outils
  niveau: 1                     # 1 decouverte | 2 lycee | 3 licence | 4 master
  module: ""                    # ex. S2
  rang_dans_module: 1

public:
  prerequis: []                 # identifiants du programme, ex. [S2.04, S2.03]
  niveau_maths: M0              # M0 à M4
  rappel_conseille: []          # ex. [M1.01]

objectifs:                      # verbes observables : calculer, distinguer, interpréter, repérer…
  fr: [""]
  en: [""]

intuition: ""                   # l'image qui doit rester, avant toute formule
exemple_fil_rouge: ""
exemple_reel:                   # facultatif ; obligatoirement sourcé
  description: ""
  source: {organisme: "", titre: "", url: "", date_publication: "", periode_donnees: "", consulte_le: ""}

deroule:                        # question, intuition, donnees, raisonnement, formalisation,
  - {etape: question, contenu: ""}   # exercice, correction, application, limites, rappel
  - {etape: intuition, contenu: ""}

formules:
  - {formule: "", explication_symboles: "", conditions: ""}

calculs_a_verifier:             # repris tels quels dans le bloc « verifier » de la fiche de production
  - {expression: "", attendu: 0, libelle: ""}

idees_fausses:
  - {idee: "", desamorcee_a_l_etape: ""}

exercice:
  question: ""
  correction: ""
  pause_secondes: 5

duree_estimee_min: [0, 0]       # estimée d'après le contenu, mesurée après synthèse vocale
format: educational             # short | educational | youtube_lesson
raison_du_format: ""
derives_short: []               # SHORT d'accroche tirés de la vidéo

adaptation_en: ""               # ce qui change (exemples, formulations) et ce qui ne change pas (raisonnement, nombres)
licences: ""                    # données, visuels, musique

controle:
  test_du_debutant: ""          # le spectateur peut-il réexpliquer et refaire un calcul ?
  relecture_definitions: ""     # nom du relecteur, date
  controle_mobile: ""
